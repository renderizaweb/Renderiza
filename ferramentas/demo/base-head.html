<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">

  <meta name="theme-color" content="#1d1b16">
  <meta name="robots" content="noindex,nofollow">
  <title>{{titulo}}</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23ffde00'/%3E%3Cpath fill='%231d1b16' d='M24 12C13 12 5 24 5 24s8 12 19 12 19-12 19-12-8-12-19-12Zm0 20a8 8 0 1 1 0-16 8 8 0 0 1 0 16Z'/%3E%3Ccircle cx='24' cy='24' r='4' fill='%231d1b16'/%3E%3C/svg%3E">
  <script>document.documentElement.classList.add("js")</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family={{fonte_link}}&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root{--green:#1d1b16;--green-2:#2e2b22;--orange:#f2c500;--orange-deep:#7a5f00;--mustard:#ffde00;--mustard-soft:#fff3a6;--sage:#fff6c9;--sage-2:#efe2a3;--ink:#1d1b16;--muted:#5f5a4b;--paper:#fffdf6;--cream:#fff8d9;--line:#eee4bf;--container:min(1180px,calc(100% - 64px));--display:{{fonte_css}}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:100px}body{margin:0;color:var(--ink);background:var(--paper);font-family:"DM Sans",system-ui,sans-serif;font-size:1rem;line-height:1.65;overflow-x:hidden}img{display:block;max-width:100%}a{color:inherit}button{font:inherit;cursor:pointer;color:inherit}button:disabled{cursor:default}a,button{-webkit-tap-highlight-color:transparent}figure,p,h1,h2,h3,blockquote{margin:0}h1,h2,h3{line-height:1.06}h1,h2{font-family:var(--display);font-weight:800;letter-spacing:-.03em;text-wrap:balance}h2{font-size:clamp(2.2rem,3.9vw,3.2rem)}h2 em,h1 em{font-style:normal}h2 em{background:linear-gradient(transparent 60%,var(--mustard) 60%,var(--mustard) 92%,transparent 92%);padding-inline:.06em;-webkit-box-decoration-break:clone;box-decoration-break:clone}[hidden]{display:none!important}:focus-visible{outline:3px solid var(--orange);outline-offset:5px}.container{width:var(--container);margin-inline:auto}.section{padding-block:104px}.eyebrow{font-size:.8125rem;letter-spacing:.14em;font-weight:700;margin-bottom:18px;color:var(--orange-deep);text-transform:uppercase}.skip-link{position:fixed;top:-100px;left:1rem;z-index:100;padding:1rem;background:#fff}.skip-link:focus{top:1rem}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

/* marca */
.logo{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:var(--green);flex-shrink:0}.logo-mark{display:grid;place-items:center;color:var(--green);width:50px;height:50px;border-radius:14px;overflow:hidden;background:var(--mustard);flex-shrink:0;box-shadow:0 4px 12px #1d1b1626}.logo-mark img{width:100%;height:100%;object-fit:cover;transform:scale(1.1)}.logo-text{display:flex;flex-direction:column;line-height:1}.logo-text b{font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-.02em}.logo-text small{font-size:.6875rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--orange-deep);margin-top:5px}.site-footer .logo{color:#fff}.site-footer .logo-text small{color:var(--mustard)}

/* topo e cabeçalho */
.topline{background:var(--green);color:#efeadb;font-size:.8125rem}.topline .container{display:flex;align-items:center;justify-content:space-between;min-height:36px;gap:1rem}.topline a{text-decoration:none}.topline .stars{font-size:.7rem;margin-right:6px}.site-header{position:sticky;top:0;background:rgba(255,253,246,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:30;border-bottom:1px solid var(--line)}.header-inner{min-height:84px;display:flex;align-items:center;justify-content:space-between;gap:28px}.desktop-nav{display:flex;align-items:center;gap:24px}.desktop-nav a{text-decoration:none;font-size:.875rem;font-weight:600;position:relative}.desktop-nav a::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:3px;border-radius:2px;background:var(--orange);transform:scaleX(0);transition:transform .25s;transform-origin:left}.desktop-nav a:hover::after{transform:scaleX(1)}
.button{display:inline-flex;gap:12px;align-items:center;justify-content:center;min-height:52px;padding:14px 23px;background:var(--green);color:#fff;border:0;border-radius:40px;text-decoration:none;font-weight:700;line-height:1.4;transition:background .2s,transform .2s,box-shadow .2s}.button:hover{background:var(--green-2);transform:translateY(-2px);box-shadow:0 10px 24px #1d1b1633}.button svg{width:22px;height:22px}.header-cta{font-size:.875rem;min-height:46px;padding:12px 20px}.header-cta span{font-size:1.2rem}.button--mustard{background:var(--mustard);color:var(--green)}.button--mustard:hover{background:#ffe94d}.menu-button{display:none;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--green);align-items:center;justify-content:center}.menu-button svg{width:24px;height:24px}.mobile-nav{padding:10px 24px 22px;background:var(--paper);border-top:1px solid var(--line)}.mobile-nav a{display:block;text-decoration:none;padding:11px 0;border-bottom:1px solid #f3ecd0;font-weight:500}.mobile-nav a:last-child{border:0;font-weight:700;color:var(--orange-deep)}.text-link{display:inline-flex;align-items:center;gap:12px;font-size:1rem;text-decoration:none;font-weight:700;color:var(--orange-deep);line-height:1.4}.text-link span{font-size:1.2rem;transition:transform .2s}.text-link:hover{text-decoration:underline;text-underline-offset:5px}.text-link:hover span{transform:translate(2px,-2px)}.text-link--light{color:#fff}

/* hero */
.hero{position:relative;isolation:isolate;overflow:hidden;background:var(--green);color:#fff}.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 93% 12%,#ffde00 0 36px,transparent 37px),radial-gradient(circle at 87% 4%,#f2c500 0 52px,transparent 53px),radial-gradient(900px 520px at 80% 45%,#ffde0022,transparent 70%)}.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:72px;padding-block:64px 56px;min-height:690px}.hero .eyebrow{color:var(--mustard);display:flex;align-items:center;gap:12px;letter-spacing:.06em;text-transform:none;font-size:.9375rem}.small-line{width:25px;height:2px;background:currentColor}.hero h1{font-size:clamp(3.2rem,6vw,5.2rem);max-width:640px;line-height:1}.hero h1 em{color:var(--mustard);display:block}.hero-intro{color:#e6e0cd;font-size:1.25rem;max-width:500px;margin-top:22px}.hero-actions{display:flex;align-items:center;flex-wrap:wrap;gap:22px;margin-top:32px}.hero-actions .text-link{font-size:.9375rem}.hero-proof{display:flex;align-items:center;flex-wrap:wrap;gap:14px 26px;margin-top:36px}.proof-google{display:inline-flex;align-items:center;gap:14px;color:#efeadb;text-decoration:none}.hero-proof-score{font-family:var(--display);font-size:2rem;font-weight:800;letter-spacing:-.04em}.stars{color:var(--mustard);letter-spacing:.13em}.proof-google .stars{font-size:.875rem;display:block;line-height:1.2}.proof-caption{font-size:.8125rem;color:#cfc8b3}.proof-badge{display:inline-flex;align-items:center;gap:9px;padding:9px 16px 9px 12px;border:1px solid #ffffff38;border-radius:40px;font-size:.8125rem;color:#fff;background:#ffffff12;text-decoration:none;transition:background .2s}.proof-badge:hover{background:#ffffff24}.proof-badge svg{width:20px;height:20px;color:var(--mustard)}.hero-visual{position:relative;padding:10px 0 18px}.hero-photo{position:relative;border:7px solid var(--mustard);border-radius:180px 180px 16px 16px;overflow:hidden;transform:rotate(2deg);background:var(--orange);box-shadow:0 26px 70px #0006}.hero-photo>img{width:100%;height:540px;object-fit:cover;object-position:50% 30%}.address-tag{position:absolute;display:flex;gap:12px;align-items:center;left:-46px;bottom:0;background:#fff;color:var(--green);padding:14px 20px 14px 14px;box-shadow:0 10px 36px #0005;border-radius:14px;font-size:.875rem;line-height:1.45;text-decoration:none;z-index:2;transition:transform .2s}.address-tag:hover{transform:translateY(-3px)}.address-tag strong{font-weight:700}.address-tag small{display:block;color:var(--muted);font-size:.75rem}.tag-icon{display:grid;place-content:center;width:36px;height:36px;background:var(--mustard);color:var(--green);border-radius:50%}.tag-icon svg{width:18px;height:18px}.hero-bottom{display:flex;align-items:center;justify-content:space-between;gap:20px;border-top:1px solid #ffffff22;padding-block:20px;color:#cfc8b3;font-size:.8125rem}.hero-bottom>a{text-decoration:none;font-size:1.35rem;color:#fff}.hero-note{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap}.hero-note b{color:#fff;font-weight:700}.note-dot{width:8px;height:8px;border-radius:50%;background:var(--mustard);box-shadow:0 0 0 4px #ffde0033;flex-shrink:0}

/* faixa */
.marquee{background:var(--mustard);color:var(--green);overflow:hidden}.marquee-track{display:flex;width:max-content;animation:marquee 36s linear infinite}.marquee:hover .marquee-track{animation-play-state:paused}.marquee-group{display:flex;align-items:center;gap:28px;padding:18px 14px;font-family:var(--display);font-size:.9375rem;font-weight:800;white-space:nowrap;text-transform:uppercase;letter-spacing:.03em}.marquee-group i{font-style:normal;color:var(--orange-deep);font-size:1rem}@keyframes marquee{to{transform:translateX(-50%)}}

/* sobre */
.story-section{background:#fff;overflow:hidden}.story-grid{display:grid;grid-template-columns:1fr 1fr;gap:96px;align-items:center}.story-photos{position:relative;padding-right:92px;padding-bottom:84px}.story-main{height:500px;overflow:hidden;border-radius:160px 16px 16px 16px;background:var(--sage)}.story-main img{width:100%;height:100%;object-fit:cover;object-position:50% 40%}.polaroid{position:absolute;background:#fff;border:7px solid #fff;border-bottom:0;box-shadow:0 14px 35px #1d1b1630}.polaroid img{width:100%;object-fit:cover}.polaroid figcaption{font-family:var(--display);font-weight:700;font-size:.8125rem;line-height:1.3;padding:10px 6px 13px;color:var(--green);text-align:center;letter-spacing:-.01em}.story-polaroid{bottom:14px;right:-4px;width:200px;transform:rotate(5deg)}.story-polaroid img{height:240px;object-position:50% 30%}.story-copy>p:not(.eyebrow){color:var(--muted);margin-top:22px;max-width:520px;font-size:1.0625rem}.pill{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:8px 14px;border-radius:40px;background:var(--cream);color:var(--orange-deep);font-size:.8125rem;font-weight:700}.pill svg{width:16px;height:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:30px}.stat{padding:18px 18px 16px;border-radius:16px;background:var(--sage)}.stat strong{display:block;font-family:var(--display);font-size:2rem;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--green);white-space:nowrap}.stat>span{display:block;font-size:.8125rem;line-height:1.45;color:var(--muted);margin-top:9px}

/* carrosséis de fotos */
.carousel{min-width:0}.carousel-track{list-style:none;padding:0;margin:0;display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}.carousel-track::-webkit-scrollbar{display:none}.carousel-track:focus-visible{outline-offset:8px}.carousel-track>li{scroll-snap-align:start;min-width:0}
.gallery-section{background:var(--paper);overflow:hidden}.section-heading{display:flex;justify-content:space-between;align-items:end;gap:35px;margin-bottom:40px}.section-heading>p{max-width:360px;color:var(--muted)}.gallery-track>li{flex:0 0 calc((100% - 54px)/4)}.gallery-card{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:4/5;background:var(--sage);box-shadow:0 12px 30px #1d1b161a}.gallery-card img{width:100%;height:100%;object-fit:cover;transition:transform .6s}.gallery-card:hover img{transform:scale(1.04)}.gallery-card figcaption{position:absolute;left:12px;bottom:12px;padding:5px 11px;border-radius:30px;background:#fffffff0;color:var(--green);font-size:.75rem;font-weight:700}
.carousel-footer{display:flex;justify-content:space-between;align-items:center;gap:22px;padding-top:28px}.carousel-controls{display:flex;gap:16px;align-items:center;margin-left:auto}.arrow-button{width:44px;height:44px;display:grid;place-content:center;border:1px solid #ffffff40;border-radius:50%;background:transparent;color:#fff;font-size:1.25rem;transition:background .2s}.arrow-button:hover:not(:disabled){background:#ffffff1f}.arrow-button:disabled{opacity:.28}.carousel-dots{display:flex;gap:2px}.carousel-dots button{width:26px;height:32px;display:grid;place-content:center;background:none;border:0;padding:0}.carousel-dots button::after{content:"";width:6px;height:6px;border-radius:50%;background:#8a846f;transition:width .2s}.carousel-dots button[aria-current="true"]::after{background:var(--mustard);width:18px;border-radius:4px}
.carousel--light .arrow-button{border-color:var(--sage-2);color:var(--green);background:#fff}.carousel--light .arrow-button:hover:not(:disabled){background:var(--sage)}.carousel--light .carousel-dots button::after{background:#c9c0b0}.carousel--light .carousel-dots button[aria-current="true"]::after{background:var(--orange)}

/* estilos */
.styles-section{background:#fff}.styles-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}.style-card{text-decoration:none;min-width:0;display:flex;flex-direction:column}.style-image{position:relative;overflow:hidden;border-radius:16px;background:var(--sage);aspect-ratio:1.08}.style-image img{width:100%;height:100%;object-fit:cover;transition:transform .6s}.style-card:hover .style-image img{transform:scale(1.045)}.image-label{position:absolute;top:15px;left:15px;padding:6px 10px;background:var(--mustard);color:var(--green);border-radius:8px;font-family:var(--display);font-size:.6875rem;font-weight:800;letter-spacing:.06em;z-index:1}.style-description{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:20px}.style-description h3{font-family:var(--display);font-size:1.125rem;font-weight:700;line-height:1.3;letter-spacing:-.01em}.style-description p{color:var(--muted);font-size:.875rem;line-height:1.55;margin-top:4px}.circle-arrow{display:grid;place-content:center;width:38px;height:38px;flex-shrink:0;border-radius:50%;background:var(--green);color:#fff;font-size:1.1rem;transition:background .2s,color .2s}.style-card:hover .circle-arrow{background:var(--mustard);color:var(--green)}
.face-tool{display:flex;flex-direction:column;justify-content:center;padding:52px 18px 18px;background:linear-gradient(160deg,var(--green),var(--green-2));color:#fff}.face-options{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.face-option{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 9px;border:1px solid #ffffff30;border-radius:12px;background:#ffffff10;font-size:.75rem;font-weight:700;color:#fff;transition:background .2s,border-color .2s,transform .2s}.face-option svg{width:30px;height:34px}.face-option:hover{transform:translateY(-2px);background:#ffffff22}.face-option[aria-pressed="true"]{background:var(--mustard);border-color:var(--mustard);color:var(--green)}.face-result{margin-top:12px;padding:14px 15px;border-radius:12px;background:#fff;color:var(--ink)}.face-result strong{font-size:.9375rem;color:var(--green)}.face-result p{font-size:.8125rem;line-height:1.5;color:var(--muted);margin-top:4px}.face-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.face-tags span{font-size:.6875rem;font-weight:700;padding:4px 9px;border-radius:20px;background:var(--cream);color:var(--orange-deep)}.style-card--tool .style-description{align-items:start}
.vitrine{margin-top:72px}.vitrine-top{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:26px}.vitrine-top h3{font-family:var(--display);font-size:1.6rem;font-weight:800;letter-spacing:-.02em}.brands{display:flex;flex-wrap:wrap;gap:8px}.brands span{font-size:.75rem;font-weight:700;padding:6px 12px;border-radius:30px;border:1px solid var(--line);background:var(--paper);color:var(--green)}.vitrine-track{gap:16px}.vitrine-track>li{flex:0 0 calc((100% - 48px)/4)}.vitrine-card{border-radius:16px;overflow:hidden;aspect-ratio:4/3;background:#f6f3ee;border:1px solid var(--line)}.vitrine-card img{width:100%;height:100%;object-fit:cover;transition:transform .5s}.vitrine-card:hover img{transform:scale(1.05)}

/* atendimento */
.experience-section{background:var(--sage);overflow:hidden}.experience-grid{display:grid;grid-template-columns:1fr 1fr;gap:96px;align-items:center}.experience-copy h2{font-size:clamp(2.2rem,3.7vw,3rem)}.experience-copy>p:not(.eyebrow){color:var(--muted);margin-top:18px;max-width:480px}.steps{padding:0;margin:22px 0 30px;list-style:none;counter-reset:step}.steps li{padding:14px 0;border-bottom:1px solid var(--sage-2);display:flex;align-items:center;gap:16px}.steps li::before{counter-increment:step;content:counter(step);display:grid;place-content:center;width:28px;height:28px;border-radius:50%;background:var(--mustard);color:var(--green);font-family:var(--display);font-size:.8125rem;font-weight:800;flex-shrink:0}.steps strong{font-size:1rem;font-weight:700}.experience-photos{position:relative;padding-left:70px;padding-bottom:70px}.experience-main{height:480px;overflow:hidden;border-radius:16px 160px 16px 16px;background:#fff0a8}.experience-main img{width:100%;height:100%;object-fit:cover;object-position:50% 40%}.experience-polaroid{left:0;bottom:0;width:200px;transform:rotate(-5deg)}.experience-polaroid img{height:230px;object-position:50% 50%}.exam-card{position:absolute;top:28px;right:-22px;max-width:230px;padding:16px 18px;border-radius:16px;background:#fff;box-shadow:0 14px 34px #1d1b1626;font-size:.8125rem;line-height:1.5;color:var(--muted);text-decoration:none;transition:transform .2s}.exam-card:hover{transform:translateY(-3px)}.exam-card strong{display:flex;align-items:center;gap:8px;font-size:.9375rem;color:var(--green);margin-bottom:4px}.exam-card svg{width:20px;height:20px;color:var(--orange-deep)}.exam-card span{color:var(--orange-deep);font-weight:700}

/* avaliações */
.reviews-section{background:var(--green);color:#fff;position:relative;isolation:isolate;overflow:hidden}.reviews-section::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 96% 8%,#ffde00 0 40px,transparent 41px),radial-gradient(circle at 90% 0%,#f2c500 0 62px,transparent 63px),radial-gradient(700px 380px at 90% 0%,#ffde0022,transparent 70%)}.reviews-heading{display:flex;justify-content:space-between;align-items:end;gap:40px;margin-bottom:44px}.reviews-section .eyebrow{color:var(--mustard)}.reviews-section h2 em{background:none;color:var(--mustard);padding:0}.google-score{display:flex;gap:19px;align-items:center;text-decoration:none;flex-shrink:0}.google-score>strong{font-family:var(--display);font-size:4.4rem;font-weight:800;line-height:1;letter-spacing:-.06em}.google-score>span{display:grid;gap:4px;font-size:.8125rem;color:#cfc8b3}.google-score small{font-size:.8125rem;color:var(--mustard);font-weight:600}.google-score .stars{font-size:1rem}.reviews-track{gap:22px}.reviews-track>li{flex:0 0 calc((100% - 44px)/3)}.review-card{height:100%;min-height:300px;padding:28px 30px;background:#fff;color:var(--ink);border-radius:16px;display:flex;flex-direction:column}.review-card-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.review-card .stars{color:#e0a100;font-size:.8125rem}.review-tag{font-size:.6875rem;font-weight:700;letter-spacing:.03em;color:var(--orange-deep);background:var(--cream);padding:4px 9px;border-radius:20px}.review-card blockquote{padding:0;margin:18px 0 22px;font-size:1.125rem;font-weight:500;line-height:1.5;flex:1;color:#1e2a25}.review-card blockquote.is-long{font-size:1rem;line-height:1.55}.review-person{display:flex;gap:12px;align-items:center}.review-avatar{display:grid;place-content:center;width:40px;height:40px;border-radius:50%;background:var(--mustard);color:var(--green);font-family:var(--display);font-size:.8125rem;font-weight:800;flex-shrink:0}.review-person strong{font-size:.875rem;font-weight:700;display:block}.review-person a{font-size:.75rem;color:var(--muted);text-underline-offset:3px}.review-write{font-size:.875rem;color:var(--mustard)}

/* instagram */
.insta-section{background:#fff;overflow:hidden}.insta-grid{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}.insta-copy>p:not(.eyebrow){color:var(--muted);margin:20px 0 30px;max-width:470px}.insta-actions{display:flex;flex-wrap:wrap;align-items:center;gap:16px 22px}.insta-media{position:relative;max-width:470px;margin-inline:auto;width:100%}.insta-photo{border-radius:24px;overflow:hidden;border:8px solid #fff;box-shadow:0 30px 60px #1d1b162e;transform:rotate(2deg);background:var(--sage)}.insta-photo img{width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;object-position:50% 40%}.insta-chip{position:absolute;display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:40px;background:var(--green);color:#fff;font-weight:700;font-size:.8125rem;box-shadow:0 10px 24px #1d1b1640;text-decoration:none}.insta-chip svg{width:18px;height:18px;color:var(--mustard)}.insta-chip--ig{left:-22px;top:34px;transform:rotate(-4deg)}.insta-chip--ship{right:-18px;bottom:40px;background:var(--mustard);color:var(--green);transform:rotate(3deg)}.insta-chip--ship svg{color:var(--green)}
