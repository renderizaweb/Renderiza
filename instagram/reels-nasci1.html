<!-- Reels do Instagram (1080 × 1920, 30 quadros/s) com voz. Episódio 1 de "Eu ainda não nasci" (SERIE.md), "A tabela".
     Quem narra é o bebê da Camila, ainda na barriga. A Camila (36 semanas, previsão 05/12) quer o ensaio gestante e o
     newborn; quase meia-noite pede o valor à fotógrafa Helena e recebe um PDF de 14 páginas com o preço na nona. O 4G
     pensa, o bebê vê a luz do celular, chuta, e o celular cai na cara dela. Ela fecha com outra fotógrafa, que mostra o
     preço na primeira tela do site; a Helena acha que foi o preço, mas a outra era mais cara: a Camila nunca viu o preço
     da Helena. Gancho: o bebê nasce três semanas antes. Prévia do episódio 2 e "Siga para ver o episódio 2"; o
     "Comenta PRÉVIA" aparece só na tela, depois da voz (historia.mjs, convite mudo). Para aprender vendo: a régua das
     40 semanas, as 14 páginas até o preço e o calendário do parto adiantado. Tudo é fictício, e as telas levam o selo
     "exemplo". O tempo de tudo sai da narração: narracao/reels-nasci1.json → python3 instagram/narrar.py reels-nasci1.
     Sem animação de CSS: window.quadro(t) desenha o instante t (s). -->
