<title>Reels narrado: a vaga das 10h20</title>
<!-- Reels do Instagram (1080 × 1920, 30 quadros/s) com voz. Semana de 04 a 08/11/2026, Reels 3 (sexta, 19h), para fotógrafas.
     Alvo: a fotógrafa de estúdio que abre a mini sessão de Natal pelo Stories e vende as vagas no direct. Objetivo: ela
     perceber que, quando as vagas moram no direct, só ela sabe quais acabaram (vende a mesma vaga duas vezes e segura
     horário de quem não paga), e que com a agenda online no site a cliente vê quantas vagas restam e reserva sozinha, o
     horário fica separado por 24 horas até o sinal, quem chega tarde vai para a lista de espera e o painel conta as vagas.
     As telas seguem o exemplo do Estúdio Ciranda (/exemplos/agenda-fotografia e /exemplos/painel-fotografia): horários a
     cada 40 minutos, sinal de R$ 110 pelo Pix, "restam N horários", lista de espera com o botão Avisar. A agenda do
     painel não liga com o Google, e o vídeo não diz que liga. O painel não recebe o Pix: quem marca o sinal é a Lia.
     Tudo é fictício, e as telas levam o selo "exemplo". O único trocadilho é "noite feliz"; o cachorro é a piada que
     volta no último quadro. O tempo de tudo sai da narração: narracao/reels-vaga.json → python3 instagram/narrar.py reels-vaga.
     Sem animação de CSS: window.quadro(t) desenha o instante t (s). -->

<script type="module">
import { $, $$, clamp, fase, ease, sai, saiX, volta, lerp, pulso, pos, attr, entra, em, vis, E, pose, IC, ic, cabeca, boca, fecha, barra, balao, historia } from "./historia.mjs";

const R = await historia({

  ordem: ["stories", "direct", "noite", "bruna", "licao", "dorme", "site", "fecho", "marca", "cta"],
  // a trilha: o Stories abre, o direct explodindo é o pulso, a noite de respostas é o groove (cortado no "E a Bruna",

function arvore(id, x, y, s) {
  let g = `<g id="${id}" transform="translate(${x} ${y}) scale(${s})"><rect x="-14" y="-40" width="28" height="44" fill="#6b4a2f"/>`;
  g += `<path d="M0 -330 L-120 -150 L-70 -150 L-160 -40 L160 -40 L70 -150 L120 -150 Z" fill="#2f6b47"/><path d="M0 -330 L-60 -240 L60 -240 Z" fill="#3b7f57"/>`;
  g += `<path d="M0 -372 l11 24 l26 3 l-19 17 l5 26 l-23 -13 l-23 13 l5 -26 l-19 -17 l26 -3 Z" fill="#e8c46a"/>`;
  const luzes = [[-30, -270], [34, -250], [-70, -190], [10, -200], [68, -175], [-100, -90], [-40, -110], [30, -95], [96, -80], [-10, -60], [130, -55], [-130, -52]];
  luzes.forEach(([lx, ly], k) => { g += `<circle class="luz" data-k="${k}" cx="${lx}" cy="${ly}" r="11" fill="${["#ffd36b", "#ff7a6b", "#9fd8ff"][k % 3]}"/>`; });
  return g + "</g>";
}

  const [cx, cy, s, r, o] = pose(PA, t);
  pos(FA, { x: cx - 220, y: cy - 450, s, r, o });
