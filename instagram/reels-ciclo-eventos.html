<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Reels narrado: o ciclo de um espaço de eventos</title>
<!-- Reels do Instagram (1080 × 1920, 30 quadros/s) com voz: a sexta-feira da Marina, dona da Villa Alecrim (espaço
     fictício, o mesmo de exemplos/painel-eventos.html e exemplos/dados-villa-alecrim.js), antes e depois do site com a
     agenda online e do painel. O tempo de tudo sai da narração: narracao/reels-ciclo-eventos.json →
     python3 instagram/narrar.py reels-ciclo-eventos → esta página lê reels-ciclo-eventos.tempos.json, mostra a legenda
     palavra a palavra e troca cada imagem na palavra certa. As cenas da narração têm nomes próprios; o "pulso" do
     preparar() diz a que parte da trilha (ferramentas/video/trilha-pulso.py) cada uma corresponde.
     Sem animação de CSS: window.quadro(t) desenha o instante t (s), e o gerar.mjs grava quadro a quadro.
     Só fatos do produto de verdade: o painel não recebe pagamento, não sincroniza com o Google Agenda e não tem IA;
     a cena da IA é uma ideia sob medida, fora do painel. -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=block" rel="stylesheet">
