<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Reels: do link na bio ao site</title>
<!-- Reels do Instagram (1080 × 1920, ~21 s): o "link na bio" cheio de botões vira um site de verdade, com legendas,
     e fecha com "O Instagram mostra. O site convence." O negócio é fictício (Lume Estética).
     Animação sem CSS: window.quadro(t) desenha o instante t (s); o gerar.mjs grava quadro a quadro. -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=DM+Sans:wght@400;500;600;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="marca.css">
<style>
html,body{width:1080px;height:1920px;overflow:hidden}
.reels{position:relative;width:1080px;height:1920px;background:var(--fundo);overflow:hidden}
.r-topo{position:absolute;left:0;right:0;top:150px;display:flex;justify-content:center}
.r-topo .marca{font-size:36px}
.r-topo .simbolo{width:42px;height:42px}
.legenda{position:absolute;left:70px;right:70px;top:250px;text-align:center;font-weight:700;letter-spacing:-.035em;line-height:1.04;font-size:84px;color:var(--tinta)}
.legenda .tom{color:var(--enfase)}
.legenda.dupla{top:220px}
#cel{left:225px;top:600px;width:630px;height:1270px}
.tela .camada{position:absolute;left:0;top:0;width:402px;transform-origin:0 0}
.toque{position:absolute;z-index:20;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;background:rgba(30,37,40,.16);border:4px solid rgba(30,37,40,.6);opacity:0}
.onda{position:absolute;z-index:19;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;border:4px solid rgba(37,211,102,.9);opacity:0}
.final{position:absolute;inset:0;background:var(--escuro);opacity:0;z-index:30}
.final h2{position:absolute;left:84px;right:84px;top:640px;font-size:118px;line-height:1.02;color:#fff;text-align:center}
.final h2 span{display:block}
.final h2 .tom{color:var(--enfase-escuro)}
.final .assina{position:absolute;left:0;right:0;top:1130px;display:flex;flex-direction:column;align-items:center;gap:26px}
.final .marca{font-size:78px;gap:22px;color:var(--fundo)}
.final .simbolo{width:92px;height:92px}
.final p{font-size:36px;color:var(--enfase-escuro);font-weight:500}
</style></head><body>
<div class="reels">
  <div class="r-topo"><span class="marca"><span class="simbolo"></span>renderiza</span></div>
  <p class="legenda" data-de="0.3" data-ate="4.05"><span>Seu cliente chegou aqui…</span><br><span class="tom" data-de="1.9" data-ate="4.05">…e agora?</span></p>
  <p class="legenda" data-de="4.25" data-ate="5.7">E se fosse <span class="tom">assim?</span></p>
  <p class="legenda" data-de="5.9" data-ate="8.0">Suas fotos <span class="tom">reais</span></p>
  <p class="legenda" data-de="8.3" data-ate="10.3">Seus <span class="tom">serviços</span></p>
  <p class="legenda" data-de="10.6" data-ate="12.55">Avaliações <span class="tom">do Google</span></p>
  <p class="legenda" data-de="12.8" data-ate="14.75">WhatsApp <span class="tom">em um toque</span></p>
  <p class="legenda" data-de="15.0" data-ate="16.55">Endereço <span class="tom">e horário</span></p>
  <div class="celular" id="cel"><span class="exemplo" style="left:-34px;top:560px">exemplo</span>
    <div class="tela"><div class="camada" id="bio"></div><div class="camada" id="site"></div></div></div>
  <span class="toque" id="toque"></span><span class="onda" id="onda"></span>
  <div class="final" id="final">
    <h2><span id="f1">O Instagram mostra.</span><span class="tom" id="f2">O site convence.</span></h2>
    <div class="assina" id="f3"><span class="marca"><span class="simbolo"></span>renderiza</span><p>Sites para o seu negócio · renderizaweb.com.br</p></div>
  </div>
</div>
<script type="module">
import { siteDeExemplo, linkNaBio } from "./exemplo.js";
const $ = s => document.querySelector(s);
const bio = $("#bio"), site = $("#site"), tela = $(".tela"), toque = $("#toque"), onda = $("#onda");
bio.innerHTML = linkNaBio(); site.innerHTML = siteDeExemplo();
const ESC = tela.clientWidth / 402, ALT = tela.clientHeight / ESC; // escala do celular e altura visível em px do site
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const fase = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const sai = x => 1 - Math.pow(1 - x, 3);
const lerp = (a, b, x) => a + (b - a) * x;

const DUR = 21, ENTRADA = 4.2, FECHA = 16.4;
// rolagem do site: para em cada parte, com a seção logo abaixo do topo da tela
let paradas = {}, maxY = 0;
const ROLAGEM = [[7.55, 8.55, "servicos"], [9.85, 10.85, "avaliacoes"], [12.05, 13.0, "contato"], [14.25, 15.2, "mapa"]];
function yDoSite(t) {
  let y = 0;
  for (const [a, b, alvo] of ROLAGEM) y = lerp(y, paradas[alvo], ease(fase(t, a, b)));
  return y;
}
// o dedo hesitando entre os botões do link na bio
const HESITA = [[0.9, 1], [1.7, 4], [2.5, 6], [3.2, 2], [3.75, 7]];
let botoes = [];
const centro = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };

window.preparar = () => {
  bio.style.transform = site.style.transform = `scale(${ESC})`;
  for (const el of site.querySelectorAll("[data-parada]")) paradas[el.dataset.parada] = el.offsetTop - 70;
  maxY = site.scrollHeight - ALT;
  for (const k in paradas) paradas[k] = clamp(paradas[k], 0, maxY);
  botoes = [...bio.querySelectorAll(".bio-btn")];
  return { duracao: DUR, entrada: ENTRADA, fechamento: FECHA };
};

window.quadro = t => {
  // legendas: entram subindo, saem sumindo
  for (const el of document.querySelectorAll("[data-de]")) {
    const de = +el.dataset.de, ate = +el.dataset.ate;
    const v = ease(fase(t, de, de + 0.35)) * (1 - ease(fase(t, ate - 0.3, ate)));
    el.style.opacity = v; el.style.transform = `translateY(${(1 - ease(fase(t, de, de + 0.35))) * 28}px)`;
  }
  // abertura geral
  $("#cel").style.opacity = ease(fase(t, 0, 0.5));
  // link na bio: botões caem um a um na transição
  botoes.forEach((b, i) => {
    const x = fase(t, ENTRADA - 0.1 + i * 0.07, ENTRADA + 0.45 + i * 0.07);
    b.style.opacity = 1 - x; b.style.transform = `translateY(${ease(x) * 60}px) rotate(${(i % 2 ? 1 : -1) * x * 6}deg)`;
    b.style.background = "#fff";
  });
  bio.style.opacity = 1 - fase(t, ENTRADA + 0.5, ENTRADA + 1.0);
  // o dedo: vai de botão em botão sem decidir
  let alvo = null, vis = 0;
  if (t < ENTRADA) {
    let de = HESITA[0], para = HESITA[0];
    for (let i = 0; i < HESITA.length; i++) if (t >= HESITA[i][0]) { de = HESITA[i]; para = HESITA[i + 1] || HESITA[i]; }
    const [x0, y0] = centro(botoes[de[1]]), [x1, y1] = centro(botoes[para[1]]);
    const k = ease(fase(t, de[0] + 0.25, para[0]));
    alvo = [lerp(x0, x1, k), lerp(y0, y1, k)];
    vis = ease(fase(t, 0.7, 1.0)) * (1 - fase(t, ENTRADA - 0.3, ENTRADA));
    botoes.forEach(b => (b.style.background = "#fff"));
    const perto = botoes[k > 0.5 ? para[1] : de[1]]; if (perto && vis > 0.5) perto.style.background = "#f3e9e3";
  }
  // o site: entra de baixo e rola parando em cada parte
  const entra = ease(fase(t, ENTRADA + 0.55, ENTRADA + 1.35));
  site.style.opacity = entra;
  const y = yDoSite(t);
  site.style.transform = `translateY(${(1 - entra) * 120 + -y * ESC}px) scale(${ESC})`;
  // toque no WhatsApp
  const zap = site.querySelector('[data-alvo="whatsapp"]');
  const tz = 13.35;
  if (t > tz - 0.35 && t < tz + 1.1) {
    alvo = centro(zap);
    vis = ease(fase(t, tz - 0.35, tz - 0.05)) * (1 - fase(t, tz + 0.7, tz + 1.1));
  }
  const aperta = t > tz && t < tz + 0.35 ? 0.86 : 1;
  zap.style.filter = t > tz && t < tz + 0.5 ? "brightness(.88)" : "none";
  const o = fase(t, tz, tz + 0.7);
  onda.style.opacity = o > 0 && o < 1 ? 1 - o : 0;
  if (alvo) {
    toque.style.left = onda.style.left = alvo[0] + "px"; toque.style.top = onda.style.top = alvo[1] + "px";
  }
  toque.style.opacity = vis; toque.style.transform = `scale(${aperta})`;
  onda.style.transform = `scale(${1 + o * 1.6})`;
  // fechamento
  $("#final").style.opacity = ease(fase(t, FECHA, FECHA + 0.5));
  for (const [id, de] of [["#f1", FECHA + 0.3], ["#f2", FECHA + 0.95], ["#f3", FECHA + 1.6]]) {
    const v = sai(fase(t, de, de + 0.5)); const el = $(id);
    el.style.opacity = v; el.style.transform = `translateY(${(1 - v) * 30}px)`;
  }
};

await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
await document.fonts.ready;
window.pronto = true;
</script>
</body></html>
