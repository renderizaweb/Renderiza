<!-- Reels do Instagram (1080 × 1920, 30 quadros/s) com voz. Episódio 3 (final) de "Eu ainda não nasci" (SERIE.md),
     "Três da manhã": a mesma madrugada vista por três pessoas. O pai (02h58), acordado com o bebê no colo, vê o post
     novo da Helena e manda para a mãe. A mãe (03h00) abre o perfil, começa a digitar "valor?", para, e toca no link da
     bio: é um site, com o preço na primeira tela e uma agenda; sábado, dez da manhã, está livre porque um "vou ver com
     meu marido" não pagou o sinal em 24 horas. "Amor, vou ver com o meu..." "Já vi." Ela marca em quatro minutos e paga
     o sinal. A fotógrafa (03h04) dorme, e o celular acende: pela primeira vez, alguém marcou sem ela responder. De manhã,
     ela confere o Pix, marca o sinal no painel e lê "Camila". "A do PDF?" No sábado, a mãe da Helena aparece no ensaio
     com o Louro no ombro e reconhece o pai que o papagaio atendeu; o Louro solta "Conseguiu ver a tabela?". O bebê dorme
     o ensaio e vira a primeira foto do newborn no site; o PDF vai para a gaveta. Moral, marca e a prévia explicada
     (montada com as fotos do Instagram do estúdio; ver não custa nada). Depois de um piii, o pós-créditos em cinza, onze
     meses depois: o pai bate de novo na casa velha e o Louro responde "Tá no site!"; temporada 2, "Eu ainda não andei",
     e o convite "Comenta CONTINUAÇÃO". O painel não recebe o Pix: quem marca o sinal é a Helena. Tudo é fictício, e as
     telas levam o selo "exemplo". O tempo de tudo sai da narração: narracao/reels-nasci3.json.
     Sem animação de CSS: window.quadro(t) desenha o instante t (s). -->
