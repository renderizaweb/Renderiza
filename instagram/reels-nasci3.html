     digitar "valor?", para, e toca no link da bio: é um site, com as fotos do newborn, o que vem incluso e o preço na
     primeira tela, e uma agenda com os horários livres. Sábado (28/11), dez da manhã, está livre: uma mãe tinha
     segurado o horário com "vou ver com meu marido", não pagou o sinal em 24 horas, e a vaga voltou. A Camila marca em
     quatro minutos e paga o sinal. De manhã, a Helena marca o sinal no painel e lê o nome: Camila, a do PDF. A virada:
     depois daquele visualizado, a Helena tinha trocado o PDF por um site. No sábado, o bebê dorme o ensaio inteiro e
     vira a primeira foto do newborn no site; o PDF a Helena guardou. Moral, marca e convite falados. O painel não
     recebe o Pix: quem marca o sinal é a Helena; para fotógrafas, a agenda é a do painel e não liga com o Google. Para
     aprender vendo: o caminho até o preço (14 páginas no episódio 1, um toque agora), as 24 horas da pré-reserva e o
     cronômetro dos quatro minutos. Tudo é fictício, e as telas levam o selo "exemplo". O tempo de tudo sai da
