<!-- Reels do Instagram (1080 × 1920, 30 quadros/s) com voz. 07/11/2026, parte 2 da série "O celular da fotógrafa"
     (SERIE.md). Alvo: a fotógrafa que recebe o sinal por Pix e controla quem pagou por prints no WhatsApp. Objetivo:
     ela perceber que comprovante guardado em conversa se perde, e que com o painel cada cliente tem a data, o contrato
     e o sinal na mesma ficha: quando o pagamento cai, ela marca o sinal ali, e no fim do mês vê quem pagou. O painel
     não recebe nem confere o Pix: quem marca é a fotógrafa, e o vídeo diz isso.
     A história: abre com um cartaz de procura-se (trezentos reais sumiram há onze dias, e quem fala é a única prova).
     Depois do gancho, o resumo da parte 1. Quem fala é o print do Pix da Lari: a Helena guarda os comprovantes num grupo
     só com ela, mas o dedo escorrega um grupo para baixo. Onze dias depois, a Helena cobra a Lari, que responde com três
     pontos de exclamação. A virada: o print passou os onze dias no grupo da família, onde a tia Rosa respondeu
     "parabéns pelo pagamento, querida". Com o painel, o sinal é marcado na ficha da cliente. Fecho: a tia manda
     "valor?", e a Helena responde com o link (a parte 1). Pós-créditos: a parte 3, no padrão da série (serie.mjs).
     Tudo é fictício, e as telas levam o selo "exemplo". O tempo de tudo sai da narração:
     narracao/reels-comprovante.json → python3 instagram/narrar.py reels-comprovante.
     Sem animação de CSS: window.quadro(t) desenha o instante t (s). -->

  }
}
// o narrador: [t, x, y, escala, giro, opacidade]
const EU = [

function qEu(t) {

function qExtra(t) {
  { const el = $("#etq-data"), a = entra(t, T.gestante - 0.05); pos(el, { x: 330 - el.offsetWidth / 2, y: 700 + a.y, s: a.s, r: -3, o: em(t, T.gestante - 0.1, I("sou") - 0.1) ? a.o * (1 - fase(t, I("sou") - 0.3, I("sou") - 0.1)) : 0 }); }

    const d = Math.min(14, 3 + Math.floor(11 * fase(t, T.onze - 0.1, T.mes)));

  {
    // a lição: o print vai pulando para onde o dedo escorregar
    const on = em(t, S.licao - 0.1, S.site - 0.05), g = $("#grupos"), a = fase(t, S.licao - 0.1, S.licao + 0.3), fora_ = 1 - fase(t, S.site - 0.3, S.site - 0.05);

const quadroSerie = serie(R, { parte: 2, abertura: "resumo", resumo: { id: "resumo", titulo: "Só quatro me abriram", arte: MINI_P1 },
