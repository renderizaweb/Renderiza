<!-- Reels do Instagram (1080 × 1920, 30 quadros/s) com voz. Semana de 04 a 08/11/2026, Reels 1 (quarta, 19h).
     Alvo: quem vende pelo Instagram e responde "valor?" com "chamei no direct".
     Objetivo: a pessoa perceber que quem some depois de perguntar o preço é cliente que não quis perguntar nem
     esperar, e que um catálogo no site, com o preço de cada peça, vende sem a cliente precisar perguntar.
     A história: a Paula, da Paula Bolsas, odeia curiosas (comentam "valor?", recebem o preço no direct e somem).
     À noite ela procura um vestido, comenta "valor?" numa loja, espera, e compra numa loja com site, onde vê tudo
     com preço. De manhã visualiza o preço da primeira loja e não responde: a curiosa era ela. E a loja do site era
     da Bia, a primeira curiosa do dia. A Paula coloca o catálogo no site, e a Bia volta e compra sem perguntar nada.
     Tudo é fictício, e as telas levam o selo "exemplo". O tempo de tudo sai da narração:
     narracao/reels-curiosa.json → python3 instagram/narrar.py reels-curiosa → esta página lê reels-curiosa.tempos.json.
     As peças comuns (contas, gente, legendas, marca, convite e trilha) estão em historia.mjs e historia.css.
     Sem animação de CSS: window.quadro(t) desenha o instante t (s). -->
