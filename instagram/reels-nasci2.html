     ser nos primeiros quinze dias. A outra fotógrafa só tem vaga em janeiro. De madrugada, a Camila procura no Google e
     acha um perfil parado e um telefone que não existe. No dia 7 lembra da Helena, mas tinha deixado a Helena no vácuo;
     no mapa, o alfinete do estúdio aponta para a casa da mãe da Helena. No dia 11 desiste. No dia 13, às três da manhã,
     aparece no Instagram o newborn mais lindo que ela já viu: da Helena. Faltam dois dias, e a Helena manda os preços em
     PDF. Prévia do final, "Siga para ver o final" e o convite mudo. Para aprender vendo: o contador dos quinze dias
     (com janeiro fora da janela) e os 54% que compram à noite, com a fonte na tela. Tudo é fictício, e as telas levam o
     selo "exemplo". O tempo de tudo sai da narração: narracao/reels-nasci2.json → python3 instagram/narrar.py reels-nasci2.
