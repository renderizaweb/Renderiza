<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Reels narrado: o pingue-pongue da agenda</title>
<!-- Reels do Instagram (1080 × 1920, 30 quadros/s) com voz. Semana de 04 a 08/11/2026, Reels 2 (quinta, 19h).
     Alvo: o dono de barbearia, salão, estética ou consultório que marca horário pelo WhatsApp, muitas vezes no meio
     de um atendimento. Objetivo: ele perceber que o vai e volta para marcar cansa o cliente e faz perder gente, e que
     com a agenda online no site o cliente vê os horários livres, escolhe um e o compromisso cai direto na agenda do
     Google. A história é narrada como uma partida: cada mensagem é uma bolinha que cruza a mesa. Oito mensagens, três
     horas, e ninguém marcou (o único trocadilho). O Caio desiste e marca em outro lugar, em um toque; o Neto põe a
     agenda no site e volta a cortar cabelo com as duas mãos. Tudo é fictício, e as telas levam o selo "exemplo".
     O tempo de tudo sai da narração: narracao/reels-pingue-pongue.json → python3 instagram/narrar.py reels-pingue-pongue.
     As peças comuns estão em historia.mjs e historia.css; os efeitos (bolinha, apito, notificação, tesoura) saem em
     "sons" e a trilha mixa. Sem animação de CSS: window.quadro(t) desenha o instante t (s). -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&display=block" rel="stylesheet">
<link rel="stylesheet" href="marca.css">
<link rel="stylesheet" href="historia.css">
<style>
/* as mensagens que cruzam a mesa */
.bola{position:absolute;left:0;top:0;z-index:26;padding:18px 28px;border-radius:34px;font-size:40px;font-weight:700;letter-spacing:-.025em;white-space:nowrap;box-shadow:0 24px 60px rgba(0,0,0,.4);opacity:0;transform-origin:50% 50%}
.bola.c{background:#d9fdd3;color:#1d3b14}
.bola.n{background:#f6f3ee;color:#1e2528}
.bola.ok{background:var(--terracota);color:#fff;font-size:44px}
.bola small{display:block;font-size:20px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.55;margin-bottom:2px}
/* o placar da transmissão */
#placar{position:absolute;left:50%;top:1330px;z-index:27;translate:-50% 0;display:flex;align-items:stretch;border-radius:18px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.45);font-weight:800;opacity:0}
#placar > div{display:flex;align-items:center;padding:0 24px;height:78px;font-size:32px;letter-spacing:.02em}
#placar .lado{background:#1e2528;color:#f1eee9}
#placar .relo{background:var(--terracota);color:#fff;font-size:40px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;min-width:150px;justify-content:center}
#ao-vivo{position:absolute;left:50%;top:1292px;z-index:27;translate:-50% 0;display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;letter-spacing:.14em;color:#f1eee9;opacity:0}
#ao-vivo i{width:14px;height:14px;border-radius:50%;background:#e5484d}
#contas{position:absolute;left:50%;top:1426px;z-index:27;translate:-50% 0;font-size:26px;font-weight:700;color:#e6e1da;white-space:nowrap;opacity:0}
#contas b{color:#fff;font-variant-numeric:tabular-nums}
/* o resultado */
#resultado{position:absolute;left:150px;right:150px;top:640px;z-index:28;padding:34px 48px;border-radius:40px;background:#f1eee9;color:#1e2528;box-shadow:0 50px 110px rgba(0,0,0,.5);opacity:0}
#resultado .r{display:flex;align-items:baseline;gap:22px;padding:14px 0;border-top:2px solid #e2dcd2;opacity:0}
#resultado .r:first-of-type{border-top:0}
#resultado .r b{font-size:118px;font-weight:800;letter-spacing:-.05em;line-height:.95;min-width:110px;text-align:right}
#resultado .r span{font-size:46px;font-weight:700;color:#5b6467;letter-spacing:-.02em}
#resultado .r.zero b{color:var(--terracota)}
#resultado .t{font-size:24px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#7a8386;margin-bottom:6px}
/* a tarja de apresentação */
.tarja{position:absolute;left:60px;top:1330px;z-index:27;display:flex;flex-direction:column;opacity:0}
.tarja b{align-self:flex-start;padding:12px 26px;background:#f1eee9;color:#1e2528;font-size:46px;font-weight:800;letter-spacing:.04em}
.tarja span{align-self:flex-start;padding:10px 26px;background:var(--terracota);color:#fff;font-size:32px;font-weight:700;letter-spacing:-.01em}
/* a agenda online no celular */
.ms-url .cad{width:18px;height:18px}
.ag-tit{margin:12px 22px 0;font-size:28px;font-weight:800;letter-spacing:-.02em}
.ag-tit small{display:block;font-size:20px;font-weight:600;color:#7a8386;margin-top:2px;letter-spacing:0}
.ag-dias{display:flex;gap:10px;margin:14px 18px 0}
.ag-dias b{flex:1;padding:10px 0;border-radius:16px;background:#ece7df;text-align:center;font-size:19px;font-weight:700;color:#5b6467;line-height:1.15}
.ag-dias b i{display:block;font-style:normal;font-size:28px;color:#1e2528}
.ag-dias b.sel{background:#1e2528;color:#d6d0c6}
.ag-dias b.sel i{color:#fff}
.ag-grade{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 18px 0}
.ag-grade i{display:block;height:62px;border-radius:16px;font-style:normal;font-size:24px;font-weight:700;display:grid;place-items:center;border:2.5px solid #d6d0c6;color:#1e2528;background:#fff}
.ag-grade i.oc{background:#ece7df;border-color:#ece7df;color:#a3a9ab;text-decoration:line-through}
.ag-ok{position:absolute;left:0;right:0;bottom:0;padding:26px 26px 40px;border-radius:34px 34px 0 0;background:#fff;box-shadow:0 -20px 50px rgba(0,0,0,.18);transform:translateY(110%)}
.ag-ok .ck{width:62px;height:62px;border-radius:50%;background:#22a355;display:grid;place-items:center;margin-bottom:12px}
.ag-ok .ck svg{width:38px;height:38px;color:#fff;stroke-width:3}
.ag-ok b{display:block;font-size:30px;font-weight:800}
.ag-ok span{display:block;font-size:23px;font-weight:600;color:#5b6467;margin-top:4px}
/* a agenda do Neto, depois que o horário cai */
.cal-topo{display:flex;align-items:center;justify-content:space-between;padding:10px 22px 12px;border-bottom:2px solid #e7e1d8}
.cal-topo b{font-size:28px;font-weight:800}
.cal-topo small{display:block;font-size:19px;font-weight:600;color:#7a8386}
.cal-topo i{width:46px;height:46px;border-radius:12px;background:#2f6fde;color:#fff;display:grid;place-items:center;font-style:normal;font-size:22px;font-weight:800}
.cal-h{position:relative;height:84px;border-top:1.5px solid #ece7df;margin-left:86px}
.cal-h::before{content:attr(data-h);position:absolute;left:-74px;top:-12px;font-size:19px;font-weight:600;color:#9aa1a3}
.cal-ev{position:absolute;left:96px;right:16px;border-radius:14px;padding:8px 14px;font-size:22px;font-weight:700;line-height:1.15;color:#fff}
.cal-ev small{display:block;font-size:18px;font-weight:600;opacity:.85}
</style></head><body>
<div class="reels" id="palco">
  <svg class="comp" id="c-mundo" viewBox="0 0 1080 1920"><g id="mu"></g></svg>
  <div id="escuro"></div>
  <div class="poeira" id="poeira"></div>
  <div id="ao-vivo"><i></i>AO VIVO</div>
  <div id="placar"><div class="lado" id="pl-e">CAIO</div><div class="relo" id="relo">13:00</div><div class="lado">NETO</div></div>
  <div id="contas">Mensagens <b id="n-msg">0</b> · Marcados <b id="n-marc">0</b></div>
  <div class="tarja" id="tj-caio"><b>CAIO</b><span>quer cortar o cabelo</span></div>
  <div class="tarja" id="tj-neto"><b>NETO</b><span>barbeiro, com cliente na cadeira</span></div>
  <div class="fone" id="fone"></div>
  <div id="bolas"></div>
  <div id="resultado"><div class="t">Fim do primeiro tempo</div><div class="r"><b>8</b><span>mensagens</span></div><div class="r"><b>3</b><span>horas</span></div><div class="r zero"><b>0</b><span>horários marcados</span></div></div>
  <div id="baloes"></div>
  <section class="cena" id="c-fim"></section>
  <div class="vinheta" id="vinheta"></div>
  <div class="sombra-topo"></div>
  <div class="falas" id="falas"></div>
  <div class="flash" id="flash"></div>
</div>
<script type="module">
import { $, $$, clamp, fase, ease, sai, saiX, volta, lerp, pulso, pos, attr, entra, em, vis, E, pose, camera, naTela, IC, ic, ZAP_B, cabeca, dePe, boca, pernas, fecha, barra, balao, historia } from "./historia.mjs";

const R = await historia({
  nome: "reels-pingue-pongue",
  ordem: ["mesa", "jogadores", "rali", "desiste", "licao", "netao", "site", "fecho", "marca", "cta"],
  // a trilha: a abertura da partida, o pulso na apresentação, o groove no rali (cortado no "O Caio parou de
  // responder", a frase "nada"), a batida abafada quando ele desiste, o coração na lição, a subida no Neto com uma mão
  // só, e o drop em "colocou a agenda no site"
  trilha: { mesa: "abre", jogadores: "google", rali: "insta", desiste: "volta", licao: "meio", netao: "ese", site: "site", fecho: "fim", marca: "fim", cta: "cta" },
  soBalao: ["r3", "r4", "r5", "r6", "r7", "r8"],
  cta: "PRÉVIA", nota: "O Caio, o Neto e as barbearias são fictícios.", bpm: 128, tom: 2,
});
const { F, S, I, FIM, W, palco } = R;
const T = {
  semana: W("abre", "semana"), caio: W("caio", "caio"), cabelo: W("caio", "cabelo"), neto: W("neto", "neto"), pessoa: W("neto", "pessoa"),
  tem: W("saque", "tem"), quarenta: I("devolve"), as: W("devolve", "as"),
  oito: I("placar"), tres: W("placar", "tres"), ninguem: W("placar", "ninguem"), marcou: W("placar", "marcou"),
  nada: I("nada"), outro: I("outro"), lugar: W("outro", "lugar"), livres1: W("toque", "livres"), toque: W("toque", "toque"),
  licao: I("licao"), desistir: W("licao", "desistir"),
  uma: I("uma"), maoU: W("uma", "mao"), resp: W("uma", "respondendo"), outra: W("uma", "outra"),
  fez: I("fez"), livres: W("ve", "livres"), um: W("ve", "um"), cai: W("ve", "cai"), netoG: W("ve", "neto"),
  so: I("so"), acaba: W("so", "acaba"), maos: I("maos"), duas: W("maos", "duas"),
};

// ====================== o mundo: a mesa, o Caio e a barbearia do Neto na outra ponta ======================
const CHAO = 1600, MESA_Y = 1290;
const CAIO = { id: "ca", cabelo: "curto", corCabelo: "#3a2418", roupa: "#c0583a", calca: "#2f3a46", bracos: "celular" };
const P_C = [626, 1334], P_N = [1680, 1273], ACIMA = 290; // as raquetes (os celulares); a mensagem recebida fica acima da cabeça de quem recebeu
// o Neto atrás da cadeira, cortando o cabelo do cliente: uma mão com o celular (ou o pente), a outra com a tesoura
const BE = ["M-47 -272 Q-96 -284 -80 -262", "M-47 -272 Q10 -236 50 -318"]; // o braço esquerdo: com o celular, ou com o pente na cabeça do cliente
function barbeiro() {
  const pele = "#b9805f", pele2 = "#a26c4d", roupa = "#e9e2d6", avental = "#1e2528";
  let s = `<g id="nb">`;
  s += `<ellipse cx="0" cy="4" rx="70" ry="10" fill="#000" opacity=".22"/>`;
  s += `<rect x="-29" y="-150" width="26" height="146" rx="11" fill="#2b2f33"/><rect x="3" y="-150" width="26" height="146" rx="11" fill="#2b2f33"/>`;
  s += `<path d="M-50 -140 L-46 -262 Q-44 -288 -20 -290 L20 -290 Q44 -288 46 -262 L50 -140 Z" fill="${roupa}"/><path d="M-36 -262 L36 -262 L42 -110 L-42 -110 Z" fill="${avental}"/>`;
  s += `<path id="ne-be" d="${BE[0]}" stroke="${roupa}" stroke-width="24" stroke-linecap="round" fill="none"/><circle id="ne-me" cx="-80" cy="-262" r="12" fill="${pele}"/>`;
  s += `<path d="M47 -272 Q96 -262 80 -290" stroke="${roupa}" stroke-width="24" stroke-linecap="round" fill="none"/><circle cx="80" cy="-290" r="12" fill="${pele}"/>`;
  s += `<rect x="-11" y="-306" width="22" height="20" fill="${pele2}"/>`;
  s += cabeca({ id: "ne", cabelo: "careca", corCabelo: "#2a1c14", barba: true, pele, pele2 }, 0, -346, 40);
  // o celular (mão esquerda), o pente (mão esquerda, no fim) e a tesoura (mão direita)
  s += `<g id="ne-cel" transform="translate(-80 -262)"><rect x="-17" y="-30" width="34" height="56" rx="7" fill="#111"/><rect id="ne-tela" x="-13" y="-26" width="26" height="46" rx="4" fill="#9cc6e0"/></g>`;
  s += `<g id="ne-pente" transform="translate(50 -318) rotate(-20)" opacity="0"><rect x="-6" y="-40" width="12" height="60" rx="3" fill="#2f3a46"/>${Array.from({ length: 8 }, (_, i) => `<rect x="-14" y="${-36 + i * 7}" width="9" height="3" fill="#2f3a46"/>`).join("")}</g>`;
  s += `<g id="ne-tes" transform="translate(80 -290)"><g id="ne-tes-a"><path d="M0 0 L6 -44" stroke="#c9ced1" stroke-width="6" stroke-linecap="round"/><circle cx="-6" cy="10" r="9" fill="none" stroke="#c0583a" stroke-width="5"/></g><g id="ne-tes-b"><path d="M0 0 L-6 -44" stroke="#dfe3e5" stroke-width="6" stroke-linecap="round"/><circle cx="6" cy="10" r="9" fill="none" stroke="#c0583a" stroke-width="5"/></g></g>`;
  return s + "</g>";
}
// o cliente na cadeira, de frente, com a capa
function cliente() {
  let s = `<g id="cl">`;
  s += `<rect x="-14" y="-40" width="28" height="40" fill="#8a9396"/><ellipse cx="0" cy="0" rx="70" ry="12" fill="#6b7477"/>`;
  s += `<rect x="-78" y="-150" width="156" height="34" rx="12" fill="#7a2a36"/><rect x="-92" y="-196" width="24" height="70" rx="10" fill="#5e1f29"/><rect x="68" y="-196" width="24" height="70" rx="10" fill="#5e1f29"/>`;
  s += `<path d="M-30 -268 Q-96 -240 -86 -120 L86 -120 Q96 -240 30 -268 Z" fill="#3b6f86"/><path d="M-60 -200 L-50 -126 M-20 -230 L-16 -124 M20 -230 L16 -124 M60 -200 L50 -126" stroke="#f1eee9" stroke-width="5" opacity=".35"/>`;
  s += `<rect x="-11" y="-286" width="22" height="20" fill="#c4876a"/>`;
  s += cabeca({ id: "cl", cabelo: "curto", corCabelo: "#2a1c14" }, 0, -318, 36);
  return s + "</g>";
}
$("#mu").innerHTML = `
  <defs><radialGradient id="g-luz" cx="1210" cy="1180" r="900" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f1d6b8" stop-opacity=".22"/><stop offset="1" stop-color="#f1d6b8" stop-opacity="0"/></radialGradient>
    <linearGradient id="g-parede" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16232b"/><stop offset="1" stop-color="#1d2f38"/></linearGradient></defs>
  <rect x="-1000" y="-1200" width="4400" height="2800" fill="url(#g-parede)"/>
  <rect x="-1000" y="1440" width="4400" height="120" fill="#1f5f8b"/><text x="1200" y="1514" text-anchor="middle" font-family="Geist" font-weight="800" font-size="44" letter-spacing="9" fill="#f1eee9" opacity=".55">PARTIDA DA SEMANA</text>
  <rect x="-1000" y="${CHAO}" width="4400" height="900" fill="#11181b"/><rect x="-1000" y="1560" width="4400" height="40" fill="#18232a"/>
  <rect x="-1000" y="-1200" width="4400" height="2800" fill="url(#g-luz)"/>
  <g id="mesa"><rect x="800" y="1316" width="22" height="${CHAO - 1316}" fill="#2b3438"/><rect x="1580" y="1316" width="22" height="${CHAO - 1316}" fill="#2b3438"/>
    <rect x="760" y="${MESA_Y}" width="880" height="26" rx="4" fill="#1f5f8b"/><rect x="760" y="${MESA_Y}" width="880" height="6" fill="#f1eee9" opacity=".85"/>
    <rect x="1206" y="1196" width="8" height="${MESA_Y - 1196}" fill="#cfd4d6"/><rect x="1196" y="1200" width="28" height="86" fill="#f1eee9" opacity=".22"/><path d="M1196 1204 h28 M1196 1222 h28 M1196 1240 h28 M1196 1258 h28 M1196 1276 h28" stroke="#f1eee9" stroke-width="2" opacity=".5"/></g>
  <g id="ca-pos" transform="translate(600 ${CHAO}) scale(1.25)">${dePe(CAIO)}<path d="M-26 -386 l-8 -22 l18 12 l2 -24 l14 22 l10 -20 l6 24 l14 -14 l-4 22 Z" fill="#3a2418"/></g>
  <g id="cl-pos" transform="translate(1960 ${CHAO + 10}) scale(1.25)">${cliente()}</g>
  <g id="nb-pos" transform="translate(1780 ${CHAO}) scale(1.25)">${barbeiro()}</g>`;
const MU = $("#mu");

// ====================== as mensagens (as bolinhas) ======================
// [id da frase, quem manda, texto, hora no relógio]
const MSG = [["saque", "c", "Tem horário amanhã?", "13:00"], ["devolve", "n", "Às 10.", "13:40"], ["r3", "c", "10 não dá. E à tarde?", "14:05"], ["r4", "n", "Quatro horas?", "14:50"],
  ["r5", "c", "Consegue às cinco?", "15:10"], ["r6", "n", "Cinco tá marcado. Cinco e meia?", "15:35"], ["r7", "c", "Fechado!", "15:50"], ["r8", "n", "Opa, acabou de sair. Seis?", "16:00"]];
const BOLAS = MSG.map(([id, quem, txt, hora], k) => {
  const el = document.createElement("div"); el.className = "bola " + quem; el.innerHTML = `<small>${quem === "c" ? "Caio" : "Neto"}</small>${txt}`; $("#bolas").appendChild(el);
  const sai_ = k === 0 ? T.tem - 0.04 : k === 1 ? T.as - 0.04 : I(id) - 0.04;
  return { el, quem, hora, sai: sai_, voo: k < 2 ? 0.7 : 0.5 };
});
BOLAS.forEach((b, k) => { b.ate = k < BOLAS.length - 1 ? BOLAS[k + 1].sai : T.nada; });
// o caminho: da raquete de quem manda até quicar do outro lado da rede, e dali até a raquete de quem recebe
function caminho(b, x) {
  const [a, c] = b.quem === "c" ? [P_C, P_N] : [P_N, P_C], q = [b.quem === "c" ? 1480 : 940, MESA_Y - 6];
  if (x < 0.62) { const u = x / 0.62; return [lerp(a[0], q[0], u), lerp(a[1], q[1], u) - 330 * Math.sin(Math.PI * u) - (a[1] - q[1]) * 0]; }
  const u = (x - 0.62) / 0.38; return [lerp(q[0], c[0], u), lerp(q[1], c[1] - ACIMA, u) - 120 * Math.sin(Math.PI * u)];
}
// o som da partida: a raquetada ao sair e o quique do outro lado
const SONS = [{ t: 0.22, tipo: "apito", ganho: 0.8 }];
for (const b of BOLAS) SONS.push({ t: b.sai + 0.02, tipo: "toc", ganho: 0.9 }, { t: b.sai + b.voo * 0.62, tipo: "quica", ganho: 0.7 });

// ====================== o celular: a outra barbearia, e depois a agenda do Neto ======================
const SLOTS = ["09:00", "10:00", "11:00", "13:00", "14:00", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30", "18:00"];
function agenda(p, nome, url, cor, livres, dia) {
  return `<div class="tela" id="${p}-ag"><div class="ms-url">${ic("cadeado")}<span>${url}</span></div>
    <div class="ms-topo"><span>${nome}</span><i></i></div>
    <div class="ag-tit">Escolha o horário<small>Corte · 40 min</small></div>
    <div class="ag-dias">${["Qui|05", "Sex|06", "Sáb|07", "Seg|09"].map((d, i) => { const [a, b] = d.split("|"); return `<b class="${i === dia ? "sel" : ""}" ${i === dia ? `style="background:${cor}"` : ""}>${a}<i>${b}</i></b>`; }).join("")}</div>
    <div class="ag-grade">${SLOTS.map(h => `<i class="${livres.includes(h) ? "" : "oc"}" data-h="${h}">${h}</i>`).join("")}</div>
    <div class="ag-ok" id="${p}-ok"><div class="ck">${ic("check")}</div><b>Horário marcado</b><span id="${p}-quando"></span></div>
    <div class="dedo" id="${p}-dedo"></div></div>`;
}
const CAL = `<div class="tela" id="n-cal"><div class="cal-topo"><div><b>Sexta, 06</b><small>Agenda do Neto · Google</small></div><i>06</i></div>
  <div style="position:relative;margin-top:14px">${["15:00", "16:00", "17:00", "18:00", "19:00"].map(h => `<div class="cal-h" data-h="${h}"></div>`).join("")}
    <div class="cal-ev" style="top:2px;height:54px;background:#2f6f86">Corte<small>Léo · 15:00</small></div>
    <div class="cal-ev" style="top:86px;height:54px;background:#4f6b4a">Barba<small>Davi · 16:00</small></div>
    <div class="cal-ev" id="n-novo" style="top:212px;height:54px;background:var(--terracota)">Corte<small>Rafa · 17:30 · pelo site</small></div></div></div>`;
$("#fone").innerHTML = `<span class="exemplo claro">exemplo</span><div class="visor">${barra("13:12")}
  ${agenda("o", "Barbearia Navalha", "barbearianavalha.com.br", "#2f6f86", ["10:00", "13:00", "15:30", "16:30", "18:00"], 0)}
  ${agenda("n", "Barbearia do Neto", "barbeariadoneto.com.br", "#b25134", ["10:00", "11:00", "17:30", "18:00"], 1)}${CAL}</div>`;
const FONE = $("#fone"), HORA = $(".status .hora", FONE);
const mostra = id => $$(".tela", FONE).forEach(el => { el.style.display = el.id === id ? "block" : "none"; });
const slot = (p, h) => $(`#${p}-ag .ag-grade i[data-h="${h}"]`);
$("#o-quando").textContent = "Quinta, 05 · 15:30 · Corte"; $("#n-quando").textContent = "Sexta, 06 · 17:30 · Corte";

// ====================== quadro a quadro ======================
const LARGA = [1306, 1200, 0.64], NO_CAIO = [640, 1330, 1.3], NO_NETO = [1870, 1330, 1.2];
const CAM = [
  [0, 1200, 1250, 1.25], [T.semana + 0.3, ...LARGA], [S.jogadores - 0.1, ...LARGA],
  [S.jogadores + 0.35, ...NO_CAIO], [T.neto - 0.3, ...NO_CAIO], [T.neto + 0.25, ...NO_NETO], [S.rali - 0.35, ...NO_NETO], [S.rali + 0.25, ...LARGA],
  [S.desiste + 1.8, ...LARGA], [S.netao - 0.01, 1870, 1320, 1.15], [S.site - E, 1870, 1320, 1.35],
  [S.site, ...LARGA], [S.fecho - E, ...LARGA], [S.fecho, 1870, 1300, 1.25], [S.marca, 1870, 1290, 1.4],
];
const mundoVisivel = t => t < S.desiste + 1.74 || em(t, S.netao, S.site) || em(t, T.so - 0.3, S.marca);
function qMundo(t) {
  const cam = pose(CAM, t);
  camera(MU, cam);
  // o Caio: devolve com o celular; quando para de responder, abaixa e vai embora
  const sai_ = fase(t, T.nada + 0.5, T.nada + 1.5), anda = em(t, T.nada + 0.5, T.nada + 1.5);
  attr($("#ca-pos"), "transform", `translate(${lerp(600, -200, sai_).toFixed(1)} ${CHAO}) scale(1.25)`);
  pernas("ca", t, anda);
  boca("ca", t >= T.nada ? "reta" : em(t, T.oito, T.nada) ? "triste" : em(t, T.caio - 0.1, S.rali) ? "sorriso" : "reta");
  fecha("ca", (t % 2.7) < 0.12 ? 1 : 0);
  // o Neto: celular numa mão e tesoura na outra; no fim, o pente no lugar do celular
  const fim = t >= S.fecho, cortando = em(t, S.jogadores, S.desiste + 2) || em(t, S.netao, S.site) || fim;
  const abre = cortando ? (Math.sin(t * (fim ? 11 : 7)) > 0 ? 1 : 0) : 0;
  attr($("#ne-tes-a"), "transform", `rotate(${abre ? -14 : 0})`); attr($("#ne-tes-b"), "transform", `rotate(${abre ? 14 : 0})`);
  attr($("#ne-cel"), "opacity", fim ? 0 : 1); attr($("#ne-pente"), "opacity", fim ? 1 : 0);
  attr($("#ne-pente"), "transform", `translate(50 ${(-318 + (fim ? Math.sin(t * 6) * 6 : 0)).toFixed(1)}) rotate(-20)`);
  attr($("#ne-be"), "d", BE[fim ? 1 : 0]); attr($("#ne-me"), "cx", fim ? 50 : -80); attr($("#ne-me"), "cy", fim ? -318 : -262);
  const zap = BOLAS.some(b => em(t, b.sai - 0.3, b.sai + 0.1) && b.quem === "n") || em(t, T.outra - 0.6, T.outra + 0.3);
  attr($("#ne-tela"), "fill", zap ? "#f1eee9" : "#9cc6e0");
  boca("ne", fim ? "sorriso" : em(t, T.uma, S.site) ? "reta" : "sorriso"); fecha("ne", (t % 3.3) < 0.12 ? 1 : 0);
  // o cliente: cada vez mais impaciente; no fim, sorri
  boca("cl", fim ? "sorriso" : em(t, S.rali + 4, S.site) ? "triste" : "reta");
  attr($("#clsob"), "transform", !fim && em(t, S.rali + 4, S.site) ? "translate(0 5)" : "");
  fecha("cl", fim ? 0.4 : (t % 4.1) < 0.12 ? 1 : 0, -320);
  return cam;
}
function qBolas(t, cam) {
  const visivel = em(t, S.rali - 0.2, S.licao);
  BOLAS.forEach((b, k) => {
    const el = b.el;
    if (!visivel || t < b.sai - 0.02) { el.style.opacity = 0; el.style.visibility = "hidden"; return; }
    let wx, wy, s = 1, r = 0, o = 1;
    const x = fase(t, b.sai, b.sai + b.voo);
    if (x < 1) { [wx, wy] = caminho(b, x); s = 0.75 + 0.4 * Math.sin(Math.PI * Math.min(1, x / 0.62)); r = (b.quem === "c" ? 1 : -1) * 8 * Math.sin(Math.PI * x); }
    else {
      // descansa na raquete de quem recebeu, até a próxima sair
      const [cx, cy] = b.quem === "c" ? P_N : P_C, d = t - b.sai - b.voo;
      wx = cx; wy = cy - ACIMA - 10 * Math.sin(d * 3);
      o = 1 - fase(t, b.ate - 0.05, b.ate + 0.15);
      if (k === BOLAS.length - 1) { // o "Seis?" ninguém devolve: cai do lado do Caio e quica para longe
        const q = fase(t, T.nada - 0.05, T.nada + 1.3);
        if (q > 0) { const chao = CHAO - 70, alto = (chao - wy) * (1 - q) ** 1.6; wx = lerp(cx, cx - 420, q); wy = chao - alto * Math.abs(Math.cos(Math.PI * 1.5 * Math.sqrt(q) * 2)); r = -30 * q; }
        o = 1 - fase(t, T.nada + 1.0, T.nada + 1.4);
      }
    }
    const [sx, sy] = naTela(cam, wx, wy), w = el.offsetWidth, h_ = el.offsetHeight;
    const livre = k === BOLAS.length - 1 && t > T.nada; // a última sai da tela rolando
    pos(el, { x: livre ? Math.min(sx - w / 2, clamp(sx - w / 2, 24, 1056 - w)) : clamp(sx - w / 2, 24, 1056 - w), y: sy - h_ / 2, s, r, o });
  });
}
// o placar da transmissão e o resultado
function qPlacar(t) {
  const fim = t >= T.so - 0.3, abre = t < S.rali - 0.3, on = em(t, 0, S.jogadores + 0.3) || em(t, S.rali - 0.2, S.desiste) || em(t, T.so - 0.3, S.fecho + 0.3);
  const t0 = fim ? T.so - 0.3 : abre ? 0.25 : S.rali - 0.2;
  const o = fase(t, t0, t0 + 0.3) * (1 - (fim ? fase(t, S.fecho, S.fecho + 0.3) : abre ? fase(t, S.jogadores, S.jogadores + 0.3) : fase(t, T.oito - 0.2, T.oito + 0.1)));
  for (const id of ["#placar", "#contas", "#ao-vivo"]) pos($(id), { o: on ? o : 0, y: (1 - sai(fase(t, t0, t0 + 0.4))) * 20 });
  $("#pl-e").textContent = fim ? "RAFA" : "CAIO";
  if (fim) { $("#relo").textContent = "21:40"; $("#n-msg").textContent = 0; $("#n-marc").textContent = t >= OK.sai + OK.voo ? 1 : 0; $("#relo").style.transform = ""; $("#n-marc").style.color = t >= OK.sai + OK.voo ? "#e8855e" : ""; return; }
  $("#n-marc").style.color = "";
  let n = 0, hora = "13:00";
  for (const b of BOLAS) if (t >= b.sai) { n++; hora = b.hora; }
  if (em(t, T.quarenta, BOLAS[1].sai)) { const x = ease(fase(t, T.quarenta, T.quarenta + 1)); hora = `13:${String(Math.round(40 * x)).padStart(2, "0")}`; }
  $("#relo").textContent = hora; $("#n-msg").textContent = n; $("#n-marc").textContent = 0;
  $("#relo").style.transform = `scale(${(1 + 0.08 * Math.max(...BOLAS.map(b => pulso(t, b.sai, 0.3)), pulso(t, T.quarenta, 1))).toFixed(3)})`;
  $("#ao-vivo i").style.opacity = Math.sin(t * 5) > 0 ? 1 : 0.3;
  // o resultado: oito mensagens, três horas, nenhum horário
  const r = fase(t, T.oito - 0.15, T.oito + 0.25), fora = fase(t, T.nada - 0.1, T.nada + 0.25);
  pos($("#resultado"), { y: (1 - sai(r)) * 50, s: r > 0 ? lerp(0.85, 1, volta(r)) : 0.85, o: em(t, T.oito - 0.2, T.nada + 0.3) ? Math.min(1, r * 3) * (1 - fora) : 0 });
  $$("#resultado .r").forEach((el, k) => { const a = entra(t, [T.oito, T.tres, T.ninguem][k]); pos(el, { y: a.y * 0.6, o: a.o }); });
  $("#resultado .zero b").style.transform = `scale(${(1 + 0.18 * pulso(t, T.marcou, 0.5)).toFixed(3)})`;
}
// as tarjas de apresentação
function qTarjas(t) {
  for (const [id, t0, t1] of [["#tj-caio", T.caio - 0.1, T.neto - 0.35], ["#tj-neto", T.neto + 0.1, S.rali - 0.3]]) {
    const a = fase(t, t0, t0 + 0.3), b = fase(t, t1 - 0.2, t1);
    pos($(id), { x: (1 - saiX(a)) * -500 + b * -500, o: em(t, t0, t1) ? 1 : 0 });
  }
}
// o celular: a outra barbearia (o Caio marca em um toque) e a agenda do Neto
const FONE_P = [
  [T.outro - 0.3, 540, 2300, 0.95, 6, 0], [T.outro + 0.15, 540, 1040, 1, 0, 1], [S.licao - 0.25, 540, 1040, 1, 0, 1], [S.licao, 540, 2300, 0.95, -6, 0],
  [S.site - 0.25, 540, 2300, 0.95, 6, 0], [S.site + 0.15, 540, 1040, 1, 0, 1], [T.so - 0.3, 540, 1040, 1, 0, 1], [T.so, 540, 2300, 0.95, -6, 0],
];
function qFone(t) {
  const [cx, cy, s, r, o] = pose(FONE_P, t);
  pos(FONE, { x: cx - 220, y: cy - 450, s, r, o });
  if (o <= 0.002) return;
  const deles = t < S.licao, p = deles ? "o" : "n";
  const tap = deles ? T.toque - 0.15 : T.um - 0.1, livres = deles ? T.livres1 : T.livres, alvo = deles ? "15:30" : "17:30";
  const cal = !deles && t >= T.cai - 0.45;
  mostra(cal ? "n-cal" : `${p}-ag`);
  HORA.textContent = deles ? "09:12" : "21:40";
  if (cal) {
    const d = fase(t, T.cai - 0.1, T.cai + 0.35);
    pos($("#n-novo"), { y: (1 - saiX(d)) * -260, s: d > 0 ? lerp(0.9, 1, volta(d)) : 0.9, o: Math.min(1, d * 4) });
    $("#n-novo").style.boxShadow = `0 0 0 ${(6 * pulso(t, T.netoG - 0.1, 0.8)).toFixed(1)}px rgba(232,133,94,.6)`;
    return;
  }
  // os horários livres acendem; o dedo toca no escolhido; o horário marcado sobe de baixo
  $$(`#${p}-ag .ag-grade i:not(.oc)`).forEach((el, k) => { const a = pulso(t, livres - 0.05 + k * 0.06, 0.7); el.style.boxShadow = a > 0.01 ? `0 0 0 ${(5 * a).toFixed(1)}px rgba(232,133,94,${(0.8 * a).toFixed(2)})` : ""; });
  const sl = slot(p, alvo), esc = t >= tap + 0.2;
  sl.style.background = esc ? "#1e2528" : ""; sl.style.color = esc ? "#fff" : ""; sl.style.borderColor = esc ? "#1e2528" : "";
  const dd = $(`#${p}-dedo`), x = fase(t, tap - 0.35, tap + 0.3);
  dd.style.left = `${sl.offsetLeft + sl.offsetWidth / 2}px`; dd.style.top = `${sl.offsetTop + sl.offsetHeight / 2}px`;
  pos(dd, { s: lerp(1.5, 0.8, sai(x)), o: x > 0 && x < 1 ? Math.sin(Math.PI * x) : 0 });
  const ok = fase(t, tap + 0.35, tap + 0.75);
  $(`#${p}-ok`).style.transform = `translateY(${(110 * (1 - sai(ok))).toFixed(1)}%)`;
}
// a lição: as oito mensagens empilhadas, e a pilha cai
function qPilha(t) {
  if (!em(t, S.licao - 0.05, S.netao + 0.2)) return;
  BOLAS.forEach((b, k) => {
    const a = entra(t, S.licao + 0.05 + k * 0.11, 0.3), cai_ = fase(t, T.desistir + (7 - k) * 0.05, T.desistir + 0.75 + (7 - k) * 0.05);
    const w = b.el.offsetWidth;
    pos(b.el, { x: 540 - w / 2 + (k % 2 ? 26 : -26) + cai_ * (k % 2 ? 160 : -160), y: 1500 - k * 106 + a.y + 900 * cai_ * cai_, r: (k % 2 ? 2 : -2) + cai_ * (k % 2 ? 40 : -40), s: a.s, o: a.o * (1 - fase(t, S.netao - 0.1, S.netao + 0.15)) });
  });
}
// o Neto, de perto: corta com uma mão e responde com a outra; o celular vibra
const B_ZAP = Object.assign(document.createElement("div"), { className: "bola c", innerHTML: "<small>Cliente novo</small>Tem horário hoje?" });
$("#bolas").appendChild(B_ZAP);
function qZap(t) {
  const a = entra(t, T.resp - 0.15), o = em(t, T.resp - 0.2, S.site) ? a.o * (1 - fase(t, S.site - 0.2, S.site)) : 0;
  pos(B_ZAP, { x: 540 - B_ZAP.offsetWidth / 2, y: 620 + a.y, s: a.s, o });
}
// um saque só: o horário marcado pelo site cruza a mesa e para na raquete do Neto
const B_OK = Object.assign(document.createElement("div"), { className: "bola ok", innerHTML: "<small>Pelo site</small>Sexta · 17:30" });
$("#bolas").appendChild(B_OK);
const OK = { quem: "c", sai: I("so") + 0.15, voo: 0.75 };
function qSo(t, cam) {
  if (!em(t, OK.sai - 0.02, S.fecho + 0.3)) { pos(B_OK, { o: 0 }); return; }
  const x = fase(t, OK.sai, OK.sai + OK.voo);
  let [wx, wy] = x < 1 ? caminho({ quem: "c" }, x) : [P_N[0], P_N[1] - ACIMA - 10 * Math.sin((t - OK.sai) * 3)];
  if (x < 1 && x < 0.62) wx = lerp(-60, 1480, x / 0.62); // vem de fora da tela: quem marcou não precisa estar lá
  const [sx, sy] = naTela(cam, wx, wy), w = B_OK.offsetWidth, hh = B_OK.offsetHeight;
  pos(B_OK, { x: clamp(sx - w / 2, 24, 1056 - w), y: sy - hh / 2, s: (x < 1 ? 0.8 + 0.3 * Math.sin(Math.PI * x) : 1) * (1 + 0.12 * pulso(t, T.acaba, 0.5)), o: 1 - fase(t, S.fecho, S.fecho + 0.3) });
}

window.quadro = t => {
  palco.style.transform = "none";
  const mundo = mundoVisivel(t);
  vis($("#c-mundo"), mundo);
  const cam = mundo ? qMundo(t) : LARGA;
  const quente = em(t, S.site, T.so - 0.2);
  palco.style.background = quente ? "radial-gradient(64% 40% at 50% 54%,#b25134 0%,#5a2a1b 50%,#141c1e 100%)" : em(t, T.outro - 0.3, S.licao) ? "radial-gradient(64% 40% at 50% 54%,#2f6f86 0%,#163240 50%,#141c1e 100%)" : "radial-gradient(70% 45% at 50% 52%,#26333a 0%,#161c1f 70%)";
  $("#escuro").style.opacity = mundo && em(t, T.oito - 0.2, T.nada + 0.3) ? (0.55 * fase(t, T.oito - 0.2, T.oito + 0.2) * (1 - fase(t, T.nada, T.nada + 0.3))).toFixed(3) : 0;
  qTarjas(t); qPlacar(t); qBolas(t, cam); qPilha(t); qFone(t); qZap(t); qSo(t, mundo ? cam : LARGA);
  R.comum(t);
};
// a agenda nova: um saque só, uma bolinha do site para a raquete do Neto, e o apito do fim do jogo
SONS.push({ t: T.nada + 0.05, tipo: "quica", ganho: 0.7 }, { t: T.nada + 0.45, tipo: "quica", ganho: 0.5 }, { t: T.nada + 0.8, tipo: "quica", ganho: 0.35 },
  { t: T.toque - 0.15, tipo: "toque", ganho: 0.8 }, { t: T.resp - 0.15, tipo: "ding", ganho: 0.6 }, { t: T.um - 0.1, tipo: "toque", ganho: 0.8 },
  { t: T.cai, tipo: "ding", ganho: 0.7 }, { t: OK.sai + 0.02, tipo: "toc", ganho: 0.9 }, { t: OK.sai + OK.voo * 0.62, tipo: "quica", ganho: 0.7 }, { t: T.acaba, tipo: "apito", ganho: 0.8 }, { t: T.duas - 0.3, tipo: "tesoura", ganho: 0.6 }, { t: T.duas + 0.5, tipo: "tesoura", ganho: 0.5 });
window.preparar = () => R.preparar([0.3, T.semana + 0.4, T.cabelo + 0.3, T.pessoa + 0.3, T.tem + 0.35, T.quarenta + 0.6, T.as + 0.5, I("r4") + 0.3, I("r6") + 0.6, I("r8") + 0.7,
  T.tres + 0.3, T.marcou + 0.2, T.nada + 0.4, T.nada + 1.2, T.lugar, T.livres1 + 0.3, T.toque + 0.5, T.licao + 1.0, T.desistir + 0.4, T.maoU + 0.3, T.outra,
  T.fez + 0.4, T.livres + 0.3, T.um + 0.5, T.cai + 0.5, T.so + 0.4, T.acaba + 0.2, T.duas, F.moral.ini + 1.2, F.marca.ini + 1.3, F.cta.ini + 1.6], SONS);
await R.pronto();
</script>
