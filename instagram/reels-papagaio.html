<title>Reels narrado: o papagaio da recepção</title>
<!-- Reels do Instagram (1080 × 1920, 30 quadros/s) com voz. Reels 2 da série com história (27/10/2026).
     Alvo: o dono de consultório odontológico, clínica ou ótica cuja recepção responde as mesmas perguntas o dia inteiro.
     Objetivo: ele perceber que essas perguntas têm resposta fixa e que quem pergunta à noite e fica sem resposta marca
     em outro lugar; o site responde a qualquer hora, e o paciente chega decidido.
     A história: a Cida responde tudo, tenta o papel no balcão e o áudio de quatro minutos; o Doutor Paulo arruma um
     papagaio que decora as respostas. Funciona, mas só no balcão: as perguntas chegam às onze da noite, e o papagaio
     dorme às oito. Então ele faz um site. No fim, o papagaio só repete "Tá no site!". Tudo é fictício, e as telas levam
     o selo "exemplo". A Renderiza só aparece no fim.
     O tempo de tudo sai da narração: narracao/reels-papagaio.json → python3 instagram/narrar.py reels-papagaio → esta
     página lê reels-papagaio.tempos.json. A recepção é um desenho só, com a sua câmera; o quarto é outro.
     Sem animação de CSS: window.quadro(t) desenha o instante t (s). -->

const volta = x => (x <= 0 ? 0 : 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2)); // passa do ponto e volta
const lerp = (a, b, x) => a + (b - a) * x;

function pos(el, { x = 0, y = 0, s = 1, r = 0, o = 1, b = 0 } = {}) {
  el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${r.toFixed(2)}deg) scale(${s.toFixed(4)})`;
  el.style.opacity = o.toFixed(3);
  el.style.filter = b > 0.15 ? `blur(${b.toFixed(1)}px)` : "";
  el.style.visibility = o <= 0.002 ? "hidden" : "";
}
const attr = (el, k, v) => el.setAttribute(k, v);
const entra = (t, t0, d = 0.32) => { const x = fase(t, t0 - 0.04, t0 + d); return { x, s: x > 0 ? lerp(0.6, 1, volta(x)) : 0.6, o: x > 0 ? Math.min(1, x * 3) : 0, y: (1 - sai(x)) * 30 }; };
const limpa = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9-]/g, "");
function W(id, pal, n = 0) {
  const ps = F[id].palavras, alvo = limpa(pal);
  const xs = ps.filter(p => limpa(p.p) === alvo).length ? ps.filter(p => limpa(p.p) === alvo) : ps.filter(p => limpa(p.p).startsWith(alvo));
  if (!xs[n]) throw new Error(`sem a palavra "${pal}" na frase ${id}`);
  return xs[n].ini;
}
const em = (t, a, b) => t >= a && t < b;
const xd = (el, ax) => clamp(ax - el.offsetWidth + 70, 24, 1056 - el.offsetWidth); // balão com a ponta à direita, sem sair da tela
const xe = (el, ax) => clamp(ax - 70, 24, 1056 - el.offsetWidth); // balão com a ponta à esquerda
const vis = (el, v) => { el.style.display = v ? "block" : "none"; };
const E = 0.001;
function pose(P, t) {
  if (t <= P[0][0]) return P[0].slice(1);
  for (let k = 0; k < P.length - 1; k++) if (t < P[k + 1][0]) { const a = P[k], b = P[k + 1], x = ease(fase(t, a[0], b[0])); return a.slice(1).map((v, i) => lerp(v, b[i + 1], x)); }
  return P[P.length - 1].slice(1);
}
// câmera de um desenho: o ponto (cx, cy) fica no centro da tela, com zoom s
const camera = (g, [cx, cy, s]) => attr(g, "transform", `translate(${(540 - cx * s).toFixed(1)} ${(960 - cy * s).toFixed(1)}) scale(${s.toFixed(4)})`);
const naTela = (cam, x, y) => [540 + (x - cam[0]) * cam[2], 960 + (y - cam[1]) * cam[2]];

// ---------- cenas: cada uma começa na primeira frase dela ----------
const ORDEM = ["manha", "perguntas", "tentativas", "bico", "juca", "noite", "dorme", "manha2", "site", "noite2", "almoco", "fecho", "marca", "cta"];
const S = {};
ORDEM.forEach((c, i) => { S[c] = i === 0 ? 0 : frases.find(f => f.cena === c).ini; });
const I = id => F[id].ini, FIM = id => F[id].fim;
const T = {
  whatsapp: W("sete", "whatsapp"), mensagens: W("sete", "mensagens"),
  q1: I("q1"), q2: I("q2"), q3: I("q3"), q4: I("q4"), responde: I("responde"), todas: W("responde", "todas"), mais: I("mais"), mesmas: W("mais", "mesmas"),
  terca: I("terca"), colou: W("terca", "colou"), balcaoT: W("terca", "balcao"), quarta: I("quarta"), audio: W("quarta", "audio"), minutos: W("quarta", "minutos"),
  ninguem: I("ninguem"), fim: W("ninguem", "fim"),
  quinta: I("quinta"), paulo: W("quinta", "paulo"), bico: W("quinta", "bico"), juca: I("juca"), papagaio: W("papagaio", "papagaio"),
  semana: W("decorou", "semana"), cor: W("decorou", "cor"), pj1: I("pj1"), pj2: I("pj2"), pj3: I("pj3"), funcionou: I("funcionou"), balcao: I("balcao"),
  nada: I("nada"), onze: I("onze"), dormia: I("dormia"), oito: W("dormia", "oito"), lia: I("lia"), deixa: I("outro"),
  fez: I("fez"), siteW: W("fez", "site"), horario: I("itens"), convenios: W("itens", "convenios"), preco: W("itens", "preco"), endereco: W("itens", "endereco"),
  estac: W("itens", "estacionamento"), zap: W("itens", "whatsapp"),
  agora: I("agora"), resposta: W("agora", "resposta"), manda: I("manda"), quero: I("quero"), almoco: I("almoco"), quente: W("almoco", "quente"),
  continua: I("continua"), repete: I("repete"), tanosite: I("tanosite"),
  renderiza: W("marca", "renderiza"), previa: W("cta", "previa"),
};

// ---------- ícones (Lucide) ----------
const IC = {

  mapa: '<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',

function partir(ws) {
  const txt = a => a.map(p => p.p).join(" ");
  for (let k = 0; k < ws.length - 1; k++) if (/[.?!]$/.test(ws[k].p)) return [...partir(ws.slice(0, k + 1)), ...partir(ws.slice(k + 1))];
  if (txt(ws).length <= 44) return [ws];
  let melhor = 1, nota = Infinity;
  for (let k = 1; k < ws.length; k++) {
    let n = Math.abs(txt(ws.slice(0, k)).length - txt(ws.slice(k)).length);
    if (/[,:;]$/.test(ws[k - 1].p)) n -= 20; else if (/^(e|com|sem|para|que)$/i.test(ws[k].p)) n -= 6;
    if (n < nota) { nota = n; melhor = k; }
  }
  return [...partir(ws.slice(0, melhor)), ...partir(ws.slice(melhor))];
}

    pernas("dr", t, a < 0.98); boca("dr", t >= T.juca ? "sorriso" : "reta");
    attr($("#drbraco"), "transform", t >= T.juca - 0.1 ? `rotate(${(-10 * saiX(fase(t, T.juca - 0.1, T.juca + 0.2))).toFixed(1)} 47 -272)` : "rotate(60 47 -272)");
  }
  // terça: o paciente para bem na frente do papel e pergunta
  const pa = em(t, T.colou + 0.25, S.bico);
  attr($("#pa-pos"), "opacity", pa ? 1 : 0);
  if (pa) { const a = sai(fase(t, T.colou + 0.25, T.balcaoT - 0.15)); attr($("#pa-pos"), "transform", `translate(${lerp(1300, 225, a).toFixed(1)} 1730) scale(-1.55 1.55)`); pernas("pa", t, a < 0.98); }
  // quinta em diante: a fila do Juca
  const pb = em(t, S.juca, T.balcao + 1.2);
  attr($("#pb-pos"), "opacity", pb ? 1 : 0);
  if (pb) {
    const sai_ = fase(t, T.balcao, T.balcao + 1.2);
    attr($("#pb-pos"), "transform", `translate(${(930 + 420 * sai_).toFixed(1)} 1690) scale(${sai_ > 0 ? 1.5 : -1.5} 1.5)`);
    pernas("pb", t, sai_ > 0 && sai_ < 1); boca("pb", t >= T.funcionou ? "sorriso" : "reta");
  }
  const pc = em(t, S.fecho - 0.2, S.marca);
  attr($("#pc-pos"), "opacity", pc ? 1 : 0);
  if (pc) { const a = sai(fase(t, S.fecho - 0.2, T.repete)); attr($("#pc-pos"), "transform", `translate(${lerp(1350, 950, a).toFixed(1)} 1690) scale(-1.5 1.5)`); pernas("pc", t, a < 0.98); boca("pc", t >= T.tanosite + 0.2 ? "sorriso" : "reta"); }
  // o prato do almoço
  attr($("#rc-prato"), "opacity", em(t, S.almoco - 0.05, S.fecho) ? 1 : 0);
  attr($("#rc-vapor"), "transform", `translate(0 ${(-((t * 30) % 20)).toFixed(1)})`);
  // balões
  QS.forEach((q, i) => {
    const a = entra(t, q.t0), volta_ = entra(t, T.mais + i * 0.1);
    const ok = fase(t, T.responde + i * 0.22, T.responde + i * 0.22 + 0.2), some = fase(t, T.responde + i * 0.22 + 0.25, T.responde + i * 0.22 + 0.5);
    let o = 0, y = 0, s = 1;
    if (t < T.mais) { o = a.o * (1 - some); y = a.y - 40 * some; s = a.s; }
    else if (t < S.tentativas) { o = volta_.o * (1 - fase(t, S.tentativas - 0.15, S.tentativas)); y = volta_.y; s = volta_.s; }
    pos(q.el, { x: Math.min(q.x, 1056 - q.el.offsetWidth), y: q.y + y, s, o });
    $(".ok", q.el).style.opacity = t < T.mais ? ok : 0;
  });
  ECOS.forEach(e => { const a = entra(t, e.t0, 0.25); pos(e.el, { x: Math.min(e.x, 1056 - e.el.offsetWidth), y: e.y + a.y, s: a.s, o: t < S.tentativas ? a.o * (1 - fase(t, S.tentativas - 0.15, S.tentativas)) : 0 }); });
  // a pergunta do paciente da terça
  {
    const a = entra(t, T.balcaoT + 0.05), o = em(t, T.balcaoT, T.quarta + 0.1) ? a.o * (1 - fase(t, T.quarta - 0.1, T.quarta + 0.1)) : 0;
    const [hx, hy] = naTela(cam, 225, 1730 - 400 * 1.55);
    pos(B_PA, { x: xe(B_PA, hx + 150), y: hy - 120 + a.y, s: a.s, o });
  }
  // as respostas do Juca
  const [bx, by] = juTela(cam, 70, -250);
  B_JU.forEach((b, i) => {
    const t0 = [T.pj1, T.pj2, T.pj3][i], t1 = [T.pj2, T.pj3, T.funcionou][i] - 0.05;
    const a = entra(t, t0 - 0.04), o = em(t, t0 - 0.1, t1) ? a.o * (1 - fase(t, t1 - 0.12, t1)) : 0;
    pos(b, { x: xe(b, bx), y: by - b.offsetHeight - 20 + a.y, s: a.s, o });
  });
  {
    const a = entra(t, T.repete + 0.1), o = em(t, T.repete, S.marca) ? a.o * (1 - fase(t, T.tanosite - 0.15, T.tanosite + 0.05)) : 0;
    const [hx, hy] = naTela(cam, 950, 1690 - 400 * 1.5);
    pos(B_PC, { x: xd(B_PC, hx + 30), y: hy - B_PC.offsetHeight - 40 + a.y, s: a.s, o });
    const b = entra(t, T.tanosite - 0.04, 0.4), ob = em(t, T.tanosite - 0.1, S.marca) ? b.o * (1 - fase(t, S.marca - 0.35, S.marca - 0.1)) : 0;
    pos(B_SITE, { x: xe(B_SITE, bx), y: by - B_SITE.offsetHeight - 20 + b.y, s: b.s, o: ob, r: -3 });
  }
}

// o quarto: ela pergunta às onze da noite e acha a resposta na hora
function qQuarto(t) {
  camera($("#qt"), pose([[S.noite2, 440, 1170, 1.08], [T.manda, 430, 1160, 1.16]], t));
  boca("ri", t >= T.resposta ? "sorriso" : "reta");
  attr($("#riolhos"), "transform", "translate(6 4)");
}

// o celular: onde ele está e qual tela mostra
const FONE_P = [
  [T.quarta - 0.35, 320, 1500, 0.8, 6, 0], [T.quarta + 0.05, 320, 520, 0.92, 0, 1], [S.bico - 0.25, 320, 520, 0.92, 0, 1], [S.bico, 320, 560, 0.9, 0, 0],
  [T.onze - 0.45, 560, 1500, 0.8, -6, 0], [T.onze - 0.05, 560, 560, 0.86, -3, 1], [S.dorme - 0.15, 560, 560, 0.86, -3, 1], [S.dorme + 0.15, 560, 1300, 0.8, -6, 0],
  [S.manha2 - E, 620, 1500, 0.8, 6, 0], [S.manha2 + 0.35, 620, 540, 0.86, 2, 1], [S.site - 0.12, 620, 540, 0.86, 2, 1], [S.site - 0.02, 620, 540, 0.86, 2, 0],
  [S.site, 320, 1500, 0.8, 0, 0], [S.site + 0.3, 320, 500, 0.95, 0, 1], [S.noite2 - 0.1, 320, 500, 0.95, 0, 1], [S.noite2 + 0.4, 600, 560, 0.84, 3, 1],
  [T.manda - 0.25, 600, 560, 0.84, 3, 1], [T.manda - 0.1, 600, 560, 0.84, 3, 0],
  [T.manda - 0.09, 620, 1500, 0.8, 6, 0], [T.manda + 0.3, 620, 540, 0.86, 2, 1], [S.almoco - 0.12, 620, 540, 0.86, 2, 1], [S.almoco + 0.12, 620, 600, 0.86, 2, 0],
];
function qFone(t) {
  const [x, y, s, r, o] = pose(FONE_P, t);
  pos(FONE, { x, y, s, r, o });
  if (o <= 0.002) return;
  let tela = "audio";
  if (t >= T.manda - 0.1) tela = "quero";
  else if (t >= S.site) tela = "site";
  else if (t >= S.manha2) tela = "chat";
  else if (t >= S.bico) tela = "bloq";
  mostraTela(tela);
  HORA.textContent = { audio: "09:03", bloq: "", chat: "07:12", site: "23:04", quero: "07:30" }[tela];
  STATUS.style.color = tela === "bloq" ? "#fff" : "#1e2528";
  if (tela === "audio") {
    // ela aperta o play, ouve sete segundos e desiste
    const a = fase(t, T.ninguem - 0.4, T.fim - 0.1), tocando = a > 0 && a < 1;
    ONDAS.forEach((b, i) => b.classList.toggle("on", i < Math.round(3 * a))); // sete segundos de 4:12 mal saem do começo
    $("#au-dur").textContent = a > 0 ? `0:0${Math.min(7, Math.round(7 * a))}` : "4:12";
    $("#au-play").innerHTML = tocando ? '<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>';
    const m = fase(t, T.fim + 0.15, T.fim + 0.45);
    pos($("#au-resp"), { y: (1 - sai(m)) * 24, o: m });
  }
  if (tela === "bloq") $$(".bl-not", FONE).forEach((el, i) => { const m = fase(t, T.onze + i * 0.55, T.onze + i * 0.55 + 0.3); pos(el, { y: (1 - saiX(m)) * -40, o: m }); });
  if (tela === "chat") { const m = fase(t, T.deixa - 0.1, T.deixa + 0.2); pos($("#ch-deixa"), { y: (1 - sai(m)) * 24, o: m }); }
  if (tela === "site") {
    const noite = t >= S.noite2, ts = noite ? [T.resposta - 0.1] : [T.horario, T.convenios, T.preco, T.endereco, T.estac];
    $$(".ms-linha", FONE).forEach((el, i) => { el.style.background = `rgba(232,133,94,${(0.38 * (ts[i] !== undefined ? pulso(t, ts[i] - 0.1, noite ? 2.2 : 1.1) : 0)).toFixed(3)})`; });
    $("#mz").style.transform = `scale(${(1 + 0.08 * pulso(t, T.zap - 0.05, 0.6)).toFixed(3)})`;
  }
  if (tela === "quero") { const m = fase(t, T.quero - 0.1, T.quero + 0.2); pos($("#qr-msg"), { y: (1 - sai(m)) * 24, o: m }); }
}

function qFim(t) {
  for (const w of mcPal) { const x = fase(t, w.ini - 0.05, w.ini + 0.22); pos(w.el, { y: (1 - sai(x)) * 22, s: x > 0 ? lerp(0.85, 1, volta(x)) : 0.85, o: x > 0 ? Math.min(1, x * 3) : 0 }); }
  const m = fase(t, T.renderiza - 0.04, T.renderiza + 0.6), cta = ease(fase(t, S.cta - 0.32, S.cta + 0.22));
  pos($("#mc-linha"), { y: lerp(0, -150, ease(m)) - 200 * cta, s: lerp(1, 0.74, ease(m)), o: (1 - 0.35 * ease(m)) * (1 - cta) });
  pos($("#mc-simbolo"), { y: lerp(0, -330, cta), s: (m > 0 ? lerp(0.3, 1, volta(m)) : 0.3) * lerp(1, 0.44, cta), r: lerp(-140, 0, saiX(m)), o: m > 0 ? Math.min(1, m * 3) : 0, b: (1 - saiX(m)) * 14 });
  const nm = ease(fase(t, T.renderiza + 0.1, T.renderiza + 0.62));
  $("#mc-nome").style.clipPath = `inset(-30% ${(100 - 100 * nm).toFixed(2)}% -30% 0)`;
  pos($("#mc-nome"), { y: lerp(0, -462, cta) + (1 - nm) * 20, s: lerp(1, 0.5, cta) });
  for (const w of subPal) { const x = fase(t, w.ini - 0.05, w.ini + 0.22); pos(w.el, { y: (1 - sai(x)) * 18, o: x > 0 ? Math.min(1, x * 3) : 0 }); }
  pos($("#mc-sub"), { y: lerp(0, -560, cta), s: lerp(1, 0.78, cta), o: 1 - fase(t, S.cta + 0.3, S.cta + 0.7) });
  const est = saiX(fase(t, T.renderiza - 0.05, T.renderiza + 1));
  $("#mc-poli").setAttribute("transform", `translate(540 960) rotate(${(5 * (t - T.renderiza)).toFixed(2)}) scale(${lerp(0.3, 1, est).toFixed(3)}) translate(-540 -960)`);
  $("#mc-estrela").style.transform = `translateY(${lerp(0, -330, cta).toFixed(1)}px)`; $("#mc-estrela").style.opacity = est.toFixed(3);
  const b = fase(t, S.cta + 0.04, S.cta + 0.4), pb = pulso(t, T.previa, 0.32);
  pos($("#cta-botao"), { y: (1 - sai(b)) * 40, s: (b > 0 ? lerp(0.5, 1, volta(b)) : 0.5) * (1 + 0.05 * pb + 0.015 * Math.sin(t * 3.2) * fase(t, DUR - 2, DUR - 1)), o: b > 0 ? Math.min(1, b * 3) : 0 });
  $("#cta-previa").style.transform = `scale(${(1 + 0.14 * pb).toFixed(3)})`;
  const lz = ((t - T.previa) % 2.4) / 0.7; $("#cta-luz").style.transform = `translateX(${(t > T.previa && lz < 1 ? lerp(-200, 900, lz) : -300).toFixed(0)}px) skewX(-18deg)`;
  for (const w of ctaPal) { const x = fase(t, w.ini - 0.05, w.ini + 0.22); pos(w.el, { y: (1 - sai(x)) * 20, o: x > 0 ? Math.min(1, x * 3) : 0 }); }
  $("#cta-nota").style.opacity = fase(t, S.cta + 1.3, S.cta + 1.8).toFixed(3);
  $("#c-fim").style.opacity = fase(t, S.marca - 0.3, S.marca).toFixed(3);
}

window.quadro = t => {
  palco.style.transform = "none";
  const rec = t < S.site || em(t, T.manda - 0.1, S.marca), quarto = em(t, S.noite2, T.manda - 0.1), fim = t >= S.marca - 0.3;
  vis($("#c-rec"), rec); if (rec) qRec(t); else $$(".balao").forEach(b => pos(b, { o: 0 }));
  vis($("#c-quarto"), quarto); if (quarto) qQuarto(t);
  // o site do consultório: fundo na cor da marca dele
  palco.style.background = em(t, S.site, S.noite2) ? "radial-gradient(64% 40% at 50% 54%,#2a7f9e 0%,#1b4a5c 48%,#141c1e 100%)" : "#161c1f";
  $("#escuro").style.opacity = em(t, T.quarta - 0.3, S.bico) ? 0.55 * fase(t, T.quarta - 0.3, T.quarta + 0.1) * (1 - fase(t, S.bico - 0.25, S.bico)) : 0;
  qFone(t);
  vis($("#c-fim"), fim); if (fim) qFim(t);
  for (const p of POEIRA) {
    const y = ((p.y - t * p.v) % 2100 + 2100) % 2100 - 90, x = p.x + Math.sin(t * 0.35 + p.f) * 34, tw = 0.45 + 0.55 * Math.abs(Math.sin(t * 0.7 + p.f));
    p.el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${p.s.toFixed(2)})`;
    p.el.style.background = `radial-gradient(closest-side,rgba(236,150,112,${(0.45 * tw).toFixed(3)}),rgba(236,150,112,0))`;
  }
  // legendas
  for (const p of pedacos) {
    if (!p.el) continue;
    const v = t >= p.de && t < p.ate;
    p.el.style.display = v ? "" : "none";
    if (!v) continue;
    const fora = fase(t, p.ate - 0.08, p.ate);
    p.ws.forEach((w, k) => {
      const x = p.de < 0 ? 1 : fase(t, w.ini - 0.05, w.ini + 0.2);
      pos(p.wel[k], { y: (1 - sai(x)) * 22 - 14 * fora, s: x > 0 ? lerp(0.86, 1, volta(x)) : 0.86, o: (x > 0 ? Math.min(1, x * 3) : 0) * (1 - fora) });
    });
  }
  // tranco em cada impacto: soco de zoom, tremor e clarão
  let soco = 0, tremor = 0, flash = 0;
  for (const f of frases) if (f.impacto) {
    const x = fase(t, f.ini - 0.03, f.ini + 0.38); if (x > 0 && x < 1) { soco = Math.max(soco, 1 - sai(x)); tremor = Math.max(tremor, x < 0.35 ? 1 - x / 0.35 : 0); }
    const y = fase(t, f.ini - 0.03, f.ini + 0.2); if (y > 0 && y < 1) flash = Math.max(flash, 0.34 * (1 - y));
  }
  palco.style.transform = soco > 0 ? `translate(${(tremor * 9 * Math.sin(t * 97)).toFixed(1)}px,${(tremor * 7 * Math.cos(t * 83)).toFixed(1)}px) scale(${(1 + 0.045 * soco).toFixed(4)})` : "";
  $("#flash").style.opacity = flash.toFixed(3);
};

// cenas da trilha (ferramentas/video/trilha-pulso.py só conhece estas partes): o pulso diz qual é qual.
// As tentativas e o Juca são o groove ("insta"); a virada corta a batida ("nada"); a noite fica abafada ("volta") e
// o Juca dormindo só com o coração ("meio"); a mensagem da manhã sobe até o drop, que cai em "fez um site".
const TRILHA = { manha: "abre", perguntas: "google", tentativas: "insta", bico: "insta", juca: "insta", noite: "volta", dorme: "meio", manha2: "ese",
  site: "site", noite2: "site", almoco: "site", fecho: "fim", marca: "fim", cta: "cta" };
window.preparar = () => {
  window.quadro(0);
  return {
    duracao: DUR, narracao: NOME, bpm: 118, tom: 2,
    pulso: frases.map(f => ({ id: f.id, cena: TRILHA[f.cena], ini: f.ini, fim: f.fim, pausa: f.pausa || 0, impacto: !!f.impacto })),
    ensaio: [0.4, T.mensagens + 0.3, T.q3 + 0.3, T.todas + 0.2, T.mesmas + 0.7, T.colou + 0.6, T.balcaoT + 0.4, T.minutos, T.fim + 0.5, T.paulo, T.juca + 0.3,
      T.papagaio + 0.5, T.cor, T.pj1 + 0.4, T.pj3 + 0.4, T.balcao + 0.3, T.nada + 0.6, T.onze + 1.4, T.oito + 0.3, T.lia + 0.6, T.deixa + 0.6,
      T.siteW + 0.4, T.convenios + 0.2, T.estac + 0.2, T.agora + 0.6, T.resposta + 0.4, T.quero + 0.4, T.quente + 0.3, T.repete + 0.6, T.tanosite + 0.4,
      F.repete2.ini + 1.5, T.renderiza + 1.2, T.previa + 1.2].map(x => +x.toFixed(2)),
  };
};

await Promise.all(["800 76px Geist", "700 30px Geist", "600 30px Geist", "italic 600 30px Fraunces"].map(f => document.fonts.load(f).catch(() => {})));
await document.fonts.ready;
window.quadro(0);
window.pronto = true;
</script>
