<title>Reels narrado: a planilha</title>
<!-- Reels do Instagram (1080 × 1920, 30 quadros/s) com voz. Semana de 04 a 08/11/2026, Reels 3 (sexta, 19h), para fotógrafas.
     Alvo: a fotógrafa que abre a mini sessão de Natal pelo Stories e controla as vagas numa planilha. Objetivo: ela
     perceber que, quando as vagas moram no direct e na planilha, a mesma vaga é vendida duas vezes e horário fica preso
     por quem não paga, e que com a agenda online no site a cliente vê quantas vagas restam e reserva sozinha, o horário
     fica separado por 24 horas até o sinal, quem chega tarde vai para a lista de espera e o painel conta as vagas.
     v2 (03/11, depois da crítica de que o começo não prendia): abre no meio da confusão, com duas famílias de pijama de
     Natal chegando ao estúdio para a mesma foto das 10h20. Quem narra só se revela depois ("Eu sou a planilha da Lia"):
     viu a Lia marcar as duas e não podia avisar. A Lia resolve com uma foto das duas famílias juntas, e no Natal seguinte
     abre as vagas pelo site. Fecho: a planilha é demitida e passa a cuidar da lista de compras, onde anotar o leite duas
     vezes só faz sobrar leite. As telas seguem o exemplo do Estúdio Ciranda (/exemplos/agenda-fotografia e
     /exemplos/painel-fotografia). A agenda do painel não liga com o Google, e o vídeo não diz que liga. O painel não
     recebe o Pix: quem marca o sinal é a Lia. Tudo é fictício, e as telas levam o selo "exemplo". O tempo de tudo sai da
     narração: narracao/reels-planilha.json → python3 instagram/narrar.py reels-planilha. Sem animação de CSS:
     window.quadro(t) desenha o instante t (s). -->
