<!-- Reels do Instagram (1080 × 1920, 30 quadros/s) com voz. Versão 3 do Reels 1 da série com história (27/10/2026).
     Alvo: o dono de ótica, consultório ou clínica que só tem Instagram e WhatsApp e acha que o movimento caiu pela crise.
     Objetivo: ele entender que o cliente novo pesquisa antes de ir e, quando não acha nada, compra de outro sem avisar.
     A história: os clientes novos da Ótica da Lúcia somem, ela contrata um detetive, e cada pista dele é um problema
     real de quem não tem site. A virada: o próprio detetive sai de óculos novos da ótica da esquina, que tinha site.
     Tudo é fictício, e as telas das lojas levam o selo "exemplo". A Renderiza só aparece no fim.
     O tempo de tudo sai da narração: narracao/reels-detetive.json → python3 instagram/narrar.py reels-detetive → esta
     página lê reels-detetive.tempos.json. Cada cena é um desenho próprio (a ótica, o escritório, o quadro de pistas, a
     rua, a mesa) com a sua câmera. Sem animação de CSS: window.quadro(t) desenha o instante t (s). -->

<script type="module">
import { MARCAS } from "../site/marcas.mjs";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const NOME = "reels-detetive";
const { duracao: VOZ, frases } = await (await fetch(`narracao/${NOME}.tempos.json`)).json();
const DUR = Math.round((VOZ + 1.67) * 10) / 10; // a voz acaba e o convite fica mais 1,5 s na tela
const F = Object.fromEntries(frases.map(f => [f.id, f]));
const palco = $("#palco");

// ---------- contas ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const fase = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const sai = x => 1 - Math.pow(1 - x, 3);
const saiX = x => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const volta = x => (x <= 0 ? 0 : 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2)); // passa do ponto e volta
const lerp = (a, b, x) => a + (b - a) * x;
const pulso = (t, t0, d = 0.5) => { const x = fase(t, t0, t0 + d); return x > 0 && x < 1 ? Math.sin(Math.PI * x) : 0; };
const h = (i, k = 0) => { const s = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return s - Math.floor(s); };
function pos(el, { x = 0, y = 0, s = 1, r = 0, o = 1, b = 0 } = {}) {
  el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${r.toFixed(2)}deg) scale(${s.toFixed(4)})`;
  el.style.opacity = o.toFixed(3);
  el.style.filter = b > 0.15 ? `blur(${b.toFixed(1)}px)` : "";
  el.style.visibility = o <= 0.002 ? "hidden" : "";
}
const attr = (el, k, v) => el.setAttribute(k, v);
const entra = (t, t0, d = 0.32) => { const x = fase(t, t0 - 0.04, t0 + d); return { x, s: x > 0 ? lerp(0.6, 1, volta(x)) : 0.6, o: x > 0 ? Math.min(1, x * 3) : 0, y: (1 - sai(x)) * 30 }; };
const limpa = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9-]/g, "");
function W(id, pal, n = 0) {
  const ps = F[id].palavras, alvo = limpa(pal);

function partir(ws) {
  const txt = a => a.map(p => p.p).join(" ");
  for (let k = 0; k < ws.length - 1; k++) if (/[.?!]$/.test(ws[k].p)) return [...partir(ws.slice(0, k + 1)), ...partir(ws.slice(k + 1))];
  if (txt(ws).length <= 44) return [ws];
  let melhor = 1, nota = Infinity;
  for (let k = 1; k < ws.length; k++) {
    let n = Math.abs(txt(ws.slice(0, k)).length - txt(ws.slice(k)).length);
    if (/[,:;]$/.test(ws[k - 1].p)) n -= 20; else if (/^(e|com|sem|para|que)$/i.test(ws[k].p)) n -= 6;
    if (n < nota) { nota = n; melhor = k; }
  }
  return [...partir(ws.slice(0, melhor)), ...partir(ws.slice(melhor))];
}

  [S.oculos - 0.12, 590, 560, 0.86, 2, 1], [S.oculos, 590, 560, 0.86, 2, 0], [S.outra - 0.3, 320, 1500, 0.8, -6, 0], [S.outra + 0.12, 320, 540, 0.9, -2, 1],
  [S.relatorio - 0.2, 320, 540, 0.9, -2, 1], [S.relatorio, 320, 540, 0.9, -2, 0], [S.solucao - E, 320, 1500, 0.8, 6, 0], [S.solucao + 0.28, 320, 520, 0.92, 0, 1],
  [T.segunda - 0.2, 320, 520, 0.92, 0, 1], [T.segunda + 0.05, 320, 520, 0.92, 0, 0], [T.noite + 0.3, 520, 1500, 0.8, -6, 0], [T.noite + 0.7, 520, 600, 0.82, -3, 1],
  [S.marca - 0.3, 520, 600, 0.82, -3, 1], [S.marca, 520, 600, 0.82, -3, 0],
];
function qFone(t) {
  const [x, y, s, r, o] = pose(FONE_P, t);
  const solta = t >= S.solucao && t < T.segunda ? volta(fase(t, S.solucao, S.solucao + 0.4)) : 1;
  pos(FONE, { x, y, s: s * (t >= S.solucao && t < T.segunda ? lerp(0.85, 1, solta) : 1), r, o });
  if (o <= 0.002) return;
  // qual tela
  let tela = "busca";
  if (t >= S.noite) tela = "busca";
  else if (t >= S.solucao) tela = "luc";
  else if (t >= S.outra - 0.35) tela = "esq";
  else if (t >= S.mapa) tela = "mapa";
  else if (t >= S.fone) tela = "lig";
  else if (t >= T.chamou) tela = "dm";
  else if (t >= S.pista1) tela = "perfil";
  mostraTela(tela);
  $("#fone-ex").style.display = ["perfil", "dm", "lig", "mapa", "esq", "luc"].includes(tela) || t < S.pista1 ? "" : "none";
  if (tela === "busca") {
    const noite = t >= S.noite, txt = noite ? "detetive Moura" : "ótica perto de mim";
    const a = noite ? fase(t, T.pesqN - 0.1, T.nome + 0.3) : fase(t, T.pegou + 0.15, T.pesquisou + 0.3);
    $("#bq-txt").textContent = txt.slice(0, Math.round(txt.length * a));
    $("#bq-cur").style.opacity = Math.floor(t * 3) % 2 || a < 1 ? 1 : 0;
    const r1 = noite ? 0 : fase(t, T.pesquisou + 0.35, T.pesquisou + 0.6), r2 = noite ? 0 : fase(t, T.pesquisou + 0.5, T.pesquisou + 0.75);
    pos($("#bq-r1"), { y: (1 - sai(r1)) * 20, o: r1, s: 1 + 0.04 * pulso(t, T.fez, 0) });
    pos($("#bq-r2"), { y: (1 - sai(r2)) * 20, o: r2 });
    const v = noite ? fase(t, T.vazio - 0.25, T.vazio) : 0;
    pos($("#bq-vazio"), { y: (1 - sai(v)) * 20, o: v });
  }
  if (tela === "perfil") {
    const n = fase(t, T.n2022 - 0.3, T.n2022 + 0.1);
    $("#pf-natal").style.transform = `scale(${(1 + 0.12 * Math.sin(Math.PI * clamp(n))).toFixed(3)})`;
    $("#pf-natal").style.outline = n > 0 ? "6px solid #e8855e" : "none";
    $("#pf-natal").style.zIndex = 2;
    $("#pf-end").style.background = `rgba(232,133,94,${(0.38 * clamp(fase(t, T.direct - 0.3, T.direct))).toFixed(3)})`;
  }
  if (tela === "dm") {
    const m = fase(t, T.chamou, T.chamou + 0.3), v = fase(t, T.visto - 0.05, T.visto + 0.15);
    pos($("#dm-msg"), { y: (1 - sai(m)) * 30, o: m });
    pos($("#dm-visto"), { o: v });
  }
  if (tela === "lig") {
    const erro = t >= T.existeW - 0.1;
    $("#lg-st").textContent = erro ? "Este número não existe." : `chamando${".".repeat(1 + Math.floor(t * 3) % 3)}`;
    $("#lg-st").className = "lg-st" + (erro ? " erro" : "");
  }
  if (tela === "mapa") {
    $("#mp-pino").setAttribute("transform", `translate(206 ${(250 - 18 * pulso(t, T.aviso - 0.1, 0.5)).toFixed(1)})`);
    $("#mp-fech").style.transform = `scale(${(1 + 0.14 * pulso(t, T.fechadoW - 0.05, 0.5)).toFixed(3)})`;
  }
  if (tela === "esq" || tela === "luc") {
    const k = tela, ts = k === "esq" ? [T.horario, T.enderecoS, T.preco] : [T.siteW + 0.3, T.siteW + 0.7, T.siteW + 1.1];
    ts.forEach((t0, i) => { $(`#ml-${k}${i}`).style.background = `rgba(232,133,94,${(0.36 * pulso(t, t0 - 0.1, 1.2)).toFixed(3)})`; });
    $(`#mz-${k}`).style.transform = `scale(${(1 + 0.08 * pulso(t, k === "esq" ? T.zap - 0.05 : T.siteW + 1.5, 0.6)).toFixed(3)})`;
  }
}

function qFim(t) {
  for (const w of mcPal) { const x = fase(t, w.ini - 0.05, w.ini + 0.22); pos(w.el, { y: (1 - sai(x)) * 22, s: x > 0 ? lerp(0.85, 1, volta(x)) : 0.85, o: x > 0 ? Math.min(1, x * 3) : 0 }); }
  const m = fase(t, T.renderiza - 0.04, T.renderiza + 0.6), cta = ease(fase(t, S.cta - 0.32, S.cta + 0.22));
  pos($("#mc-linha"), { y: lerp(0, -150, ease(m)) - 200 * cta, s: lerp(1, 0.74, ease(m)), o: (1 - 0.35 * ease(m)) * (1 - cta) });
  pos($("#mc-simbolo"), { y: lerp(0, -330, cta), s: (m > 0 ? lerp(0.3, 1, volta(m)) : 0.3) * lerp(1, 0.44, cta), r: lerp(-140, 0, saiX(m)), o: m > 0 ? Math.min(1, m * 3) : 0, b: (1 - saiX(m)) * 14 });
  const nm = ease(fase(t, T.renderiza + 0.1, T.renderiza + 0.62));
  $("#mc-nome").style.clipPath = `inset(-30% ${(100 - 100 * nm).toFixed(2)}% -30% 0)`;
  pos($("#mc-nome"), { y: lerp(0, -462, cta) + (1 - nm) * 20, s: lerp(1, 0.5, cta) });
  for (const w of subPal) { const x = fase(t, w.ini - 0.05, w.ini + 0.22); pos(w.el, { y: (1 - sai(x)) * 18, o: x > 0 ? Math.min(1, x * 3) : 0 }); }
  pos($("#mc-sub"), { y: lerp(0, -560, cta), s: lerp(1, 0.78, cta), o: 1 - fase(t, S.cta + 0.3, S.cta + 0.7) });
  const est = saiX(fase(t, T.renderiza - 0.05, T.renderiza + 1));
  $("#mc-poli").setAttribute("transform", `translate(540 960) rotate(${(5 * (t - T.renderiza)).toFixed(2)}) scale(${lerp(0.3, 1, est).toFixed(3)}) translate(-540 -960)`);
  $("#mc-estrela").style.transform = `translateY(${lerp(0, -330, cta).toFixed(1)}px)`; $("#mc-estrela").style.opacity = est.toFixed(3);
  const b = fase(t, S.cta + 0.04, S.cta + 0.4), pb = pulso(t, T.previa, 0.32);
  pos($("#cta-botao"), { y: (1 - sai(b)) * 40, s: (b > 0 ? lerp(0.5, 1, volta(b)) : 0.5) * (1 + 0.05 * pb + 0.015 * Math.sin(t * 3.2) * fase(t, DUR - 2, DUR - 1)), o: b > 0 ? Math.min(1, b * 3) : 0 });
  $("#cta-previa").style.transform = `scale(${(1 + 0.14 * pb).toFixed(3)})`;
  const lz = ((t - T.previa) % 2.4) / 0.7; $("#cta-luz").style.transform = `translateX(${(t > T.previa && lz < 1 ? lerp(-200, 900, lz) : -300).toFixed(0)}px) skewX(-18deg)`;
  for (const w of ctaPal) { const x = fase(t, w.ini - 0.05, w.ini + 0.22); pos(w.el, { y: (1 - sai(x)) * 20, o: x > 0 ? Math.min(1, x * 3) : 0 }); }
  $("#cta-nota").style.opacity = fase(t, S.cta + 1.3, S.cta + 1.8).toFixed(3);
  $("#c-fim").style.opacity = fase(t, S.marca - 0.3, S.marca).toFixed(3);
}

window.quadro = t => {
  palco.style.transform = "none";
  const loja = t < S.moura || em(t, T.segunda - 0.1, S.noite), esc = em(t, S.moura, S.pista1), quad = em(t, S.pista1, S.oculos);
  const rua = em(t, S.oculos, S.relatorio) || em(t, S.vitrine, S.solucao) , mesa = em(t, S.relatorio, S.vitrine), noite = em(t, S.noite, S.marca);
  const fim = t >= S.marca - 0.3;
  vis($("#c-loja"), loja); if (loja) qLoja(t);
  vis($("#c-esc"), esc); if (esc) qEsc(t);
  vis($("#c-quadro"), quad); if (quad) qQuadro(t);
  vis($("#c-rua"), rua); if (rua) qRua(t);
  vis($("#c-mesa"), mesa); if (mesa) qMesa(t);
  vis($("#c-noite"), noite); if (noite) qNoite(t);
  $("#pasta").style.display = noite ? "" : "none";
  // fundo do site da Dona Lúcia: a cor da marca dela
  palco.style.background = em(t, S.solucao, T.segunda - 0.1) ? "radial-gradient(64% 40% at 50% 54%,#2f6f73 0%,#1f3b3e 48%,#141c1e 100%)" : "#161c1f";
  // filme policial: persiana e chuva no escritório; a rua escurece quando o celular está na frente
  const noir = esc ? 1 : noite ? 0.7 : quad ? 0.3 : 0;
  $("#noir").style.opacity = noir;
  $("#escuro").style.opacity = em(t, S.outra, S.relatorio) ? 0.55 * fase(t, S.outra - 0.2, S.outra + 0.2) : esc && t >= T.pegou - 0.2 ? 0.5 * fase(t, T.pegou - 0.2, T.pegou + 0.2) : 0;
  qFone(t);
  // a lupa passa por cima da pesquisa
  const lp = em(t, T.pegou + 0.2, S.pista1 - 0.1) ? fase(t, T.pegou + 0.2, T.pegou + 0.5) * (1 - fase(t, S.pista1 - 0.3, S.pista1 - 0.1)) : 0;
  pos($("#lupa"), { x: lerp(330, 470, fase(t, T.pegou + 0.3, T.pesquisou + 0.4)), y: 540 + 10 * Math.sin(t * 3), r: -8, o: lp });
  // a bolinha de capim: na ótica vazia e na pesquisa sem resultado
  let rl = null;
  if (em(t, T.sem - 0.1, T.sem + 2.0)) rl = { a: fase(t, T.sem - 0.1, T.sem + 2.0), y: 1590, s: 1.1 };
  else if (em(t, T.vazio - 0.1, T.reaberto + 0.3)) rl = { a: fase(t, T.vazio - 0.1, T.reaberto + 0.3), y: 1010, s: 0.7 };
  if (rl) pos($("#rolo"), { x: lerp(1180, -320, rl.a), y: rl.y - Math.abs(Math.sin(rl.a * 9)) * 60, r: -rl.a * 900, s: rl.s, o: 1 });
  else pos($("#rolo"), { o: 0 });
  // "Achei vocês na internet."
  const ba = entra(t, T.achei - 0.05), bo = em(t, T.achei - 0.1, S.noite) ? 1 - fase(t, S.noite - 0.2, S.noite) : 0;
  pos($("#b-achei"), { x: xd($("#b-achei"), 745), y: 850 + ba.y, s: ba.s, o: ba.o * bo });
  vis($("#c-fim"), fim); if (fim) qFim(t);
  for (const p of POEIRA) {
    const y = ((p.y - t * p.v) % 2100 + 2100) % 2100 - 90, x = p.x + Math.sin(t * 0.35 + p.f) * 34, tw = 0.45 + 0.55 * Math.abs(Math.sin(t * 0.7 + p.f));
    p.el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${p.s.toFixed(2)})`;
    p.el.style.background = `radial-gradient(closest-side,rgba(236,150,112,${(0.5 * tw * (esc || noite ? 0.3 : 1)).toFixed(3)}),rgba(236,150,112,0))`;
  }
  // legendas
  for (const p of pedacos) {
    if (!p.el) continue;
    const v = t >= p.de && t < p.ate;
    p.el.style.display = v ? "" : "none";
    if (!v) continue;
    const fora = fase(t, p.ate - 0.08, p.ate);
    p.ws.forEach((w, k) => {
      const x = p.de < 0 ? 1 : fase(t, w.ini - 0.05, w.ini + 0.2);
      pos(p.wel[k], { y: (1 - sai(x)) * 22 - 14 * fora, s: x > 0 ? lerp(0.86, 1, volta(x)) : 0.86, o: (x > 0 ? Math.min(1, x * 3) : 0) * (1 - fora) });
    });
  }
  // tranco em cada impacto: soco de zoom, tremor e clarão
  let soco = 0, tremor = 0, flash = 0;
  for (const f of frases) if (f.impacto) {
    const x = fase(t, f.ini - 0.03, f.ini + 0.38); if (x > 0 && x < 1) { soco = Math.max(soco, 1 - sai(x)); tremor = Math.max(tremor, x < 0.35 ? 1 - x / 0.35 : 0); }
    const y = fase(t, f.ini - 0.03, f.ini + 0.2); if (y > 0 && y < 1) flash = Math.max(flash, 0.34 * (1 - y));
  }
  palco.style.transform = soco > 0 ? `translate(${(tremor * 9 * Math.sin(t * 97)).toFixed(1)}px,${(tremor * 7 * Math.cos(t * 83)).toFixed(1)}px) scale(${(1 + 0.045 * soco).toFixed(4)})` : "";
  $("#flash").style.opacity = flash.toFixed(3);
};

// cenas da trilha (ferramentas/video/trilha-pulso.py só conhece estas partes): o pulso diz qual é qual.
// A investigação é o groove ("insta"); a virada corta a batida ("nada"); o relatório fica só com o coração ("meio");
// a vitrine sobe até o drop, que cai em "A Dona Lúcia fez um site."; a noite do detetive fica só com os impactos ("fim").
const TRILHA = { sumiu: "abre", culpa: "abre", moura: "google", busca: "google", pista1: "insta", direct: "insta", fone: "insta", mapa: "insta",
  oculos: "volta", outra: "volta", relatorio: "meio", vitrine: "ese", solucao: "site", noite: "fim", marca: "fim", cta: "cta" };
window.preparar = () => {
  window.quadro(0);
  return {
    duracao: DUR, narracao: NOME, bpm: 112, tom: 0,
    pulso: frases.map(f => ({ id: f.id, cena: TRILHA[f.cena], ini: f.ini, fim: f.fim, pausa: f.pausa || 0, impacto: !!f.impacto })),
    ensaio: [0.3, T.sumiram + 0.5, T.sem + 0.9, T.crise + 0.4, T.calor + 0.5, T.detetive + 0.4, T.moura + 0.5, T.solucao + 0.4, T.pesquisou + 0.7,
      T.insta + 0.3, T.n2022 + 0.3, T.direct + 0.2, T.visto + 0.3, T.existeW + 0.3, T.fechadoW + 0.3, S.oculos - 0.05, T.oculosW + 0.3, T.esquinaW + 0.7,
      T.enderecoS + 0.2, T.sequestrou + 1.2, FIM("acharam") + 0.3, T.melhor + 0.6, T.enxergava + 0.3, T.siteW + 0.6, T.entrou + 0.6, T.achei + 0.6,
      T.nome + 0.3, T.vazio + 0.2, T.reaberto + 0.6, T.investigar + 0.4, T.renderiza + 1.2, T.previa + 1.2].map(x => +x.toFixed(2)),
  };
};

await Promise.all(["800 76px Geist", "700 30px Geist", "600 30px Geist", "italic 600 30px Fraunces", "30px 'Special Elite'"].map(f => document.fonts.load(f).catch(() => {})));
await document.fonts.ready;
window.quadro(0);
window.pronto = true;
</script>
