<!doctype html>

<title>Reels narrado: a casa abandonada</title>
<!-- Reels do Instagram (1080 × 1920, 30 quadros/s) com voz. Semana de 04 a 08/11/2026, Reels 5 (domingo, 19h).
     Alvo: o dono de espaço de eventos com site antigo.
     Objetivo: perceber que, para quem chega pelo celular, o site é a primeira visita, e que site parado parece lugar
     fechado; com um site novo, feito para o celular, com fotos de agora, pacotes e WhatsApp, a noiva chama.
     A história: abre como terror. A Ana e o Léo entram numa casa abandonada à meia-noite: música tocando sozinha, uma
     placa de "visitante 312", quadros vazios, uma porta "em construção desde 2013", um livro de visitas parado em 2014
     e um telefone fixo que ninguém atende. A virada: a casa era o site antigo do Espaço Jardim Aurora, que naquela
     mesma noite estava no meio de um casamento. A Dona Célia troca o site, e a noiva seguinte chama no WhatsApp.
     A Ana, o Léo, a Dona Célia e o Espaço Jardim Aurora são fictícios, e as telas levam o selo "exemplo".
     O tempo de tudo sai da narração: narracao/reels-casa.json → python3 instagram/narrar.py reels-casa → esta página
     lê reels-casa.tempos.json. As peças comuns estão em historia.mjs e historia.css.
     Sem animação de CSS: window.quadro(t) desenha o instante t (s). -->

  // ao ir embora, as janelas apagam
  $$(".luzj").forEach((j, i) => { const base = [0.3, 0, 0, 0.22, 0.35][i]; attr(j, "opacity", (t >= T.nunca + i * 0.12 ? 0 : base * (0.8 + 0.2 * Math.sin(t * 9 + i))).toFixed(3)); });
  attr($("#nuvem"), "transform", `translate(${(-40 + 14 * t).toFixed(1)} 0)`);
  attr($("#neblina"), "transform", `translate(${(30 * Math.sin(t * 0.4)).toFixed(1)} 0)`);

// o celular: [t, centro x, centro y, escala, giro, opacidade]
const PF = [
  [0, 540, 1000, 1, 0, 0], [T.encolhe, 540, 1000, 1, 0, 0], [T.troca - 0.2, 540, 1000, 1, 0, 1], [T.naquela - 0.15, 540, 1000, 1, 0, 1], [T.naquela + 0.15, 540, 1300, 0.85, 0, 0],
  [T.so - 0.4, 1350, 1300, 0.6, 14, 0], [T.so, 790, 1380, 0.62, 8, 1], [S.licao - 0.25, 790, 1380, 0.62, 8, 1], [S.licao + 0.05, 900, 1600, 0.5, 14, 0],
  [S.site - 0.3, 700, 1500, 0.6, 8, 0], [S.site + 0.15, 660, 1010, 0.96, 2, 1], [T.contador - 0.3, 660, 1010, 0.96, 2, 1], [T.contador, 700, 1500, 0.6, 8, 0],

function qFone(t) {
  const [cx, cy, s, r, o] = pose(PF, t);
  pos(FA, { x: cx - 220, y: cy - 450, s, r, o });
  if (o <= 0.002) return;

  const virando = t < T.troca;
  let tela = "s-velho", hora = "00:03";
  if (t >= S.site) { tela = t >= T.trocou + 0.1 ? "s-novo" : "s-velho"; hora = "10:20"; }
  if (t >= S.fecho) { tela = t >= T.tapZap + 0.15 ? "s-zap" : "s-novo"; hora = t >= T.tapZap + 0.15 ? "00:01" : "00:00"; }
  mostra(tela);
  if (tela === "s-novo" && t < T.trocou + 0.55) $("#s-velho").style.display = "block"; // o site novo cobre o antigo, de cima para baixo
  const st = $(".status", FA); st.querySelector(".hora").textContent = hora; st.classList.toggle("escura", tela === "s-velho" || virando);
  $("#dedo").style.opacity = 0;
  if (tela === "s-velho") {
    const ab = em(t, S.festa, S.licao) ? 0 : pulso(t, T.espaco - 0.1, 1.0);
    $("#vh-nome").style.textShadow = ab > 0.02 ? `0 0 ${(18 * ab).toFixed(0)}px #f2c25a` : "";
    $("#s-velho").style.filter = t >= S.festa && t < S.site ? "sepia(.5) brightness(.85)" : "";
  }
  if (tela === "s-novo") {
    const ent = t >= S.fecho ? 1 : fase(t, T.trocou + 0.1, T.trocou + 0.5);
    $("#s-novo").style.clipPath = `inset(0 0 ${((1 - ease(ent)) * 100).toFixed(1)}% 0)`;
    const fe = t >= S.fecho;
    const hero = fe ? pulso(t, T.pista2 - 0.1, 1) : pulso(t, T.fotos - 0.1, 1.2);
    $("#nv-hero").style.boxShadow = hero > 0.01 ? `0 0 0 ${(6 * hero).toFixed(1)}px #e8855e` : "";
    $("#nv-hero").style.transform = `scale(${(1 + 0.04 * hero).toFixed(3)})`;
    [0, 1].forEach(k => { const a = fe ? 0 : pulso(t, T.pacotes - 0.1 + k * 0.12, 0.8); $(`#pc${k}`).style.boxShadow = a > 0.01 ? `0 0 0 ${(5 * a).toFixed(1)}px #e8855e` : ""; });
    $$(".inc").forEach(i => { const j = +i.dataset.j, a = fe ? 0 : pulso(t, T.incluso - 0.05 + j * 0.1, 0.6); i.style.color = a > 0.05 ? "#2f8f5b" : ""; });
    const z = fe ? pulso(t, T.tapZap - 0.05, 0.4) : pulso(t, T.whats - 0.05, 0.9);
    $("#nv-zap").style.transform = `scale(${(1 + 0.06 * z).toFixed(3)})`;
    toque(t, fe ? T.tapZap : T.toque, $("#nv-zap"));
  }
  if (tela === "s-zap") { const a = entra(t, T.chamou + 0.05, 0.3); pos($("#zp1"), { y: a.y * 0.6, s: lerp(0.85, 1, a.x > 0 ? volta(a.x) : 0), o: a.o }); }
}
function qCena(t) {
  const casal = em(t, T.encolhe, T.naquela), celia = em(t, S.site, S.fecho), noiva = em(t, S.fecho, T.contador - 0.1), festaV = em(t, T.naquela, S.licao);
  const sala = casal || celia || noiva;
  vis($("#c-cena"), sala || festaV);
  attr($("#g-sala"), "opacity", sala ? (casal ? fase(t, T.encolhe + 0.3, T.troca - 0.1) : 1).toFixed(3) : 0);
  attr($("#g-festa"), "opacity", festaV ? 1 : 0);
  if (sala) {
    const dia = celia;
    attr($("#ceu"), "fill", dia ? "#9cc6e0" : "#22344d"); attr($("#lua2"), "fill", dia ? "#9cc6e0" : "#22344d"); attr($("#lua"), "opacity", dia ? 0 : 1); attr($("#sol"), "opacity", dia ? 1 : 0);
    attr($("#parede"), "fill", dia ? "#3a4a58" : "url(#g-noite)"); attr($("#chao"), "fill", dia ? "#2a3440" : "#0b0f15");
    attr($("#janela"), "opacity", casal ? 0 : 1);
    for (const id of ["an", "le", "ce", "no"]) attr($(`#${id}-pos`), "opacity", (id === "an" || id === "le") ? (casal ? 1 : 0) : id === "ce" ? (celia ? 1 : 0) : (noiva ? 1 : 0));
    if (casal) {
      // a Ana e o Léo, no sofá da sala, com medo de um site
      attr($("#an-pos"), "transform", `translate(170 1720) scale(1.6)`); attr($("#le-pos"), "transform", `translate(905 1720) scale(1.6)`);
      pernas("an", t, false); pernas("le", t, false);
      const susto = t < T.siteN + 0.4;
      boca("an", susto ? "oh" : "reta"); boca("le", susto ? "oh" : "reta");
      attr($("#ansob"), "transform", "translate(0 -8)"); attr($("#lesob"), "transform", "translate(0 -8)");
      fecha("an", (t % 2.6) < 0.1 ? 1 : 0); fecha("le", (t % 3.1) < 0.1 ? 1 : 0);
      attr($("#brilho"), "opacity", 0);
    } else {
      const quem = celia ? "ce" : "no";
      attr($(`#${quem}-pos`), "transform", `translate(290 1700) scale(${ESC})`); pernas(quem, t, false);
      attr($("#brilho"), "transform", `translate(${290 + 26 * ESC} ${1700 - 214 * ESC})`); attr($("#brilho"), "opacity", celia ? 0 : (0.8 + 0.2 * Math.sin(t * 5)).toFixed(3));
      boca(quem, "sorriso"); fecha(quem, (t % 2.9) < 0.12 ? 1 : 0); attr($(`#${quem}sob`), "transform", "");
    }
  }
  if (festaV) {

    PISTA.forEach((d, k) => { danca(`p${k}`, t, k >= 9 ? 0.75 : 1, k * 0.9, cheia ? 2.2 : 1); boca(`p${k}`, "sorriso"); fecha(`p${k}`, ((t + k * 0.7) % 3.3) < 0.12 ? 1 : 0); });
    $$(".lamp").forEach((l, k) => attr(l, "opacity", (0.75 + 0.25 * Math.sin(t * 6.3 + k)).toFixed(3)));
    attr($("#pista"), "transform", `translate(540 1500) scale(${(1 + 0.012 * Math.max(0, Math.sin(t * Math.PI * 2 * 2))).toFixed(4)}) translate(-540 -1500)`);
  }
}
function qExtra(t) {
  // meia-noite
  {
    const a = entra(t, T.meia2 - 0.1), o = em(t, T.meia2 - 0.15, T.contador - 0.3) ? a.o * (1 - fase(t, T.chamou - 0.3, T.chamou)) : 0;
    pos($("#relogio"), { s: a.s, o });
  }
  // quase todo sábado
  {
    const on = em(t, T.festa - 0.2, T.so - 0.1), sb = $("#sabados"), a = entra(t, T.festa - 0.2, 0.3);
    pos(sb, { y: a.y, s: a.s, o: on ? a.o * (1 - fase(t, T.so - 0.4, T.so - 0.1)) : 0 });
    $$("#sabados span").forEach((el, k) => { const b = entra(t, T.festa + k * 0.18, 0.25); pos(el, { s: b.s, o: b.o }); });
  }
  // a primeira visita é o site; se parece abandonado, ninguém marca a segunda
  {
    const on = em(t, S.licao, S.site), sai_ = fase(t, S.site - 0.3, S.site);
    const a1 = entra(t, T.primeira - 0.1, 0.32), poeira = fase(t, T.parece, T.parece + 0.5);
    pos($("#e1"), { x: 190, y: 760 + a1.y, s: a1.s, o: on ? a1.o * (1 - sai_) : 0 });
    $("#e1").style.filter = poeira > 0 ? `sepia(${(0.7 * poeira).toFixed(2)}) brightness(${(1 - 0.35 * poeira).toFixed(3)})` : "";
    pos($("#teia"), { x: 190 + 700 - 140, y: 760 - 20, s: lerp(0.4, 1, sai(poeira)), o: on ? poeira * (1 - sai_) : 0 });
    pos($("#seta"), { y: 760 + 150 + 12, o: on ? fase(t, T.ninguem2 - 0.3, T.ninguem2) * (1 - sai_) : 0 });
    const a2 = entra(t, T.ninguem2 - 0.1, 0.32);
    pos($("#e2"), { x: 190, y: 980 + a2.y, s: a2.s, o: on ? a2.o * 0.55 * (1 - sai_) : 0 });
    $("#e2").style.outline = "6px dashed #8c9598"; $("#e2").style.background = "#d8d2c8";
    const x = entra(t, T.segunda - 0.05, 0.3);
    pos($("#xis"), { x: 190 + 700 - 30, y: 980 + 30, s: x.s, o: on ? x.o * (1 - sai_) : 0 });

  // o site novo conta quem viu e quem chamou
  {
    const on = em(t, T.novo - 0.3, S.marca), p = $("#painel"), a = entra(t, T.novo - 0.3, 0.35);
    pos(p, { y: a.y, s: a.s, o: on ? a.o * (1 - fase(t, S.marca - 0.35, S.marca)) : 0 });
    const n1 = Math.round(1284 * ease(fase(t, T.viu2 - 0.2, T.viu2 + 0.6))), n2 = Math.round(41 * ease(fase(t, T.chamou2 - 0.2, T.chamou2 + 0.5)));

function qBaloes(t) {

  pos(B_RING, { x: 540 - B_RING.offsetWidth / 2, y: 750 + a.y, s: a.s, o });
}

window.quadro = t => {
  palco.style.transform = "none";
  const quente = em(t, S.site, S.fecho);
  palco.style.background = quente ? "radial-gradient(64% 40% at 50% 54%,#b8743a 0%,#5a3518 50%,#141c1e 100%)" : "radial-gradient(70% 45% at 50% 52%,#26333a 0%,#161c1f 70%)";
  qCena(t); qCasa(t); qFone(t); qExtra(t); qBaloes(t);
  R.comum(t);
};
const SONS = [{ t: T.musica, tipo: "caixinha", ganho: 0.5 }, { t: T.ligou + 0.05, tipo: "campainha", ganho: 0.45 },
  { t: T.toque, tipo: "toque", ganho: 0.8 }, { t: T.tapZap, tipo: "toque", ganho: 0.8 }, { t: T.chamou + 0.05, tipo: "ding", ganho: 0.7 }];
window.preparar = () => R.preparar([0.5, T.abandonada + 0.3, T.musica + 0.6, T.sozinha + 0.4, T.visitante + 0.2, T.doze + 0.4, T.vazios + 0.2, T.construcao + 0.3, T.treze + 0.2,
  T.livro + 0.4, T.marco + 0.4, T.fixo + 0.2, T.ligou + 0.4, T.atendeu + 0.3, T.foram + 0.4, T.nunca + 0.6, T.era - 0.3, T.era + 0.1, T.siteN + 0.2, T.espaco + 0.3,
  T.casamento + 0.3, T.pista + 0.3, T.sabado + 0.2, T.parado + 0.3, T.primeira + 0.3, T.parece + 0.5, T.segunda + 0.3, T.trocou + 0.4, T.fotos + 0.3, T.pacotes + 0.3,
  T.incluso + 0.3, T.toque + 0.1, T.noiva + 0.3, T.meia2 + 0.3, T.pista2 + 0.3, T.chamou + 0.4, T.trezentos2 + 0.3, T.viu2 + 0.6, T.chamou2 + 0.5,
  F.moral.ini + 1.2, F.marca.ini + 1.3, F.cta.ini + 1.6], SONS);
