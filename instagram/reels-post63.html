<!-- Reels do Instagram (1080 × 1920, 30 quadros/s) com voz. Semana de 04 a 08/11/2026, Reels 4 (sábado, 19h).
     Alvo: a fotógrafa que usa o feed do Instagram como portfólio e faz vários tipos de ensaio.
     Objetivo: perceber que a cliente que procura um ensaio específico desiste antes de achar no feed misturado,
     e que um site com o portfólio separado por ensaio mostra o que ela procura logo de cara.
     A história: abre como suspense. Quem fala está "aqui embaixo" há dois anos: é o bebê do post 63, o melhor
     newborn da Marina, soterrado por bolo, Natal, sorteio e dancinhas. A Júlia, grávida, procura newborn no perfil,
     para no Reels da dança e desiste onze fileiras acima. A Marina faz um site com o portfólio por ensaio, o bebê vira
     a primeira foto do newborn, e na segunda gravidez a Júlia chama a Marina em três segundos. No fim, quem afunda até o
     post 63 é o Reels da dança. Tudo é fictício, e as telas levam o selo "exemplo". O tempo de tudo sai da narração:
     narracao/reels-post63.json → python3 instagram/narrar.py reels-post63 → esta página lê reels-post63.tempos.json.
     As peças comuns (contas, gente, legendas, marca, convite e trilha) estão em historia.mjs e historia.css.
     Sem animação de CSS: window.quadro(t) desenha o instante t (s). -->

// a dançarina (a Marina, de cabelo longo); com câmera ou não. Os ids deixam animar os braços
function dancarina(p, camera) {
  const o = { id: p, cabelo: "longo", corCabelo: "#3b2418", brinco: "#e0b04a" };
  const cam = camera ? `<g transform="translate(60 -140)"><rect x="-28" y="-4" width="56" height="36" rx="7" fill="#1e2528"/><rect x="-14" y="-12" width="18" height="10" rx="3" fill="#1e2528"/><circle cx="2" cy="14" r="12" fill="#3b4447" stroke="#8c9598" stroke-width="3"/></g>` : "";
  return `<g id="${p}"><ellipse cx="0" cy="4" rx="62" ry="10" fill="#000" opacity=".3"/>
    <g id="${p}l1"><rect x="-29" y="-150" width="26" height="146" rx="11" fill="#2b2f3a"/><ellipse cx="-18" cy="-4" rx="21" ry="9" fill="#141819"/></g>

// a pose da dança: a = 0 parada, 1 dançando
function danca(p, t, a, fase0 = 0) {
  const w = t * 7.5 + fase0, s = Math.sin(w);
  attr($(`#${p}a1`), "transform", `rotate(${lerp(14, 112 + 46 * s, a).toFixed(1)} -46 -272)`);

  attr($(`#${p}l1`), "transform", `rotate(${(10 * s * a).toFixed(1)} -16 -150)`);
  attr($(`#${p}l2`), "transform", `rotate(${(-10 * s * a).toFixed(1)} 16 -150)`);
