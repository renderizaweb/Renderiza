<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Reels narrado: o homem que sabia todos os horários</title>
<!-- Reels do Instagram (1080 × 1920, 30 quadros/s) com voz. Versão 2 (27/10/2026): por 28 anos a Rua das Acácias
     funcionou no horário que o Seu Valdir dizia, e ele nunca errou, porque inventou todos (em 1997 ele chutou "oito"
     e a farmácia passou a abrir às oito). Quando ele viaja, ninguém sabe o próprio horário; cada loja põe o seu num
     site, e na volta ele erra pela primeira vez. A Renderiza só aparece no fim. Tudo é fictício e as telas das lojas
     levam o selo "exemplo".
     O tempo de tudo sai da narração: narracao/reels-valdir.json → python3 instagram/narrar.py reels-valdir → esta
     página lê reels-valdir.tempos.json. A rua é um desenho só (#mundo), e a câmera anda por ele; 1997 aparece em tom
     de foto antiga, e as cenas do Zé, à noite. Sem animação de CSS: window.quadro(t) desenha o instante t (s). -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&display=block" rel="stylesheet">
<link rel="stylesheet" href="marca.css">
<style>

#antigo{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:0;background:radial-gradient(ellipse 75% 60% at 50% 50%,rgba(0,0,0,0) 45%,rgba(40,22,8,.62) 100%)}
#antigo::after{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,rgba(255,240,210,.035) 0 2px,rgba(0,0,0,0) 2px 5px);mix-blend-mode:screen}
#carimbo{position:absolute;right:70px;bottom:250px;z-index:46;font:700 54px/1 "Geist",monospace;letter-spacing:.06em;color:#ff9a3d;text-shadow:0 0 14px rgba(255,140,40,.65);opacity:0;font-variant-numeric:tabular-nums}
.cena{position:absolute;inset:0;z-index:10;display:none}
.sombra-topo{position:absolute;left:0;right:0;top:0;height:640px;z-index:44;pointer-events:none;background:linear-gradient(180deg,rgba(10,13,14,.78) 0,rgba(10,13,14,.5) 300px,rgba(10,13,14,0) 640px)}
.vinheta{position:absolute;inset:0;z-index:40;pointer-events:none;background:radial-gradient(ellipse 80% 62% at 50% 52%,transparent 50%,rgba(0,0,0,.5) 100%)}

/* balões */

/* placa da farmácia */
#placa{position:absolute;left:0;top:0;z-index:22;width:400px;padding:26px 24px 30px;border-radius:22px;background:#f1eee9;color:#1e2528;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.5);opacity:0}
#placa small{display:block;font-size:36px;font-weight:800;letter-spacing:.12em;color:#5b6467}

/* TV de 1997 e a casa do Zé */

/* cartão-postal */
#postal{position:absolute;left:210px;top:560px;width:660px;height:440px;z-index:23;border-radius:16px;background:#fbf7f0;padding:18px;box-shadow:0 40px 90px rgba(0,0,0,.55);opacity:0}

/* os sites */
.fone{position:absolute;left:0;top:0;width:440px;height:900px;z-index:12;border-radius:74px;padding:14px;background:linear-gradient(150deg,#4a5357 0%,#1a1f21 30%,#0b0e0f 100%);box-shadow:0 80px 140px -40px rgba(0,0,0,.8),0 30px 60px -20px rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,255,255,.09),inset 0 0 0 6px #070909;transform-origin:50% 50%;opacity:0}
.fone::before{content:"";position:absolute;left:50%;top:29px;width:116px;height:34px;margin-left:-58px;border-radius:20px;background:#040505;z-index:20}
.fone>.exemplo{left:40px;top:-14px;z-index:25}
.exemplo.claro{background:rgba(241,238,233,.94);color:#1e2528}

.ms-topo i::after{content:"";position:absolute;left:0;right:0;top:4.5px;border-top:3px solid currentColor}
.ms-hero{position:relative;height:300px;margin:0 16px;border-radius:30px;overflow:hidden;background:var(--c);color:#fff}
.ms-hero svg.des{position:absolute;right:-10px;bottom:-12px;width:230px;height:230px;opacity:.95}
.ms-hero h3{position:absolute;left:26px;top:26px;right:110px;font-size:42px;font-weight:800;letter-spacing:-.035em;line-height:1.02}
.ms-aberto{display:inline-flex;align-items:center;gap:10px;margin:20px 22px 6px;padding:10px 18px;border-radius:99px;background:#e3f3e8;color:#1d6b3c;font-size:23px;font-weight:700}
.ms-aberto::before{content:"";width:12px;height:12px;border-radius:50%;background:#22a355}
.ms-linha{display:flex;align-items:center;gap:16px;margin:8px 16px 0;padding:14px 14px;border-radius:22px}
.ms-linha .ic{width:56px;height:56px;border-radius:18px;background:#efe9e1;display:grid;place-items:center;flex:none;color:#1e2528}
.ms-linha .ic svg{width:30px;height:30px}
.ms-linha small{display:block;font-size:20px;font-weight:600;color:#7a8386}

.ms-zap{position:absolute;left:18px;right:18px;bottom:30px;height:84px;border-radius:26px;background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;gap:14px;font-size:29px;font-weight:800}
.ms-zap svg{width:36px;height:36px}

/* marca e convite */
#mc-estrela{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:visible}
#mc-simbolo{position:absolute;left:540px;top:960px;width:250px;height:250px;margin:-125px 0 0 -125px;color:#f1eee9}
#mc-simbolo .simbolo{width:100%;height:100%}
#mc-nome{position:absolute;left:50%;translate:-50% 0;width:max-content;top:1120px;text-align:center;font-weight:600;font-size:150px;letter-spacing:-.055em;color:#f1eee9;line-height:1.05}
#mc-sub{position:absolute;left:90px;right:90px;top:1310px;text-align:center;font-weight:700;font-size:56px;letter-spacing:-.03em;color:#e6e1da;line-height:1.1;text-wrap:balance}
#mc-sub .w,#mc-linha .w{display:inline-block;opacity:0}
#mc-linha{position:absolute;left:80px;right:80px;top:560px;text-align:center;font-weight:800;font-size:84px;letter-spacing:-.045em;line-height:1.08;color:#f6f3ee;text-wrap:balance}
#mc-linha .tom{color:var(--terracota-clara)}
#cta-botao{position:absolute;left:540px;top:1060px;translate:-50% 0;display:inline-flex;align-items:center;gap:24px;height:158px;padding:0 64px;border-radius:79px;background:var(--terracota);color:#fff;font-size:68px;font-weight:800;letter-spacing:-.025em;white-space:nowrap;box-shadow:0 24px 70px rgba(178,81,52,.55);overflow:hidden;opacity:0}
#cta-botao svg{width:62px;height:62px}
#cta-botao em{font-style:normal;display:inline-block;transform-origin:0 60%}
#cta-luz{position:absolute;top:-20px;bottom:-20px;left:0;width:120px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:translateX(-300px) skewX(-18deg)}
#cta-texto{position:absolute;left:110px;right:110px;top:1262px;text-align:center;font-size:50px;font-weight:500;color:#e6e1da;line-height:1.2;letter-spacing:-.02em;text-wrap:balance}
#cta-texto .w{display:inline-block;opacity:0}
#cta-nota{position:absolute;left:0;right:0;top:1450px;text-align:center;font-size:27px;font-weight:500;color:#8c9598;opacity:0}
</style></head><body>

<script type="module">
import { MARCAS } from "../site/marcas.mjs";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const NOME = "reels-valdir";
const { duracao: VOZ, frases } = await (await fetch(`narracao/${NOME}.tempos.json`)).json();
const DUR = Math.round((VOZ + 1.67) * 10) / 10; // a voz acaba e o convite fica mais 1,5 s na tela
const F = Object.fromEntries(frases.map(f => [f.id, f]));
const palco = $("#palco");

// ---------- contas ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const fase = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const sai = x => 1 - Math.pow(1 - x, 3);
const saiX = x => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const volta = x => (x <= 0 ? 0 : 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2)); // passa do ponto e volta
const lerp = (a, b, x) => a + (b - a) * x;
const pulso = (t, t0, d = 0.5) => { const x = fase(t, t0, t0 + d); return x > 0 && x < 1 ? Math.sin(Math.PI * x) : 0; };
const h = (i, k = 0) => { const s = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return s - Math.floor(s); };
function pos(el, { x = 0, y = 0, s = 1, r = 0, o = 1, b = 0 } = {}) {
  el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${r.toFixed(2)}deg) scale(${s.toFixed(4)})`;
  el.style.opacity = o.toFixed(3);
  el.style.filter = b > 0.15 ? `blur(${b.toFixed(1)}px)` : "";
  el.style.visibility = o <= 0.002 ? "hidden" : "";
}
const attr = (el, k, v) => el.setAttribute(k, v);
// entra: aparece com um pulinho a partir do instante t0
const entra = (t, t0, d = 0.32) => { const x = fase(t, t0 - 0.04, t0 + d); return { x, s: x > 0 ? lerp(0.6, 1, volta(x)) : 0.6, o: x > 0 ? Math.min(1, x * 3) : 0, y: (1 - sai(x)) * 30 }; };
const limpa = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9-]/g, "");
function W(id, pal, n = 0) {
  const ps = F[id].palavras, alvo = limpa(pal);
  const xs = ps.filter(p => limpa(p.p) === alvo).length ? ps.filter(p => limpa(p.p) === alvo) : ps.filter(p => limpa(p.p).startsWith(alvo));
  if (!xs[n]) throw new Error(`sem a palavra "${pal}" na frase ${id}`);
  return xs[n].ini;
}

// ---------- cenas: cada uma começa na primeira frase dela ----------
const ORDEM = ["abre", "perguntas", "segredo", "chute", "fila", "ze", "relogio", "viagem", "manha", "ninguem", "sites", "novela", "volta", "corrige", "marca", "cta"];
const S = {};
ORDEM.forEach((c, i) => { S[c] = i === 0 ? 0 : frases.find(f => f.cena === c).ini; });
const I = id => F[id].ini;
const T = {
  homem: W("abre", "homem"), q1: I("q1"), r1: I("r1"), q2: I("q2"), r2: I("r2"), q3: I("q3"), r3: I("r3"),
  nunca: I("nunca"), errou: W("nunca", "errou"), um: W("nunca", "um"), segredo: I("segredo"), todos: I("todos"),
  alguem97: W("chute", "alguem"), sabia: W("chutou", "sabia"), chutou: W("chutou", "chutou"), oito97: W("chutou", "oito"),
  fila: W("fila", "fila"), abria: I("abria"), dez: W("abria", "10h"), passou: I("passou"), oito8: W("passou", "8h"),
  ze: I("ze"), novela97: W("ze", "novela"), acertava: W("relogio", "acertava"), relogioW: W("relogio", "relogio"),
  ate: W("nada", "ate"), foi: W("nada", "foi"), praia: W("nada", "praia"),
  farmac: W("manha", "farmaceutico"), padeiro: W("manha", "padeiro"), que3: I("mesmo"), mesmo: W("mesmo", "mesmo"),
  ninguem: I("ninguem"), fazia: I("fazia"),
  pela: W("sites", "pela"), loja: W("sites", "loja"), horarioS: W("sites", "horario"), siteW: W("site", "site"), endereco: W("site", "endereco"), zap: W("site", "whatsapp"),
  fecha: W("novela", "fecha"), tempo: I("tempo"),
  voltou: W("volta", "voltou"), alguem3: W("volta", "alguem"), oito3: W("disse", "oito"),
  era: I("era"), sete: I("sete"), seteW: W("sete", "sete"), ta: I("tano"),
  chuta: W("chuta", "chuta"), renderiza: W("marca", "renderiza"), previa: W("cta", "previa"),
};

// ---------- ícones (Lucide) e marcas ----------
const IC = {
  telefone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>',
  chave: '<path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"/><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/>',
  relogio: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  mapa: '<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
  mensagem: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
  certo: '<path d="M20 6 9 17l-5-5"/>',
};
const ic = (n, extra = "") => `<svg class="i" viewBox="0 0 24 24" ${extra}>${IC[n]}</svg>`;
const ZAP_B = `<svg viewBox="0 0 24 24" fill="#fff"><path d="${MARCAS.whatsapp.d}"/></svg>`;

// ====================== gente ======================
const PELE = "#d79d79", PELE2 = "#c4876a";
// cabeça: olhos (cada um com id, para piscar), sobrancelhas, cabelo ou chapéu, bigode. (cx, cy) = centro da cabeça
function cabeca(o, cx, cy, r) {
  const k = r / 40, id = o.id || "";
  let s = `<g id="${id}cab">`;
  if (o.cabelo === "longo") s += `<rect x="${cx - r * 1.08}" y="${cy - r * 0.9}" width="${r * 2.16}" height="${r * 2.1}" rx="${r}" fill="${o.corCabelo}"/>`;
  s += `<circle cx="${cx - r}" cy="${cy + 2 * k}" r="${8 * k}" fill="${o.pele2 || PELE2}"/><circle cx="${cx + r}" cy="${cy + 2 * k}" r="${8 * k}" fill="${o.pele2 || PELE2}"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${o.pele || PELE}"/>`;
  if (o.boina) {

function partir(ws) {
  const txt = a => a.map(p => p.p).join(" ");
  for (let k = 0; k < ws.length - 1; k++) if (/[.?!]$/.test(ws[k].p)) return [...partir(ws.slice(0, k + 1)), ...partir(ws.slice(k + 1))];
  if (txt(ws).length <= 44) return [ws];
  let melhor = 1, nota = Infinity;
  for (let k = 1; k < ws.length; k++) {
    let n = Math.abs(txt(ws.slice(0, k)).length - txt(ws.slice(k)).length);
    if (/[,:;]$/.test(ws[k - 1].p)) n -= 20; else if (/^(e|com|sem|para|que)$/i.test(ws[k].p)) n -= 6;
    if (n < nota) { nota = n; melhor = k; }
  }
  return [...partir(ws.slice(0, melhor)), ...partir(ws.slice(melhor))];
}

function qSites(t) {
  const P = { pad: $("#fn-pad"), far: $("#fn-far"), cha: $("#fn-cha") };
  const L = [["pad", T.pela - 0.1, 15, -6, 0.76], ["far", T.loja - 0.1, 320, 0, 0.88], ["cha", T.horarioS - 0.15, 625, 6, 0.76]];
  for (const [k, t0, x, r, s] of L) {
    const a = fase(t, t0, t0 + 0.45);
    pos(P[k], { x, y: lerp(1400, k === "far" ? 600 : 650, saiX(a)), s: s * (a > 0 ? lerp(0.85, 1, volta(a)) : 0.85), r, o: Math.min(1, a * 4) });
    P[k].style.zIndex = k === "far" ? 14 : 12;
    $(`#ml-${k}0`).style.background = `rgba(232,133,94,${(0.34 * clamp(fase(t, T.horarioS - 0.1, T.horarioS + 0.3) * (1 - fase(t, T.endereco - 0.3, T.endereco)))).toFixed(3)})`;
    $(`#ml-${k}1`).style.background = `rgba(232,133,94,${(0.34 * pulso(t, T.endereco - 0.1, 0.8)).toFixed(3)})`;
    $(`#mz-${k}`).style.transform = `scale(${(1 + 0.08 * pulso(t, T.zap - 0.05, 0.6)).toFixed(3)})`;
  }
}

function qFim(t) {
  // a frase da moral, palavra por palavra; em "Renderiza", o símbolo, o nome e o resto da frase embaixo
  for (const w of mcPal) { const x = fase(t, w.ini - 0.05, w.ini + 0.22); pos(w.el, { y: (1 - sai(x)) * 22, s: x > 0 ? lerp(0.85, 1, volta(x)) : 0.85, o: x > 0 ? Math.min(1, x * 3) : 0 }); }
  const m = fase(t, T.renderiza - 0.04, T.renderiza + 0.6), cta = ease(fase(t, S.cta - 0.32, S.cta + 0.22));
  pos($("#mc-linha"), { y: lerp(0, -150, ease(m)) - 200 * cta, s: lerp(1, 0.74, ease(m)), o: (1 - 0.35 * ease(m)) * (1 - cta) });
  pos($("#mc-simbolo"), { y: lerp(0, -330, cta), s: (m > 0 ? lerp(0.3, 1, volta(m)) : 0.3) * lerp(1, 0.44, cta), r: lerp(-140, 0, saiX(m)), o: m > 0 ? Math.min(1, m * 3) : 0, b: (1 - saiX(m)) * 14 });
  const nm = ease(fase(t, T.renderiza + 0.1, T.renderiza + 0.62));
  $("#mc-nome").style.clipPath = `inset(-30% ${(100 - 100 * nm).toFixed(2)}% -30% 0)`;
  pos($("#mc-nome"), { y: lerp(0, -462, cta) + (1 - nm) * 20, s: lerp(1, 0.5, cta) });
  for (const w of subPal) { const x = fase(t, w.ini - 0.05, w.ini + 0.22); pos(w.el, { y: (1 - sai(x)) * 18, o: x > 0 ? Math.min(1, x * 3) : 0 }); }
  pos($("#mc-sub"), { y: lerp(0, -560, cta), s: lerp(1, 0.78, cta), o: 1 - fase(t, S.cta + 0.3, S.cta + 0.7) });
  const est = saiX(fase(t, T.renderiza - 0.05, T.renderiza + 1));
  $("#mc-poli").setAttribute("transform", `translate(540 960) rotate(${(5 * (t - T.renderiza)).toFixed(2)}) scale(${lerp(0.3, 1, est).toFixed(3)}) translate(-540 -960)`);
  $("#mc-estrela").style.transform = `translateY(${lerp(0, -330, cta).toFixed(1)}px)`; $("#mc-estrela").style.opacity = est.toFixed(3);
  const b = fase(t, S.cta + 0.04, S.cta + 0.4), pb = pulso(t, T.previa, 0.32);
  pos($("#cta-botao"), { y: (1 - sai(b)) * 40, s: (b > 0 ? lerp(0.5, 1, volta(b)) : 0.5) * (1 + 0.05 * pb + 0.015 * Math.sin(t * 3.2) * fase(t, DUR - 2, DUR - 1)), o: b > 0 ? Math.min(1, b * 3) : 0 });
  $("#cta-previa").style.transform = `scale(${(1 + 0.14 * pb).toFixed(3)})`;
  const lz = ((t - T.previa) % 2.4) / 0.7; $("#cta-luz").style.transform = `translateX(${(t > T.previa && lz < 1 ? lerp(-200, 900, lz) : -300).toFixed(0)}px) skewX(-18deg)`;
  for (const w of ctaPal) { const x = fase(t, w.ini - 0.05, w.ini + 0.22); pos(w.el, { y: (1 - sai(x)) * 20, o: x > 0 ? Math.min(1, x * 3) : 0 }); }
  $("#cta-nota").style.opacity = fase(t, S.cta + 1.3, S.cta + 1.8).toFixed(3);
  $("#c-fim").style.opacity = fase(t, S.marca - 0.3, S.marca).toFixed(3);
}

window.quadro = t => {
  palco.style.transform = "none";
  const si = em(t, S.sites, S.novela), fi = t >= S.marca - 0.3;
  const naRua = !si && t < S.marca;
  vis($("#mundo"), naRua || em(t, S.marca - 0.3, S.marca));
  $("#mundo").style.opacity = t < S.marca - 0.3 ? 1 : (1 - fase(t, S.marca - 0.3, S.marca)).toFixed(3);
  if (t < S.marca) qMundo(t);
  if (si || fi) { $("#antigo").style.opacity = 0; $("#noite").style.opacity = 0; $("#carimbo").style.opacity = 0; }
  qSobre(t);
  vis($("#c-sites"), si); if (si) qSites(t);
  vis($("#c-fim"), fi); if (fi) qFim(t);
  $("#f-ceu").style.opacity = si ? 0 : 1;
  $("#f-quente").style.opacity = si || fi ? 1 : 0;
  // poeira quente
  for (const p of POEIRA) {
    const y = ((p.y - t * p.v) % 2100 + 2100) % 2100 - 90, x = p.x + Math.sin(t * 0.35 + p.f) * 34, tw = 0.45 + 0.55 * Math.abs(Math.sin(t * 0.7 + p.f));
    p.el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${p.s.toFixed(2)})`;
    p.el.style.background = `radial-gradient(closest-side,rgba(236,150,112,${(0.55 * tw).toFixed(3)}),rgba(236,150,112,0))`;
  }
  // legendas
  for (const p of pedacos) {
    if (!p.el) continue;
    const v = t >= p.de && t < p.ate;
    p.el.style.display = v ? "" : "none";
    if (!v) continue;
    const fora = fase(t, p.ate - 0.08, p.ate);
    p.ws.forEach((w, k) => {
      const x = p.de < 0 ? 1 : fase(t, w.ini - 0.05, w.ini + 0.2);
      pos(p.wel[k], { y: (1 - sai(x)) * 22 - 14 * fora, s: x > 0 ? lerp(0.86, 1, volta(x)) : 0.86, o: (x > 0 ? Math.min(1, x * 3) : 0) * (1 - fora) });
    });
  }
  // tranco em cada impacto: soco de zoom, tremor e clarão
  let soco = 0, tremor = 0, flash = 0;
  for (const f of frases) if (f.impacto) {
    const x = fase(t, f.ini - 0.03, f.ini + 0.38); if (x > 0 && x < 1) { soco = Math.max(soco, 1 - sai(x)); tremor = Math.max(tremor, x < 0.35 ? 1 - x / 0.35 : 0); }
    const y = fase(t, f.ini - 0.03, f.ini + 0.2); if (y > 0 && y < 1) flash = Math.max(flash, 0.34 * (1 - y));
  }
  palco.style.transform = soco > 0 ? `translate(${(tremor * 9 * Math.sin(t * 97)).toFixed(1)}px,${(tremor * 7 * Math.cos(t * 83)).toFixed(1)}px) scale(${(1 + 0.045 * soco).toFixed(4)})` : "";
  $("#flash").style.opacity = flash.toFixed(3);
};

// cenas da trilha (ferramentas/video/trilha-pulso.py só conhece estas partes): o pulso diz qual é qual.
// O flashback de 1997 é o groove ("insta"); a viagem corta a batida ("nada"); a correção e a moral ficam só com os impactos ("fim").
const TRILHA = { abre: "abre", perguntas: "google", segredo: "google", chute: "insta", fila: "insta", ze: "insta", relogio: "insta", viagem: "volta",
  manha: "meio", ninguem: "ese", sites: "site", novela: "site", volta: "site", corrige: "fim", marca: "fim", cta: "cta" };
window.preparar = () => {
  window.quadro(0);
  return {
    duracao: DUR, narracao: NOME, bpm: 118, tom: -2,
    pulso: frases.map(f => ({ id: f.id, cena: TRILHA[f.cena], ini: f.ini, fim: f.fim, pausa: f.pausa || 0, impacto: !!f.impacto })),
    ensaio: [0.3, 2.4, T.homem + 0.6, T.r1 + 0.3, T.r3 + 0.5, T.um + 0.3, T.todos + 0.6, T.alguem97 + 0.5, T.sabia + 0.3, T.oito97 + 0.4, T.fila + 0.4, T.dez + 0.3, T.oito8 + 0.5,
      T.novela97 + 0.2, T.acertava + 0.8, T.foi + 0.8, T.praia + 0.6, T.mesmo + 0.5, T.ninguem + 0.6, T.fazia + 1.5, T.loja + 0.5, T.zap + 0.3,
      T.fecha + 0.7, T.tempo + 0.6, T.alguem3 + 0.8, T.oito3 + 0.3, T.seteW + 0.5, T.ta + 0.6, T.chuta + 0.5, T.renderiza + 1.2, T.previa + 1.2].map(x => +x.toFixed(2)),
  };
};

await Promise.all(["800 76px Geist", "700 30px Geist", "600 30px Geist", "italic 600 30px Fraunces", "italic 500 30px Fraunces"].map(f => document.fonts.load(f).catch(() => {})));
await document.fonts.ready;
window.quadro(0);
window.pronto = true;
</script>
