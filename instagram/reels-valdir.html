<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Reels narrado: o homem que sabia todos os horários</title>
<!-- Reels do Instagram (1080 × 1920, 30 quadros/s) com voz: o Seu Valdir, que sabia o horário de tudo na Rua das
     Acácias, tira quinze dias de férias e a rua se perde; quando ele volta, ninguém pergunta mais nada, porque as
     lojas fizeram site. A Renderiza só aparece no fim (pedido de 27/10/2026: a história prende sozinha e a pessoa só
     percebe no final que é uma publi). Tudo é fictício e as telas das lojas levam o selo "exemplo".
     O tempo de tudo sai da narração: narracao/reels-valdir.json → python3 instagram/narrar.py reels-valdir → esta
     página lê reels-valdir.tempos.json. A rua é um desenho só (#mundo), e a câmera anda por ele: o banco do Seu
     Valdir, a porta da farmácia, a padaria. Sem animação de CSS: window.quadro(t) desenha o instante t (s). -->

<script type="module">
import { MARCAS } from "../site/marcas.mjs";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const NOME = "reels-valdir";
const { duracao: VOZ, frases } = await (await fetch(`narracao/${NOME}.tempos.json`)).json();
const DUR = Math.round((VOZ + 1.67) * 10) / 10; // a voz acaba e o convite fica mais 1,5 s na tela
const F = Object.fromEntries(frases.map(f => [f.id, f]));
const palco = $("#palco");

// ---------- contas ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const fase = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const sai = x => 1 - Math.pow(1 - x, 3);
const saiX = x => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const volta = x => (x <= 0 ? 0 : 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2)); // passa do ponto e volta
const lerp = (a, b, x) => a + (b - a) * x;
const pulso = (t, t0, d = 0.5) => { const x = fase(t, t0, t0 + d); return x > 0 && x < 1 ? Math.sin(Math.PI * x) : 0; };
const h = (i, k = 0) => { const s = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return s - Math.floor(s); };
function pos(el, { x = 0, y = 0, s = 1, r = 0, o = 1, b = 0 } = {}) {
  el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${r.toFixed(2)}deg) scale(${s.toFixed(4)})`;
  el.style.opacity = o.toFixed(3);
  el.style.filter = b > 0.15 ? `blur(${b.toFixed(1)}px)` : "";
  el.style.visibility = o <= 0.002 ? "hidden" : "";
}
const attr = (el, k, v) => el.setAttribute(k, v);
const gt = (el, x, y, s = 1, r = 0) => attr(el, "transform", `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${r.toFixed(2)}) scale(${s.toFixed(4)})`);
// entra: aparece com um pulinho a partir do instante t0
const entra = (t, t0, d = 0.32) => { const x = fase(t, t0 - 0.04, t0 + d); return { x, s: x > 0 ? lerp(0.6, 1, volta(x)) : 0.6, o: x > 0 ? Math.min(1, x * 3) : 0, y: (1 - sai(x)) * 30 }; };
const limpa = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9-]/g, "");
function W(id, pal, n = 0) {
  const ps = F[id].palavras, alvo = limpa(pal);
  const xs = ps.filter(p => limpa(p.p) === alvo).length ? ps.filter(p => limpa(p.p) === alvo) : ps.filter(p => limpa(p.p).startsWith(alvo));
  if (!xs[n]) throw new Error(`sem a palavra "${pal}" na frase ${id}`);
  return xs[n].ini;
}

// ---------- cenas: cada uma começa na primeira frase dela ----------
const ORDEM = ["rua", "perguntas", "sabe", "anos", "viagem", "fila", "lurdes", "mudanca", "volta", "ninguem", "sites", "jogo", "marca", "cta"];
const S = {};
ORDEM.forEach((c, i) => { S[c] = i === 0 ? 0 : frases.find(f => f.cena === c).ini; });
const T = {
  acacias: W("rua", "acacias"), valdir: W("valdir", "valdir"),
  que: W("farmacia", "que"), oito: W("farmacia", "oito"), nove: W("farmacia", "nove"),
  vet: W("sabia", "veterinario"), feira: W("sabia", "feira"), gel: W("sabia", "geladeira"), sabia: W("sabia", "sabia"), cabeca: W("sabia", "cabeca"),
  ate: W("viagem", "ate"), foi: W("viagem", "foi"), filha: W("viagem", "filha"), praia: W("viagem", "praia"),
  fila: W("fila", "fila"), abria: W("fila", "abria"), h9: W("fila", "9h"),
  ligou: W("lurdes", "ligou"), chaveiro: W("lurdes", "chaveiro"), calabresa: W("lurdes", "calabresa"),
  mudar: W("mudanca", "mudar"), achando: W("mudanca", "achando"), padaria: W("mudanca", "padaria"),
  voltou: W("nada", "voltou"), sentou: W("espera", "sentou"), esperou: W("espera", "esperou"),
  ninguem: W("ninguem", "ninguem"), perguntou: W("ninguem", "perguntou"), nadaW: W("ninguem", "nada"),
  padS: W("sites", "padaria"), horario: W("sites", "horario"), endereco: W("sites", "endereco"), zap: W("sites", "whatsapp"), farmS: W("sites", "farmacia"), chavS: W("sites", "chaveiro"),
  agora: W("jogo", "agora"), jogo: W("jogo", "jogo"),
  renderiza: W("marca", "renderiza"), previa: W("cta", "previa"),
};

// ---------- ícones (Lucide) e marcas ----------
const IC = {

// ---------- legendas: frases longas viram pedaços de até duas linhas ----------
function partir(ws) {
  const txt = a => a.map(p => p.p).join(" ");
  for (let k = 0; k < ws.length - 1; k++) if (/[.?!]$/.test(ws[k].p)) return [...partir(ws.slice(0, k + 1)), ...partir(ws.slice(k + 1))];
  if (txt(ws).length <= 44) return [ws];
  let melhor = 1, nota = Infinity;
  for (let k = 1; k < ws.length; k++) {
    let n = Math.abs(txt(ws.slice(0, k)).length - txt(ws.slice(k)).length);
    if (/[,:;]$/.test(ws[k - 1].p)) n -= 20; else if (/^(e|com|sem|para|que)$/i.test(ws[k].p)) n -= 6;
    if (n < nota) { nota = n; melhor = k; }
  }
  return [...partir(ws.slice(0, melhor)), ...partir(ws.slice(melhor))];
}

  if (naRua || t < S.marca) qMundo(t);
  qBaloes(t);
  const lu = t >= S.lurdes && t < S.mudanca, si = t >= T.padS - 0.2 && t < S.jogo - 0.3, fi = t >= S.marca - 0.3;
  vis($("#c-lurdes"), lu); if (lu) qLurdes(t);
  vis($("#c-sites"), si); if (si) qSites(t);
  vis($("#c-fim"), fi); if (fi) qFim(t);
  $("#f-ceu").style.opacity = lu || si ? 0 : 1;
  $("#f-lurdes").style.opacity = lu ? 1 : 0;
  $("#f-quente").style.opacity = si || fi ? 1 : 0;
  // poeira quente
  for (const p of POEIRA) {
    const y = ((p.y - t * p.v) % 2100 + 2100) % 2100 - 90, x = p.x + Math.sin(t * 0.35 + p.f) * 34, tw = 0.45 + 0.55 * Math.abs(Math.sin(t * 0.7 + p.f));
    p.el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${p.s.toFixed(2)})`;
    p.el.style.background = `radial-gradient(closest-side,rgba(236,150,112,${(0.55 * tw).toFixed(3)}),rgba(236,150,112,0))`;
  }
  // legendas
  for (const p of pedacos) {
    if (!p.el) continue;
    const v = t >= p.de && t < p.ate;
    p.el.style.display = v ? "" : "none";
    if (!v) continue;
    const fora = fase(t, p.ate - 0.08, p.ate);
    p.ws.forEach((w, k) => {
      const x = p.de < 0 ? 1 : fase(t, w.ini - 0.05, w.ini + 0.2);
      pos(p.wel[k], { y: (1 - sai(x)) * 22 - 14 * fora, s: x > 0 ? lerp(0.86, 1, volta(x)) : 0.86, o: (x > 0 ? Math.min(1, x * 3) : 0) * (1 - fora) });
    });
  }
  // tranco em cada impacto: soco de zoom, tremor e clarão
  let soco = 0, tremor = 0, flash = 0;
  for (const f of frases) if (f.impacto) {
    const x = fase(t, f.ini - 0.03, f.ini + 0.38); if (x > 0 && x < 1) { soco = Math.max(soco, 1 - sai(x)); tremor = Math.max(tremor, x < 0.35 ? 1 - x / 0.35 : 0); }
    const y = fase(t, f.ini - 0.03, f.ini + 0.2); if (y > 0 && y < 1) flash = Math.max(flash, 0.34 * (1 - y));
  }
  palco.style.transform = soco > 0 ? `translate(${(tremor * 9 * Math.sin(t * 97)).toFixed(1)}px,${(tremor * 7 * Math.cos(t * 83)).toFixed(1)}px) scale(${(1 + 0.045 * soco).toFixed(4)})` : "";
  $("#flash").style.opacity = flash.toFixed(3);
};

    ensaio: [0.3, 2.4, T.valdir + 0.9, T.oito + 0.6, T.nove + 0.5, T.gel + 0.5, T.cabeca + 0.5, S.anos + 1.2, T.foi + 0.8, T.praia + 0.6, T.fila + 0.3, T.h9 + 0.8,
      T.chaveiro + 0.3, T.calabresa + 1.2, T.mudar, T.padaria + 0.4, T.voltou - 0.4, T.sentou + 0.8, T.nadaW + 0.3, T.padS + 0.6, T.zap + 0.3, T.farmS + 0.6, T.chavS + 0.7,
      T.jogo + 0.4, T.renderiza - 0.5, T.renderiza + 1.0, T.previa + 1.2].map(x => +x.toFixed(2)),
  };
};
