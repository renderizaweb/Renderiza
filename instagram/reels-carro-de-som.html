<title>Reels narrado: o carro de som</title>
<!-- Reels do Instagram (1080 × 1920, 30 quadros/s) com voz. Reels 3 da série com história (27/10/2026).
     Alvo: o dono de negócio local que já impulsiona post ou anuncia, ou pensa em começar, e não sabe o que voltou.
     Objetivo: ele perceber que o anúncio que leva para um perfil sem preço e sem horário não deixa rastro, e que um
     site pronto para anúncio mostra quem chegou e deixa falar de novo só com quem se interessou. O vídeo não diz que a
     Renderiza faz anúncio nem que não faz: quem anuncia é o próprio Seu Jorge.
     A história: o Seu Jorge paga o carro de som do Tião; quantos vieram, "aí já não é comigo". Ele troca pelo botão
     Impulsionar, e o celular responde igual. Malhando em ferro frio (o único trocadilho). Então ele faz um site, sabe
     quem chegou e anuncia de novo só para quem chegou perto: um carro de som que volta só onde abriram a janela. No fim,
     o Tião para só nas janelas abertas, e fala baixinho. Tudo é fictício, e as telas levam o selo "exemplo".
     O tempo de tudo sai da narração: narracao/reels-carro-de-som.json → python3 instagram/narrar.py reels-carro-de-som →
     esta página lê reels-carro-de-som.tempos.json. A rua é um desenho só, com a sua câmera; a academia é outro.
     Sem animação de CSS: window.quadro(t) desenha o instante t (s). -->

  qBaloes(t, rua ? camRua(t) : [540, 960, 1]);
  vis($("#c-fim"), fim); if (fim) qFim(t);
  for (const p of POEIRA) {
    const y = ((p.y - t * p.v) % 2100 + 2100) % 2100 - 90, x = p.x + Math.sin(t * 0.35 + p.f) * 34, tw = 0.45 + 0.55 * Math.abs(Math.sin(t * 0.7 + p.f));
    p.el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${p.s.toFixed(2)})`;
    p.el.style.background = `radial-gradient(closest-side,rgba(236,150,112,${(0.45 * tw).toFixed(3)}),rgba(236,150,112,0))`;
  }
  // legendas
  for (const p of pedacos) {
    if (!p.el) continue;
    const v = t >= p.de && t < p.ate;
    p.el.style.display = v ? "" : "none";
    if (!v) continue;
    const fora = fase(t, p.ate - 0.08, p.ate);
    p.ws.forEach((w, k) => {
      const x = p.de < 0 ? 1 : fase(t, w.ini - 0.05, w.ini + 0.2);
      pos(p.wel[k], { y: (1 - sai(x)) * 22 - 14 * fora, s: x > 0 ? lerp(0.86, 1, volta(x)) : 0.86, o: (x > 0 ? Math.min(1, x * 3) : 0) * (1 - fora) });
    });
  }
  // tranco em cada impacto: soco de zoom, tremor e clarão
  let soco = 0, tremor = 0, flash = 0;
  for (const f of frases) if (f.impacto) {
    const x = fase(t, f.ini - 0.03, f.ini + 0.38); if (x > 0 && x < 1) { soco = Math.max(soco, 1 - sai(x)); tremor = Math.max(tremor, x < 0.35 ? 1 - x / 0.35 : 0); }
    const y = fase(t, f.ini - 0.03, f.ini + 0.2); if (y > 0 && y < 1) flash = Math.max(flash, 0.34 * (1 - y));
  }
  palco.style.transform = soco > 0 ? `translate(${(tremor * 9 * Math.sin(t * 97)).toFixed(1)}px,${(tremor * 7 * Math.cos(t * 83)).toFixed(1)}px) scale(${(1 + 0.045 * soco).toFixed(4)})` : "";
  $("#flash").style.opacity = flash.toFixed(3);
};
