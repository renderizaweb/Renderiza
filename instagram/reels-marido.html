<!-- Reels do Instagram (1080 × 1920, 30 quadros/s) com voz. 07/11/2026, parte 3 da série "O celular da fotógrafa"
     (SERIE.md). Alvo: a fotógrafa que abre a mini sessão de Natal pelo direct e segura horário sem prazo para quem pede.
     Objetivo: ela perceber que vaga segurada sem prazo fica vazia, e que com a agenda do site e o painel o horário fica
     separado por 24 horas até o sinal; se o sinal não vem, a vaga volta, a Helena chama a primeira da lista de espera e
     o painel conta quantas vagas sobraram. Para fotógrafas, a agenda é a do painel e não liga com o Google (o vídeo não
     diz que liga); o painel não chama a lista de espera sozinho: quem chama é a Helena.
     A história: abre com nove vagas carimbadas "segurada" por alguém que nunca pagou. Depois do gancho, o resumo da parte
     2. Quem fala é a frase "vou ver com meu marido". A Carla pede o das dez do dia 5/12, a Helena segura e recusa quatro pedidos (um deles, da tia
     Rosa da parte 2), e no sábado o estúdio fica vazio às dez. As vagas do dia 12/12 já abrem pela agenda do site. A virada: o marido tinha dito sim no primeiro dia; a Carla só esqueceu de avisar.
     Com a agenda do site, o horário espera o sinal por 24 horas. Fecho: a Carla volta com a mesma frase e, com prazo, o
     marido responde em vinte minutos. Pós-créditos: a parte 4, no padrão da série (serie.mjs). Tudo é fictício, e as
     telas levam o selo "exemplo". O tempo de tudo sai da narração: narracao/reels-marido.json →
     python3 instagram/narrar.py reels-marido. Sem animação de CSS: window.quadro(t) desenha o instante t (s). -->

// ====================== peças por cima ======================
$("#extra").innerHTML = `<div id="relogio">10:00</div><div id="infinito"><b>∞</b><small>prazo para decidir</small></div>
  <div class="etq tc" id="etq-1dia">no primeiro dia</div>`;
$("#quadro").style.display = "";

// ====================== quadro a quadro ======================
// o gancho: o quadro de vagas da mini sessão, carimbadas uma a uma, e nenhum sinal
function qQuadro(t) {
  const el = $("#quadro"), on = t < S.resumo + 0.3;
  vis(el, on); if (!on) return;

    pos($(`#vg${k} .car`), { s: c > 0 ? lerp(2.2, 1, sai(c)) : 2.2, r: -8 + 5 * h(k, 2), o: c > 0 ? Math.min(1, c * 3) : 0 });

    [["#dm-h2", I("semana")], ["#dm3", I("semana") + 0.1], ["#dm4", T.vendo - 0.25]].forEach(([id, t0]) => { const a = entra(t, t0, 0.3); pos($(id), { y: a.y * 0.6, s: lerp(0.85, 1, a.x > 0 ? volta(a.x) : 0), o: semana ? a.o : 0 }); });

    const a = entra(t, T.respondido - 0.5, 0.3); pos($("#zp1"), { y: a.y * 0.6, s: lerp(0.85, 1, a.x > 0 ? volta(a.x) : 0), o: a.o });

    $("#zp2").style.boxShadow = pulso(t, T.primeiro - 0.1, 0.8) > 0.05 ? `0 0 0 ${(6 * pulso(t, T.primeiro - 0.1, 0.8)).toFixed(1)}px #e8855e` : "";
  }
  if (tela === "s-ag") {
    HORAS.forEach((_, k) => { const b = entra(t, S.site + 0.15 + k * 0.05, 0.3); pos($(`#ah${k}`), { y: b.y * 0.5, s: b.x > 0 ? lerp(0.9, 1, volta(b.x)) : 0.9, o: b.o }); });
    const sep = t >= T.tap10 + 0.1, volta_ = t >= T.volta - 0.1;
    $("#ah1").className = "ag-h" + (sep && !volta_ ? " pre" : ""); $("#ah1 small").textContent = sep && !volta_ ? "separado" : "livre";

    // o relógio das 24 horas corre até zerar na volta
    const rest = Math.max(0, 86400 * (1 - fase(t, T.tap10 + 0.3, T.volta - 0.1)));

    const pv = pulso(t, T.volta - 0.05, 0.7); $("#ah1").style.boxShadow = pv > 0.05 ? `0 0 0 ${(5 * pv).toFixed(1)}px #25a35a` : "";
    toque(t, T.tap10, $("#ah1"));

    toque(t, T.espera + 0.05, $("#pe-bt"));
  }
  if (tela === "s-dm2") {
    [["#d21", T.voltou], ["#d22", T.marido3 + 0.3], ["#d2h", T.vinte - 0.5], ["#d23", T.vinte - 0.3]].forEach(([id, t0]) => { const a = entra(t, t0, 0.3); pos($(id), { y: a.y * 0.6, s: lerp(0.85, 1, a.x > 0 ? volta(a.x) : 0), o: a.o }); });

// o narrador: [t, x, y, escala, giro, opacidade]
const EU = [
