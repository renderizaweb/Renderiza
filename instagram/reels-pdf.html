<!-- Reels do Instagram (1080 × 1920, 30 quadros/s) com voz. 06/11/2026, episódio 1 da série com as coisas que moram no
     celular da fotógrafa. Alvo: a fotógrafa de gestante e newborn que responde "valor?" mandando a tabela em PDF e acha
     que quem some achou caro. Objetivo: ela perceber que a cliente, muitas vezes, nem chega a ver o preço, e que com o
     portfólio separado por ensaio no site (fotos, o que vem incluso e o preço na primeira tela) ela manda o link.
     A história: abre como mistério. Quem fala foi mandado para 212 mães e só foi aberto quatro vezes: é o PDF de preços
     da Helena, "Tabela 2026 FINAL agora vai". Quase meia-noite, a Camila, grávida de oito meses, toca para baixar, o 4G
     pensa, o bebê chuta e o celular cai na cara dela. Antes de dormir ela acha o site de outra fotógrafa, com fotos e
     preço logo de cara, e chama no WhatsApp. No dia seguinte, "Visualizado". A Helena acha que foi o preço; a outra
     cobrava mais caro, e a Camila nem chegou a ver o preço da Helena. A Helena faz um site e passa a mandar o link. Fecho:
     as quatro vezes que abriram o PDF eram a própria Helena, conferindo o preço. "Estava." Depois do convite, uma cena
     pós-créditos anuncia o episódio 2 (o comprovante de Pix que sumiu). Tudo é fictício, e as telas levam o selo
     "exemplo". O tempo de tudo sai da narração: narracao/reels-pdf.json → python3 instagram/narrar.py reels-pdf.
     As peças comuns (contas, gente, legendas, marca, convite e trilha) estão em historia.mjs e historia.css.
     Sem animação de CSS: window.quadro(t) desenha o instante t (s). -->

// expressão do narrador: boca, olhos (0 aberto, 1 fechado) e sobrancelhas (-1 triste, 0, 1 erguidas)
function cara(p, b, olho = 0, sob = 0) {
  boca(p, b);
  attr($(`#${p}olhos`), "transform", olho > 0 ? `translate(0 -6) scale(1 ${lerp(1, 0.1, olho).toFixed(3)}) translate(0 6)` : "");
  const sb = $(`#${p}sob`).children;
  attr(sb[0], "transform", `translate(0 ${(-10 * sob).toFixed(1)}) rotate(${(sob < 0 ? 14 * sob : 0).toFixed(1)} -48 -42)`);
  attr(sb[1], "transform", `translate(0 ${(-10 * sob).toFixed(1)}) rotate(${(sob < 0 ? -14 * sob : 0).toFixed(1)} 48 -42)`);
}
