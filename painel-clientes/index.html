<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel Renderiza</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#173a2f">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Estilo mínimo da casca e do login (Missão 1), com as cores dos exemplos (exemplos/painel-eventos.html).
   As peças de verdade e o estilo.css nascem na Missão 2. */
:root{
  --fundo:#f4f3ee;--cartao:#fff;--tinta:#17201b;--tinta-2:#46534b;--suave:#7d8a82;--linha:#e6e5de;
  --verde:#2d6a4f;--verde-2:#1d4a37;--verde-claro:#e2efe7;--lateral:#173a2f;--perigo:#c2410c;--perigo-claro:#fdecdf;
  --raio:18px;--sombra:0 1px 2px rgba(23,32,27,.05),0 8px 24px -12px rgba(23,32,27,.12);
  --fonte:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--fonte);font-size:15px;line-height:1.45;color:var(--tinta);background:var(--fundo);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:var(--verde)}
:focus-visible{outline:2px solid var(--verde);outline-offset:2px}
.titulo{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin-bottom:8px}
.suave{color:var(--suave);font-size:.875rem}
.botao{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--linha);background:var(--cartao);color:var(--tinta);font-weight:600;cursor:pointer}
.botao:disabled{opacity:.6;cursor:default}
.botao-primario{background:var(--verde);border-color:var(--verde);color:#fff}
.botao-primario:hover:not(:disabled){background:var(--verde-2)}
.carregando{min-height:100vh;display:grid;place-items:center;color:var(--suave)}

.entrar{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.entrar-cartao{width:100%;max-width:380px;background:var(--cartao);border:1px solid var(--linha);border-radius:var(--raio);box-shadow:var(--sombra);padding:28px 24px;display:flex;flex-direction:column;gap:16px}
.entrar-marca{display:flex;align-items:center;gap:10px;font-weight:700}
.entrar-marca img{border-radius:10px}
.etiqueta-ambiente{margin-left:auto;font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:999px;background:#fff4d6;color:#7a5200}
.campo{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.875rem}
.campo input{height:46px;border:1px solid var(--linha);border-radius:12px;padding:0 14px;font-size:16px;font-weight:400;background:#fff}
.campo input:focus{border-color:var(--verde);outline:none;box-shadow:0 0 0 3px var(--verde-claro)}
.entrar-erro{background:var(--perigo-claro);color:var(--perigo);border-radius:12px;padding:10px 12px;font-size:.875rem}

.casca{display:flex;min-height:100vh}
.menu{width:230px;flex:none;background:var(--lateral);color:#d7e5dd;padding:20px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.menu-marca{display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;padding:0 10px 16px}
.menu-marca img{border-radius:8px}
.menu a{color:inherit;text-decoration:none;padding:7px 10px;border-radius:10px}
.menu a:hover,.menu a[aria-current=page]{background:rgba(255,255,255,.1);color:#fff}
.menu-grupo{margin:14px 10px 4px;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:#9fb8aa}
.menu-pe{margin-top:auto;padding:10px 10px 0;display:flex;flex-direction:column;gap:6px}
.menu-pe .suave{color:#9fb8aa;word-break:break-all}
.conteudo{flex:1;padding:28px 24px;min-width:0}
.falha{max-width:480px;margin:15vh auto;padding:0 16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
@media (max-width:720px){
  .casca{flex-direction:column}
  .menu{width:auto;flex-direction:row;flex-wrap:wrap;gap:4px;padding:12px;position:static;height:auto}
  .menu-marca{width:100%;padding-bottom:8px}
  .menu-grupo{width:100%;margin:8px 10px 0}
  .menu-pe{width:100%;flex-direction:row;align-items:center;justify-content:space-between}
}
</style>
</head>
<body>
<div id="app"><p class="carregando">Abrindo o painel…</p></div>
<script type="module" src="/src/app.js"></script>
</body>
</html>
