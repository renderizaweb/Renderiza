// o nicho e o módulo entram no painel do exemplo como entrariam no de verdade (Fase 1: src/nichos e src/modulos)
NICHOS.automotivo = automotivo;
if (!MODULOS.some(m => m.id === "estoque")) MODULOS.splice(1, 0, { id: "estoque", nome: "Estoque", base: false, carregar: () => import("/exemplos/estoque/modulo.js") });
const CAIXA = '<svg class="rz-icone" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/></svg>';

async function abrir() {
  const loja = criarLojaLocal({ chave: "rz-exemplo-estoque:ricardo-motors", inicial: INICIAL });
  document.querySelector("[data-recomecar]").addEventListener("click", () => { loja.zerar(); avisar("Pronto: o estoque voltou ao de agora no site."); });

  const dados = dadosDoCiranda({ dominio: location.host + "/demo/ricardo-motors", conteudoInicial: {} });
  const conta = {
    ...dados.rpc.minhas_contas()[0], nome: "Ricardo Motors", nicho: "automotivo", codigo: "ricardo-motors", cores: { principal: "#141416" },
    modulos: ["estoque", "meu-site", "atendimento"],
  };
  dados.rpc.minhas_contas = () => [conta];
  dados.tabelas.contas = [{ ...dados.tabelas.contas[0], nome: conta.nome, nicho: conta.nicho, codigo: conta.codigo }];
  dados.tabelas.pessoas = [{ ...dados.tabelas.pessoas[0], nome: "Ricardo Neves", papel: "Consultor e proprietário", cor: "#87672b", email: "ricardo@ricardo-motors.teste" }];
  dados.usuario = { ...dados.usuario, email: "ricardo@ricardo-motors.teste" };
  const banco = await criarAdaptadorSupabase({ url: "https://exemplo.invalid", chave: "exemplo", createClient: criarCliente(dados) });
  const sessao = criarSessao(banco);
  await sessao.iniciar();
  await sessao.carregarContas();
  await sessao.carregarPessoa();

  document.body.classList.add("rz-tema-automotivo");
  const raiz = document.getElementById("app");
  const fora = () => {};
  let estoque = null;
  const { conteudo } = montarCasca(raiz, { rota: { tipo: "modulo", id: "estoque" }, sessao, banco, navegar: fora, ambiente: "production" });
  // o ícone do Estoque (a casca ainda não tem um) e o Estoque na barra de baixo do celular, logo depois do Início
  raiz.querySelectorAll('a[href="/estoque"]').forEach(a => { const s = a.querySelector("svg"); if (s) s.outerHTML = CAIXA; });
  const barra = raiz.querySelector(".rz-barra");
  if (barra && !barra.querySelector('a[href="/estoque"]')) {
    const inicio = barra.querySelector('a[href="/inicio"], a[href="/"]');
    const a = document.createElement("a");
    a.href = "/estoque"; a.setAttribute("aria-current", "page"); a.innerHTML = CAIXA.replace('width="20" height="20"', 'width="22" height="22"') + "<span>Estoque</span>";
    if (inicio) inicio.after(a); else barra.prepend(a);
    const sobra = barra.querySelectorAll("a"); if (sobra.length > 4) sobra[sobra.length - 1].remove();
  }
  // no exemplo, só o Estoque abre; o Meu site e os outros explicam o que fazem
  const explicar = { "/meu-site": "O Meu site cuida do visual do site: textos, fotos, cores e seções. Neste exemplo, abre só o Estoque.",
    "/atendimento": "O Atendimento junta quem chamou e por qual carro. Neste exemplo, abre só o Estoque." };
  document.addEventListener("click", ev => {
    const alvo = ev.target.closest("[data-novo], [data-mais], [data-acao], [data-sair], [data-trocar-conta], .rz-lateral a[href], .rz-barra a[href], .rz-topo a[href]");
    if (!alvo || !raiz.contains(alvo) || ev.target.closest(".rz-principal")) return;
    ev.preventDefault();
    ev.stopImmediatePropagation();
    if (alvo.matches("[data-novo]")) return estoque && estoque.editar(null);
    const caminho = alvo.matches("a[href]") ? new URL(alvo.href).pathname : "";
    if (caminho === "/estoque") return;
    avisar(explicar[caminho] || "Neste exemplo, abre só o Estoque. O resto do painel está nos exemplos da Renderiza.", { tipo: "sucesso" });
  }, true);

  estoque = await montarEstoque(conteudo, { esquema: ESQUEMAS.automotivo, loja, avisar, previa: { endereco: "/demo/ricardo-motors?rz-estoque=exemplo&video=1" } });
}
abrir().catch(e => {
  document.getElementById("app").innerHTML = '<div class="ex-abrindo" role="alert">Não consegui abrir o exemplo. Recarregue a página.</div>';
  console.error(e);
});
</script>
