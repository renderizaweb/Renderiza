<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de gestão · Villa Alecrim (exemplo)</title>
<meta name="description" content="Exemplo de painel para espaço de eventos: agenda da equipe, clientes, contratos, financeiro e atendimento num lugar só. Dados fictícios, feito pela Renderiza.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#173a2f">
<meta property="og:type" content="website">
<meta property="og:title" content="Painel de gestão para espaço de eventos (exemplo)">
<meta property="og:description" content="Agenda da equipe, clientes, contratos, financeiro e atendimento num lugar só. Demonstração com dados fictícios, feita pela Renderiza.">
<meta property="og:image" content="https://www.renderizaweb.com.br/exemplos/img/painel.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --fundo:#f4f3ee;--cartao:#fff;--tinta:#17201b;--tinta-2:#46534b;--suave:#7d8a82;--linha:#e6e5de;--linha-2:#efeee8;
  --verde:#2d6a4f;--verde-2:#1d4a37;--verde-claro:#e2efe7;--ouro:#c49a45;--lateral:#173a2f;
  --perigo:#c2410c;--perigo-claro:#fdecdf;--ok:#1f7a4d;--ok-claro:#ddf3e7;
  --raio:18px;--sombra:0 1px 2px rgba(23,32,27,.05),0 8px 24px -12px rgba(23,32,27,.12);
  --fonte:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--fonte);font-size:14px;line-height:1.45;color:var(--tinta);background:var(--fundo);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.lateral{position:sticky;top:0;height:100vh;background:var(--lateral);color:#d9e6df;display:flex;flex-direction:column;padding:22px 14px 16px;gap:18px}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px;color:#fff}
.logo-ramo{width:34px;height:34px;border-radius:11px;background:#ffffff14;display:grid;place-items:center;color:#cfe3d6}
.logo-ramo svg{width:22px;height:22px}
.logo b{display:block;font:italic 600 21px/1 "Fraunces",Georgia,serif;letter-spacing:-.2px}
.logo small{display:block;margin-top:3px;font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#9fbfae}
.menu{display:flex;flex-direction:column;gap:2px}
.menu a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;font-weight:600;color:#c3d6cb;position:relative;transition:background .15s,color .15s}
.menu a:hover{background:#ffffff0d;color:#fff}
.menu a.ativo{background:#ffffff17;color:#fff}
.menu a.ativo::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--ouro)}
.menu .num{margin-left:auto;min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:#e0607e;color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center}
.menu a.trancado{display:none}
.link-agenda{margin-top:auto;border-radius:16px;background:#ffffff10;padding:14px;font-size:12.5px;color:#c3d6cb}
.link-agenda strong{display:flex;align-items:center;gap:8px;color:#fff;font-size:13px;margin-bottom:4px}
.link-agenda code{display:block;margin:8px 0 10px;padding:7px 9px;border-radius:9px;background:#0000002e;color:#e8f1ec;font:600 11.5px/1.3 var(--fonte);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-agenda a{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:#f3d999}
.quem{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:#00000024}
.quem select{appearance:none;background:transparent;border:0;color:#fff;font-weight:700;width:100%;cursor:pointer;padding-right:18px}
.quem select option{color:#17201b}
.quem small{display:block;font-size:11px;color:#9fbfae}
.quem .seta{margin-left:-22px;pointer-events:none;color:#9fbfae}

.principal{min-width:0;display:flex;flex-direction:column}
.topo{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:14px 32px;background:color-mix(in srgb,var(--fundo) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent}
.topo .logo{display:none}
.espaco{flex:1}
.busca{display:flex;align-items:center;gap:8px;height:42px;width:min(340px,32vw);padding:0 14px;border-radius:12px;background:var(--cartao);border:1px solid var(--linha);color:var(--suave)}
.busca input{border:0;outline:0;background:transparent;width:100%;color:var(--tinta)}
.botao{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;font-weight:700;white-space:nowrap;transition:transform .12s,background .15s}
.botao:active{transform:scale(.98)}
.botao.primario{background:var(--verde);color:#fff;box-shadow:0 6px 16px -8px #2d6a4f}
.botao.primario:hover{background:var(--verde-2)}
.botao.leve{background:var(--cartao);border:1px solid var(--linha)}
.botao.leve:hover{border-color:#cfd3c8}
.botao.pequeno{height:34px;padding:0 12px;border-radius:10px;font-size:13px}
.icone-botao{position:relative;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--cartao);border:1px solid var(--linha)}
.icone-botao .ponto{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:#e0607e;border:2px solid #fff}
.av{display:inline-grid;place-items:center;flex:none;width:32px;height:32px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;letter-spacing:.02em}
.av.p{width:24px;height:24px;font-size:10px}
.av.g{width:44px;height:44px;font-size:15px}
.av.cliente{background:#e8e7e0;color:var(--tinta-2)}
.pilha{display:flex}.pilha .av{border:2px solid var(--fundo);margin-left:-8px}.pilha .av:first-child{margin-left:0}

main{padding:8px 32px 48px;min-width:0}
.vista{display:none;animation:surge .35s cubic-bezier(.2,.8,.2,1)}
.vista.ativa{display:block}
@keyframes surge{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.vista-cab{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:10px 0 20px;flex-wrap:wrap}
.vista-cab h2{font-size:26px;line-height:1.15;letter-spacing:-.02em;font-weight:800}
.vista-cab p{color:var(--suave);margin-top:4px;font-size:14px}
.vista-cab .acoes{display:flex;gap:8px;flex-wrap:wrap}

.cartao{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--raio);box-shadow:var(--sombra);min-width:0}
.cartao-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px 6px}
.cartao-cab h3{font-size:15px;font-weight:700;letter-spacing:-.01em}
.cartao-cab a,.cartao-cab button.ver{font-size:13px;font-weight:700;color:var(--verde)}
.cartao-corpo{padding:10px 20px 18px}
.grade{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-73{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.mt{margin-top:16px}

/* números */
.kpi{padding:18px 20px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.kpi .rot{display:flex;align-items:center;gap:8px;color:var(--suave);font-size:13px;font-weight:600}
.kpi .rot i{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--verde-claro);color:var(--verde)}
.kpi .valor{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:4px}
.kpi .det{font-size:12.5px;color:var(--suave)}
.delta{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:999px;font-size:12px;font-weight:700;background:var(--ok-claro);color:var(--ok)}
.delta.baixo{background:var(--perigo-claro);color:var(--perigo)}
.kpi svg.linha{position:absolute;right:14px;bottom:14px;width:96px;height:36px}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.sem::before{display:none}
.barra{height:6px;border-radius:999px;background:var(--linha-2);overflow:hidden}
.barra b{display:block;height:100%;border-radius:inherit;background:var(--verde)}

/* listas */
.lista{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--linha-2);cursor:pointer;border-radius:12px;transition:background .15s}
.item:first-child{border-top:0}
.item:hover{background:#f8f8f4}
.data-bloco{flex:none;width:52px;height:56px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.data-bloco b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.data-bloco small{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.item .meio{min-width:0;flex:1}
.item .meio b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meio span{display:block;color:var(--suave);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .fim{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:96px}
.item .fim small{font-size:12px;color:var(--suave);font-weight:600}
.origem{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff}

/* agenda */
.agenda-barra{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.mes-nav{display:flex;align-items:center;gap:4px;background:var(--cartao);border:1px solid var(--linha);border-radius:12px;padding:4px}
.mes-nav button{width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.mes-nav button:hover{background:var(--linha-2)}
.mes-nav b{min-width:150px;text-align:center;font-size:15px;text-transform:capitalize}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;flex:none;height:36px;padding:0 12px 0 6px;border-radius:999px;background:var(--cartao);border:1px solid var(--linha);font-weight:600;font-size:13px;transition:all .15s}
.chip.so-texto{padding:0 14px}
.chip.ativo{background:var(--tinta);border-color:var(--tinta);color:#fff}
.legenda{display:flex;gap:14px;flex-wrap:wrap;color:var(--tinta-2);font-size:12.5px;font-weight:600;margin-left:auto}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:9px;height:9px;border-radius:3px}
.agenda-grade{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.cal{overflow:hidden}
.cal-sem{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--linha)}
.cal-sem span{padding:10px 12px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--suave)}
.cal-dias{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dia{min-height:118px;padding:8px;border-right:1px solid var(--linha-2);border-bottom:1px solid var(--linha-2);display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:background .15s;min-width:0}
.dia:nth-child(7n){border-right:0}
.dia:hover{background:#fafaf6}
.dia.fds{background:#fbfaf6}
.dia.fora{opacity:.42}
.dia.sel{box-shadow:inset 0 0 0 2px var(--verde);background:#f4f9f6}
.dia .n{font-size:12.5px;font-weight:700;color:var(--tinta-2);width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.dia.hoje .n{background:var(--verde);color:#fff}
.ev{display:flex;align-items:center;gap:5px;padding:4px 6px;border-radius:7px;font-size:11.5px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;border-left:3px solid;transition:opacity .2s,transform .2s;min-width:0}
.ev time{font-weight:800;opacity:.85;flex:none}
.ev em{font-style:normal;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ev.pre{border-left-style:dashed;background:repeating-linear-gradient(135deg,#fff,#fff 5px,#f6f2e4 5px,#f6f2e4 10px)!important}
.ev.apagado,.ponto-ev.apagado{opacity:.16}
.dia .mais{font-size:11.5px;font-weight:700;color:var(--suave);padding-left:4px}
.pontos{display:none;gap:3px;justify-content:center;flex-wrap:wrap}
.ponto-ev{width:6px;height:6px;border-radius:50%}
.dia-painel .cartao-corpo{padding-top:4px}
.dia-livre{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:var(--verde-claro);color:var(--verde-2);font-weight:600;margin-top:8px}
.comp{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--linha-2);cursor:pointer}
.comp:first-child{border-top:0}
.comp .hora{flex:none;width:46px;font-weight:800;font-size:13px;color:var(--tinta-2);padding-top:1px}
.comp .faixa{flex:none;width:4px;border-radius:4px}
.comp b{display:block;font-size:14px}
.comp span{display:block;font-size:12.5px;color:var(--suave);margin-top:2px}
.ocup{display:flex;flex-direction:column;gap:12px}
.ocup-linha{display:grid;grid-template-columns:44px 1fr 46px;gap:10px;align-items:center;font-size:13px}
.ocup-linha b{font-weight:700;text-transform:capitalize}
.ocup-linha .barra{height:10px}
.ocup-linha span{text-align:right;color:var(--suave);font-weight:600}
.sabados{display:flex;gap:4px}
.sabados i{flex:1;height:10px;border-radius:4px;background:var(--linha-2)}
.sabados i.cheio{background:var(--verde)}
.sabados i.pre{background:#d7c48f}

/* tabelas */
.tabela{width:100%;border-collapse:collapse}
.tabela th{text-align:left;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--suave);padding:12px 16px;border-bottom:1px solid var(--linha)}
.tabela td{padding:13px 16px;border-bottom:1px solid var(--linha-2);vertical-align:middle}
.tabela tbody tr{cursor:pointer;transition:background .15s}
.tabela tbody tr:hover{background:#fafaf6}
.tabela tbody tr:last-child td{border-bottom:0}
.tabela .nome{display:flex;align-items:center;gap:12px;min-width:0}
.tabela .nome b{display:block}
.tabela .nome small{display:block;color:var(--suave);font-size:12px}
.tabela .num{text-align:right;font-weight:700;white-space:nowrap}
.pago-cel{display:flex;align-items:center;gap:10px;min-width:130px}
.pago-cel .barra{flex:1}
.pago-cel small{width:34px;text-align:right;font-weight:700;color:var(--tinta-2)}
.filtros{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.busca.local{margin-left:0;width:min(300px,100%)}
.cartoes-cli{display:none}

/* contratos */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));align-items:start;gap:14px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.coluna{background:#ecebe4;border-radius:var(--raio);padding:12px;display:flex;flex-direction:column;gap:10px;scroll-snap-align:start;min-width:0}
.coluna-cab{display:flex;align-items:center;justify-content:space-between;padding:2px 4px}
.coluna-cab b{display:flex;align-items:center;gap:8px;font-size:13.5px}
.coluna-cab b i{width:8px;height:8px;border-radius:50%}
.coluna-cab small{font-size:12px;color:var(--tinta-2);font-weight:700}
.coluna-cab .qtd{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:999px;background:#fff;font-size:12px}
.card{background:var(--cartao);border-radius:14px;padding:13px;border:1px solid var(--linha);cursor:pointer;display:flex;flex-direction:column;gap:9px;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:var(--sombra)}
.card b{font-size:14px;line-height:1.3}
.card .linha{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--suave)}
.card .valor{font-weight:800;color:var(--tinta);font-size:14px}
.aviso{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--perigo);background:var(--perigo-claro);padding:4px 8px;border-radius:8px}

/* financeiro */
.grafico svg{width:100%;height:auto;display:block}
.grafico .rotulo{font-size:11px;fill:var(--suave);font-weight:600}
.grafico .valor-barra{font-size:10.5px;fill:var(--tinta-2);font-weight:700}
.grafico rect.b{transition:opacity .2s}
.grafico rect.b:hover{opacity:.8}
.leg-graf{display:flex;gap:16px;font-size:12.5px;color:var(--tinta-2);font-weight:600}
.leg-graf span{display:inline-flex;align-items:center;gap:6px}
.leg-graf i{width:10px;height:10px;border-radius:3px}
.rank{display:flex;flex-direction:column;gap:14px}
.rank-l{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:center}
.rank-l .pos{width:26px;height:26px;border-radius:8px;background:var(--linha-2);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--tinta-2)}
.rank-l b{display:block;font-size:14px}
.rank-l .barra{margin-top:6px}
.rank-l .dir{text-align:right}
.rank-l .dir b{font-size:14px}
.rank-l .dir small{display:block;font-size:12px;color:var(--suave)}
.itens-bar{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.item-bar{padding:12px;border-radius:14px;background:#f8f7f2;border:1px solid var(--linha-2)}
.item-bar small{display:block;color:var(--suave);font-size:12px;font-weight:600}
.item-bar b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.item-bar span{font-size:12px;color:var(--tinta-2)}
.sit{font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px;white-space:nowrap}
.sit.pago{background:var(--ok-claro);color:var(--ok)}
.sit.aberto{background:var(--linha-2);color:var(--tinta-2)}
.sit.hoje{background:#fbf2cf;color:#8a6d00}
.sit.atrasada{background:var(--perigo-claro);color:var(--perigo)}

/* atendimento */
.funil{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;overflow:hidden}
.funil div{padding:18px 20px;border-left:1px solid var(--linha-2);position:relative}
.funil div:first-child{border-left:0}
.funil small{display:block;color:var(--suave);font-size:12.5px;font-weight:600}
.funil b{display:block;font-size:28px;font-weight:800;letter-spacing:-.03em;margin-top:4px}
.funil span{font-size:12px;font-weight:700;color:var(--verde)}
.origens{display:flex;height:12px;border-radius:999px;overflow:hidden;margin:6px 0 14px}
.origens i{display:block;height:100%}
.origens-leg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px 16px;font-size:13px}
.origens-leg span{display:flex;align-items:center;gap:8px;color:var(--tinta-2);font-weight:600}
.origens-leg span i{width:10px;height:10px;border-radius:3px}
.origens-leg b{margin-left:auto;color:var(--tinta)}
.novo-agora{animation:brilha 2.4s ease 2}
@keyframes brilha{0%,100%{background:transparent}30%{background:#fbf2cf}}

/* equipe */
.pessoa{padding:18px;display:flex;flex-direction:column;gap:12px}
.pessoa-topo{display:flex;align-items:center;gap:12px}
.pessoa-topo b{display:block;font-size:15px}

.marca-ok{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--verde-claro);color:var(--verde)}
.marca-ver{font-size:11.5px;font-weight:700;color:var(--tinta-2);background:var(--linha-2);padding:3px 8px;border-radius:7px}
.marca-nao{color:#c3c8c4;font-weight:700}

/* gaveta (detalhes) */
.veu{position:fixed;inset:0;z-index:60;background:#0f1a1466;opacity:0;pointer-events:none;transition:opacity .25s}

.gaveta{position:fixed;z-index:61;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--cartao);box-shadow:-20px 0 60px -20px #0f1a1440;transform:translateX(104%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.gaveta.aberta{transform:none}
.gaveta-cab{padding:22px 24px 16px;border-bottom:1px solid var(--linha-2);position:relative}
.gaveta-cab .fechar{position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--linha-2)}
.gaveta-cab h3{font-size:21px;letter-spacing:-.02em;line-height:1.2;margin:10px 44px 4px 0}

.abas-g button{padding:7px 12px;border-radius:9px;font-weight:700;font-size:13px;color:var(--tinta-2)}
.abas-g button.ativo{background:#fff;color:var(--tinta);box-shadow:0 1px 2px #0000001a}
.fatos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fato{padding:12px 14px;border-radius:14px;background:#f8f7f2;border:1px solid var(--linha-2)}

.fato b{display:flex;align-items:center;gap:8px;font-size:14.5px;margin-top:3px}
.secao-g h4{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--suave);margin-bottom:10px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{padding:6px 10px;border-radius:10px;background:var(--linha-2);font-size:12.5px;font-weight:600}

.parcela{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--linha-2);font-size:13.5px}
.parcela:first-child{border-top:0}
.parcela small{display:block;color:var(--suave);font-size:12px}
.check{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--linha-2);cursor:pointer;font-weight:600;transition:background .15s}
.check + .check{margin-top:6px}
.check i{width:22px;height:22px;border-radius:7px;border:2px solid #c9cec7;display:grid;place-items:center;color:#fff;flex:none;transition:all .15s}
.check.feito{background:#f6faf7}
.check.feito i{background:var(--verde);border-color:var(--verde)}
.check.feito span{color:var(--suave);text-decoration:line-through}
.linha-tempo{position:relative;padding-left:22px}
.linha-tempo::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--linha-2)}
.marco{position:relative;padding:0 0 16px}
.marco::before{content:"";position:absolute;left:-21px;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--c,var(--verde))}
.marco b{display:block;font-size:13.5px}
.marco p{font-size:13.5px;line-height:1.45}
.marco p b{display:inline}
.marco small{color:var(--suave);font-size:12px}
.balao{padding:12px 14px;border-radius:14px 14px 14px 4px;background:#f1f5f2;font-size:14px;line-height:1.5}
.gaveta-pe{display:flex;gap:8px;padding:14px 24px;border-top:1px solid var(--linha-2);flex-wrap:wrap}
.gaveta-pe .botao{flex:1}

/* modal */
.modal{position:fixed;z-index:62;left:50%;top:50%;width:min(480px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;transition:all .25s cubic-bezier(.2,.8,.2,1);padding:24px}
.modal.aberto{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal h3{font-size:20px;letter-spacing:-.02em}
.modal p.sub{color:var(--suave);margin:4px 0 18px}
.campo{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.campo label{font-size:12.5px;font-weight:700;color:var(--tinta-2)}
.campo input,.campo select{height:44px;border-radius:12px;border:1px solid var(--linha);padding:0 12px;background:#fff;outline:0}
.campo input:focus,.campo select:focus{border-color:var(--verde);box-shadow:0 0 0 3px #2d6a4f22}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.toast{position:fixed;z-index:80;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--tinta);color:#fff;padding:13px 18px;border-radius:14px;font-weight:600;box-shadow:0 18px 40px -12px #0007;transition:all .3s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;gap:10px;max-width:calc(100vw - 32px)}
.toast.ver{opacity:1;transform:translate(-50%,0)}
.toast i{width:22px;height:22px;border-radius:50%;background:#22c55e;display:grid;place-items:center;flex:none}
.selo-demo{position:fixed;z-index:20;right:16px;bottom:16px;display:inline-flex;align-items:center;gap:8px;padding:8px 12px 8px 10px;border-radius:999px;background:#fff;border:1px solid var(--linha);box-shadow:var(--sombra);font-size:12px;font-weight:700;color:var(--tinta-2)}
.selo-demo i{width:8px;height:8px;border-radius:50%;background:var(--ouro)}
.abas{display:none}

/* ---------- telas médias: menu só com ícones ---------- */
@media (max-width:1180px){

  .quem{margin-top:auto;background:transparent;padding:0}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .agenda-grade{grid-template-columns:1fr}
}

}

  .g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .g2,.g4.pessoas{grid-template-columns:1fr}
  .grade{gap:12px}
  .kpi{padding:14px}
  .kpi .rot{font-size:12px}
  .kpi .rot i{display:none}
  .kpi .valor{font-size:21px}
  .kpi svg.linha{display:none}
  .kpi .det{font-size:11.5px}
  .cartao-cab{padding:16px 16px 4px}
  .cartao-corpo{padding:8px 16px 16px}
  .item .fim{min-width:0}
  .item .fim .pilha,.item .fim .av{display:none}
  .legenda{margin-left:0;width:100%;gap:10px;font-size:12px}

  .dia{min-height:54px;padding:5px 2px;align-items:center;gap:5px}

  .dia .pontos{display:flex}
  .cal-sem span{padding:8px 0;text-align:center;font-size:10.5px}
  .tabela.clientes{display:none}
  .cartoes-cli{display:flex;flex-direction:column}

  .kanban{grid-template-columns:repeat(5,82%);gap:10px;margin:0 -16px;padding:0 16px 6px;scroll-padding:0 16px}

  .matriz th,.matriz td{padding:10px 6px;font-size:12px}

  .gaveta{top:auto;width:100%;max-height:88vh;border-radius:24px 24px 0 0;transform:translateY(104%)}
  .gaveta-cab{padding:20px 18px 14px}
  .gaveta-cab::before{content:"";position:absolute;left:50%;top:8px;width:40px;height:4px;margin-left:-20px;border-radius:4px;background:#d9dbd4}

}

        <div class="cartao"><div class="cartao-cab"><h3>Próximos recebimentos</h3></div>

        <div class="cartao"><div class="cartao-cab"><h3>Entradas recentes</h3></div><div class="cartao-corpo">${entradas.map(p => `<div class="parcela"><div><b>${esc(p.cliente)}</b><small>Parcela ${p.n}/${p.de} · ${p.forma} · ${dm(p.pagoEm)}</small></div><span></span><b style="color:var(--ok)">+ ${moeda(p.valor)}</b></div>`).join("")}</div></div>
      </div>`;
  }
  function grafico(meses) {
    const cel = CEL.matches, W = cel ? 360 : 640, H = cel ? 210 : 230, base = H - 32, topo = 22, n = meses.length, larg = W / n;
    const mx = Math.max(...meses.map(m => m.pago + m.previsto)) * 1.08;
    const y = v => base - v / mx * (base - topo);
    const linhas = [0.25, 0.5, 0.75, 1].map(f => `<line x1="0" x2="${W}" y1="${y(mx * f / 1.08 * 1)}" y2="${y(mx * f / 1.08)}" stroke="#efeee8"/>`).join("");
    const barras = meses.map((m, i) => {
      const x = i * larg + larg * 0.2, w = larg * 0.6;
      const yp = y(m.pago), yt = y(m.pago + m.previsto);
      return `<g><title>${MES[m.d.getMonth()]}: ${moeda(m.pago)} recebido${m.previsto ? " + " + moeda(m.previsto) + " a receber" : ""}</title>
        ${m.previsto ? `<rect class="b" x="${x}" y="${yt}" width="${w}" height="${Math.max(0, yp - yt)}" rx="5" fill="#cfe3d6"/>` : ""}
        ${m.pago ? `<rect class="b" x="${x}" y="${yp}" width="${w}" height="${base - yp}" rx="5" fill="${m.atual ? "#1d4a37" : "#2d6a4f"}"/>` : ""}
        <text class="rotulo" x="${x + w / 2}" y="${base + 18}" text-anchor="middle" style="${cel ? "font-size:12px;" : ""}${m.atual ? "fill:#17201b;font-weight:800" : ""}">${MES[m.d.getMonth()].slice(0, 3)}</text>
        ${m.atual ? `<text class="valor-barra" x="${x + w / 2}" y="${yt - 8}" text-anchor="middle" style="${cel ? "font-size:12px" : ""}">${Math.round((m.pago + m.previsto) / 1000)} mil</text>` : ""}</g>`;
    }).join("");
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Receita por mês">${linhas}${barras}</svg>`;
  }

        </div>
        <div class="secao-g"><h4>Incluso no pacote</h4><div class="tags">${p.inclui.map(x => `<span>${esc(x)}</span>`).join("")}</div></div>
        ${e.adic.length ? `<div class="secao-g"><h4>Adicionais</h4><div class="tags">${e.adic.map(a => `<span style="background:#f7f0de">${esc(ADICIONAIS[a].nome)}</span>`).join("")}</div></div>` : ""}
        ${e.fechado ? `<div class="pagamento-res"><div class="topo-p"><small>Pago ${moeda(e.pago)} de ${moeda(e.valor)}</small><b>${pct(e)}%</b></div><div class="barra"><b style="width:${pct(e)}%"></b></div><small>${prox ? `Próxima parcela: ${moeda(prox.valor)} em ${dm(prox.vence)} (${prox.forma})` : "Tudo pago. 🎉"}</small></div>` : `<div class="pagamento-res"><div class="topo-p"><small>Valor do orçamento</small><b>${moeda(e.valor)}</b></div><small>${e.status === "contrato" ? "Contrato enviado pelo link, esperando a assinatura." : "Orçamento enviado. Falta a visita ou a resposta do cliente."}</small></div>`}`,
      pagamentos: e.parcelas.length ? `<div>${e.parcelas.map(x => `<div class="parcela"><div><b>Parcela ${x.n}/${x.de}</b><small>${x.forma} · vence ${dm(x.vence)}</small></div><span class="sit ${x.situacao}">${{ pago: "Pago", aberto: "A vencer", hoje: "Vence hoje", atrasada: "Atrasada" }[x.situacao]}</span><b>${moeda(x.valor)}</b></div>`).join("")}</div>` : `<p style="color:var(--suave)">As parcelas aparecem quando o contrato for assinado.</p>`,
      checklist: `<div id="checklist">${checklistDe(e).map((c, i) => `<div class="check ${c.ok ? "feito" : ""}" data-check="${e.id}:${i}"><i>${ic("ok", "width:14px;height:14px;stroke-width:3")}</i><span>${esc(c.t)}</span></div>`).join("")}</div>`,
      historico: `<div class="linha-tempo">${historicoDe(e).map(([d, t, s]) => `<div class="marco"><b>${esc(t)}</b><small>${dm(d)} · ${esc(s)}</small></div>`).join("")}</div>`,
    };
    abrirGaveta(`<div class="gaveta-cab"><button class="fechar" aria-label="Fechar">${ic("x")}</button>
        <div style="display:flex;gap:6px;flex-wrap:wrap">${pill(e.tipo)}${pill(e.status, STATUS)}</div>
        <h3>${esc(e.cliente)}</h3><p>${esc(dataLonga(e.data))} · ${emQuanto(e.data)}</p>
        <div class="abas-g">${abas.map(([k, n]) => `<button data-aba="${e.id}:${k}" class="${k === aba ? "ativo" : ""}">${n}</button>`).join("")}</div></div>
      <div class="gaveta-corpo">${corpo[aba]}</div>
      <div class="gaveta-pe"><button class="botao leve" data-acao="zap">${ic("whatsapp")}WhatsApp</button><button class="botao primario" data-acao="${e.status === "contrato" ? "lembrar" : "editar"}">${e.status === "contrato" ? "Lembrar da assinatura" : "Editar reserva"}</button></div>`);
  }
  function abrirCompromisso(id) {
    const c = COMPROMISSOS.concat(compromissosExtras).find(x => x.id === id); if (!c) return;
    const t = TIPOS[c.tipo], p = pedidos().find(x => x.nome === c.cliente), e = EVENTOS.find(x => x.cliente === c.cliente);
    abrirGaveta(`<div class="gaveta-cab"><button class="fechar" aria-label="Fechar">${ic("x")}</button>${pill(c.tipo)}<h3>${esc(c.titulo)}</h3><p>${esc(dataLonga(c.data))}, ${c.ini} · ${emQuanto(c.data)}</p></div>
      <div class="gaveta-corpo"><div class="fatos"><div class="fato"><small>Com</small><b>${esc(c.cliente)}</b></div><div class="fato"><small>Responsável</small><b>${av(c.resp, "p")}${PESSOA[c.resp].curto}</b></div></div>
        <div class="secao-g"><h4>Lembretes</h4><div class="check feito"><i>${ic("ok", "width:14px;height:14px;stroke-width:3")}</i><span>Confirmação enviada no WhatsApp</span></div><div class="check"><i>${ic("ok", "width:14px;height:14px;stroke-width:3")}</i><span>${c.tipo === "degustacao" ? "Separar os pratos escolhidos" : c.tipo === "reuniao" ? "Levar a planta das mesas" : "Deixar o salão montado para a visita"}</span></div></div></div>
      <div class="gaveta-pe">${p ? `<button class="botao leve" data-abrir="pd:${p.id}">Ver pedido</button>` : e ? `<button class="botao leve" data-abrir="ev:${e.id}">Ver a festa</button>` : ""}<button class="botao primario" data-acao="confirmar">Confirmar presença</button></div>`);
  }
  function abrirPedido(id) {
    const p = pedidos().find(x => x.id === id); if (!p) return;
    const o = ORIGENS[p.origem];
    abrirGaveta(`<div class="gaveta-cab"><button class="fechar" aria-label="Fechar">${ic("x")}</button>
        <div style="display:flex;gap:6px;flex-wrap:wrap">${pill(p.tipo)}${pill(p.status, ETAPAS_PEDIDO)}</div><h3>${esc(p.nome)}</h3><p>Chegou ${haQuanto(p.quando)} pelo ${o.nome}</p></div>
      <div class="gaveta-corpo">
        <div class="balao">${esc(p.msg || "")}</div>
        <div class="fatos"><div class="fato"><small>Data desejada</small><b>${p.data ? esc(dataCurta(p.data)) : "a combinar"}</b></div><div class="fato"><small>Convidados</small><b>${p.conv || "?"}</b></div>
          <div class="fato"><small>Pacote de interesse</small><b>${p.pacote ? PACOTES[p.pacote].nome : "a definir"}</b></div><div class="fato"><small>Atendendo</small><b>${av(p.resp, "p")}${PESSOA[p.resp].curto}</b></div></div>
        ${p.data ? `<div class="dia-livre">${ic("agenda")}<span>${todosEventos().some(e => mesmoDia(e.data, p.data) && e.status !== "orcamento") ? "Essa data já tem festa. Ofereça outra." : "A data está livre na agenda."}</span></div>` : ""}
        <div class="secao-g"><h4>Mudar a etapa</h4><div class="chips">${Object.keys(ETAPAS_PEDIDO).map(k => `<button class="chip so-texto ${p.status === k ? "ativo" : ""}" data-etapa="${p.id}:${k}">${ETAPAS_PEDIDO[k].nome}</button>`).join("")}</div></div>
      </div>
      <div class="gaveta-pe"><button class="botao leve" data-acao="zap">${ic("whatsapp")}Responder</button><button class="botao primario" data-visita="${p.id}">Marcar visita</button></div>`);
  }
  function abrirMais() {
    abrirGaveta(`<div class="gaveta-cab"><button class="fechar" aria-label="Fechar">${ic("x")}</button><h3>Mais</h3><p>Tudo do painel do espaço.</p></div>
      <div class="gaveta-corpo"><div class="lista">${VISTAS.filter(([v]) => pode(v)).map(([v, n]) => `<a class="item" href="#${v}" data-fecha="1"><span class="origem" style="background:var(--verde-claro);color:var(--verde)">${ic(v)}</span><div class="meio"><b>${n}</b></div>${ic("dir")}</a>`).join("")}</div>
        <div class="secao-g"><h4>Ver o painel como</h4><div class="chips">${EQUIPE.map(p => `<button class="chip ${p === eu ? "ativo" : ""}" data-como="${p.id}">${av(p.id, "p")}${esc(p.curto)}</button>`).join("")}</div></div>
        <a class="dia-livre" href="agenda-online.html" target="_blank" rel="noopener">${ic("estrela")}<span>Abrir a agenda online que o cliente usa</span></a></div>`);
  }

  /* ---------- nova reserva ---------- */
  const modal = $("#modal");
  function abrirModal(dataPadrao) {
    const d = dataPadrao || V.sab(12);
    modal.innerHTML = `<h3 id="t-modal">Nova reserva</h3><p class="sub">A data fica bloqueada na agenda e na agenda online.</p>
      <div class="campo"><label for="n-nome">Cliente</label><input id="n-nome" required placeholder="Ex.: Camila & Rafael" autocomplete="off"></div>
      <div class="duas"><div class="campo"><label for="n-tipo">Festa</label><select id="n-tipo">${["casamento", "quinze", "aniversario", "infantil", "corporativo"].map(t => `<option value="${t}">${TIPOS[t].nome}</option>`).join("")}</select></div>
        <div class="campo"><label for="n-data">Data</label><input id="n-data" type="date" value="${V.chave(d)}" required></div></div>
      <div class="duas"><div class="campo"><label for="n-conv">Convidados</label><input id="n-conv" type="number" min="20" max="400" value="120"></div>
        <div class="campo"><label for="n-pac">Pacote</label><select id="n-pac">${Object.keys(PACOTES).map(k => `<option value="${k}" ${k === "classico" ? "selected" : ""}>${PACOTES[k].nome}</option>`).join("")}</select></div></div>
      <div class="campo"><label for="n-resp">Responsável</label><select id="n-resp">${EQUIPE.filter(p => p.acesso.agenda === "editar").map(p => `<option value="${p.id}" ${p === eu ? "selected" : ""}>${esc(p.nome)}</option>`).join("")}</select></div>
      <div style="display:flex;gap:8px;margin-top:6px"><button type="button" class="botao leve" data-acao="fechar-modal" style="flex:1">Cancelar</button><button class="botao primario" style="flex:1.4">Reservar a data</button></div>`;
    veu.classList.add("aberto"); modal.classList.add("aberto");
    setTimeout(() => $("#n-nome")?.focus(), 60);
  }
  function fecharModal() { modal.classList.remove("aberto"); if (!gav.classList.contains("aberta")) veu.classList.remove("aberto"); }
  modal.addEventListener("submit", ev => {
    ev.preventDefault();
    const [a, m, d] = $("#n-data").value.split("-").map(Number);
    const e = { id: "novo-" + Date.now(), cliente: $("#n-nome").value.trim() || "Novo cliente", tipo: $("#n-tipo").value, data: new Date(a, m - 1, d), ini: "19:00", fim: "02:00", conv: Number($("#n-conv").value) || 100, pacote: $("#n-pac").value, adic: [], resp: $("#n-resp").value, producao: "leo", fechado: null, origem: "whatsapp", status: "orcamento", parcelas: [], pago: 0 };
    e.valor = V.valorDe(e);
    novosEventos.push(e);
    fecharModal();
    mesVisto = new Date(e.data.getFullYear(), e.data.getMonth(), 1); diaSel = e.data;
    renderTudo(); location.hash = "agenda"; mostrar("agenda");
    aviso(`Data de ${dataCurta(e.data)} reservada para ${e.cliente}. Já sai da agenda online.`);
  });

  /* ---------- aviso ---------- */
  let tAviso = null;
  function aviso(txt) {
    const t = $("#toast"); t.lastChild.textContent = txt; t.classList.add("ver");
    clearTimeout(tAviso); tAviso = setTimeout(() => t.classList.remove("ver"), 3200);
  }

  /* ---------- cliques ---------- */
  document.addEventListener("click", ev => {
    const alvo = ev.target;
    const ab = alvo.closest("[data-abrir]");
    if (ab) {
      ev.stopPropagation();
      const [tipo, id] = ab.dataset.abrir.split(":");
      if (tipo === "ev") abrirEvento(id); else if (tipo === "cp") abrirCompromisso(id); else if (tipo === "pd") abrirPedido(id);
      return;
    }
    if (alvo.closest(".fechar") || alvo.closest("[data-fecha]")) { fecharGaveta(); return; }
    const aba = alvo.closest("[data-aba]"); if (aba) { const [id, k] = aba.dataset.aba.split(":"); abrirEvento(id, k); return; }
    const ck = alvo.closest("[data-check]");
    if (ck) { const [id, i] = ck.dataset.check.split(":"); const c = checklists[id][i]; c.ok = !c.ok; ck.classList.toggle("feito", c.ok); if (c.ok) aviso(`“${c.t}” feito. A equipe toda vê.`); return; }
    const dia = alvo.closest("[data-dia]");
    if (dia) { const [a, m, d] = dia.dataset.dia.split("-").map(Number); diaSel = new Date(a, m - 1, d); renderAgenda(); return; }
    const mesB = alvo.closest("[data-mes]");
    if (mesB) { const k = Number(mesB.dataset.mes); mesVisto = k ? new Date(mesVisto.getFullYear(), mesVisto.getMonth() + k, 1) : new Date(HOJE.getFullYear(), HOJE.getMonth(), 1); if (!k) diaSel = HOJE; renderAgenda(); return; }
    const pes = alvo.closest("[data-pessoa]");
    if (pes) { filtroPessoa = pes.dataset.pessoa; renderAgenda(); if (filtroPessoa !== "todos" && !VIDEO) aviso(`Em destaque: o que está com ${PESSOA[filtroPessoa].curto}.`); return; }
    const fc = alvo.closest("[data-filtro-cli]"); if (fc) { filtroCli = fc.dataset.filtroCli; renderClientes(); return; }
    const como = alvo.closest("[data-como]"); if (como) { fecharGaveta(); trocarUsuario(como.dataset.como); return; }
    const et = alvo.closest("[data-etapa]");
    if (et) { const [id, k] = et.dataset.etapa.split(":"); const p = pedidos().find(x => x.id === id); if (p) { setEtapa(p, k); renderInicio(); renderAtendimento(); montarMenu(); abrirPedido(id); aviso(`${p.nome}: ${ETAPAS_PEDIDO[k].nome.toLowerCase()}.`); } return; }
    const vis = alvo.closest("[data-visita]");
    if (vis) {
      const p = pedidos().find(x => x.id === vis.dataset.visita);
      if (p) { setEtapa(p, "visita"); const c = { id: "vx" + Date.now(), tipo: "visita", titulo: "Visita · " + p.nome, data: V.somar(HOJE, 2), ini: "10:00", resp: p.resp, cliente: p.nome }; compromissosExtras.push(c); fecharGaveta(); renderTudo(); montarMenu(); aviso(`Visita de ${p.nome} marcada para ${dataCurta(c.data)}, 10h. ${p.nome.split(" ")[0]} recebe a confirmação no WhatsApp.`); }
      return;
    }
    const ac = alvo.closest("[data-acao]");
    if (ac) {
      const a = ac.dataset.acao;
      if (a === "nova") abrirModal(diaSel >= HOJE ? diaSel : null);
      else if (a === "fechar-modal") fecharModal();
      else if (a === "zap") aviso("Na versão de verdade, abre a conversa no WhatsApp.");
      else if (a === "lembrar") { fecharGaveta(); aviso("Lembrete enviado: o cliente recebe o link do contrato de novo."); }
      else if (a === "editar") aviso("Na versão de verdade, dá para mudar pacote, convidados e adicionais aqui.");
      else if (a === "confirmar") { fecharGaveta(); aviso("Presença confirmada."); }
      else if (a === "exportar") aviso("Na versão de verdade, baixa a planilha do mês para o contador.");
      else if (a === "convidar") aviso("Na versão de verdade, a pessoa recebe um convite por e-mail para criar a senha.");
      return;
    }
  });
  $("#nova").addEventListener("click", () => abrirModal());
  $("#sino").addEventListener("click", () => { const n = pedidos().filter(p => p.status === "novo"); aviso(n.length ? `${n.length} pedido${n.length > 1 ? "s" : ""} novo${n.length > 1 ? "s" : ""} esperando resposta.` : "Nenhum aviso novo."); });
  $("#busca").addEventListener("input", e => { buscaCli = e.target.value; filtroCli = "todos"; renderClientes(); if (atual !== "clientes") { location.hash = "clientes"; } });
  document.addEventListener("input", e => { if (e.target.id === "busca-cli") { buscaCli = e.target.value; const pos = e.target.selectionStart; renderClientes(); const i = $("#busca-cli"); i.focus(); i.setSelectionRange(pos, pos); } });

  /* ---------- começa ---------- */
  montarMenu(); renderTudo();
  CEL.addEventListener?.("change", renderFinanceiro);
  mostrar(location.hash.slice(1) || "inicio", false);
  const recente = V.pedidosDoNavegador()[0];
  if (recente && Date.now() - recente.quando < 10 * 60000 && !VIDEO) setTimeout(() => aviso(`Pedido novo pela agenda online: ${recente.nome}, ${TIPOS[recente.tipo].nome.toLowerCase()} em ${dataCurta(recente.data)}.`), 600);
})();
</script>
</body>
</html>
